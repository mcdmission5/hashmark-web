// compact per-game line per category
const GLOG_SHOW = {passing:[["YDS","yds"],["TD","TD"]],rushing:[["CAR","car"],["YDS","yds"],["TD","TD"]],
  receiving:[["REC","rec"],["YDS","yds"],["TD","TD"]],defensive:[["TOT","tot"],["TFL","TFL"],["SACKS","sk"]],
  kicking:[["FGM","FG"],["PTS","pts"]]};
const CAT_ORDER = ["passing","rushing","receiving","defensive","kicking"];
// UG1 shrinkage explainer — ONE source for the player page and the U35 team
// Players panel (the badge must mean the same thing everywhere it appears).
const SHRINK_TIP="Below the qualifying floor (150 QB plays · 100 carries · 40 targets · 10 kicks), the number shown is shrunk toward 50 — the FBS average — in proportion to sample size, and it ranks nowhere until it qualifies. Small samples lie; the shrinkage says so out loud.";
// QA-FIX-1 P2-3 established the two-badge split (coverage gap vs small sample).
// U69 makes it WEEK-AWARE and MEASURED: U62 proved attribution is temporal, not flat
// (2025: weeks 1-8 ~97-99% of rushes named, weeks 9-16 ~1%), so season-flat workload
// thresholds mis-badged both ends. Now the player's OWN attributed share decides
// (graded < 60% of official workload — the U62 exclusion rule), the tip carries HIS
// measured numbers, and the era line quotes the pbp_coverage_week table the engine
// publishes — an early-week line with real coverage never badges; a late-week gap
// always does, with the number.
let _covRows=null;
async function ensureCoverage(){
  if(_covRows) return _covRows;
  try{ _covRows=await api(`pbp_coverage_week?select=season,week,role,plays,attributed,pct&order=season.desc,week.asc&limit=200`); }
  catch(_e){ _covRows=[]; }
  return _covRows;
}
function covEraLine(season, role){
  const rows=(_covRows||[]).filter(r=>r.season===season&&r.role===role);
  if(!rows.length) return "";
  const pc=xs=>Math.round(100*xs.reduce((a,r)=>a+r.attributed,0)/Math.max(1,xs.reduce((a,r)=>a+r.plays,0)));
  const late=rows.filter(r=>r.week>=9);
  const who=role==="rush"?"the ball-carrier":"the target";
  if(late.length && pc(rows.filter(r=>r.week<=8))-pc(late)>=20)
    return ` Public play-by-play named ${who} on ~${pc(rows.filter(r=>r.week<=8))}% of plays through week 8 but ~${pc(late)}% after (${season}, measured) — late-season work goes untracked.`;
  return ` Public play-by-play named ${who} on ~${pc(rows)}% of ${season} plays (measured).`;
}
function attributionStarved(gradeRow, cats){
  if(!gradeRow || gradeRow.qualified || !cats) return false;
  // player_season stats key UPPERCASE (CAR/REC) — the original lowercase read always
  // returned 0, the second half of why this branch had never fired (U69 verify)
  const g=(c,k)=>{ const o=(cats||{})[c]||{}; return Number(o[k] ?? o[k.toUpperCase()] ?? 0); };
  const graded=Number(gradeRow.plays||0), role=String(gradeRow.role||"");
  // the grade tables store role='rush' — the original 'rushing' equality NEVER matched,
  // so the rusher LIMITED branch had silently never fired (caught in U69's verify)
  if(/^rush/.test(role))     { const car=g("rushing","car"); return car>=20 && graded<0.6*car; }
  if(role==="receiving")     { const rec=g("receiving","rec"); return rec>=10 && graded<0.6*rec; }
  return false;   // QB passing + kicking attribution is near-complete — a miss there IS low sample
}
function sampleBadge(gradeRow, cats){
  if(!gradeRow || gradeRow.qualified) return "";
  if(attributionStarved(gradeRow, cats)){
    const g=(c,k)=>{ const o=(cats||{})[c]||{}; return Number(o[k] ?? o[k.toUpperCase()] ?? 0); };
    const rush=/^rush/.test(String(gradeRow.role||""));
    const graded=Number(gradeRow.plays||0);
    const off=rush?g("rushing","car"):g("receiving","rec");
    const season=Number(gradeRow.season)||SEASON_RESULTS;
    const tip=`Play attribution is incomplete: only ${graded} of this player's ${off} official `
      +(rush?`carries carry his name as ball-carrier`:`catches have an attributed target`)
      +` in the public play-by-play, so the graded-play count sits under the qualifying floor even though the official workload clears it.`
      +covEraLine(season, rush?"rush":"recv")
      +` The grade is shrunk toward 50 on the plays we can attribute — a data-coverage limit, not a usage one.`;
    return `<span class="lowsample limited" data-tip="${esc(tip)}">LIMITED DATA</span>`;
  }
  return `<span class="lowsample" data-tip="${esc(SHRINK_TIP)}">LOW SAMPLE</span>`;
}

// U36b: one opponents-aggregate cell for a stat row. Honest math from what the
// rows actually are: stored stats are per-game/rate values, so PER-GAME stats
// combine exactly as (sum of opponents' implied totals) / (their combined games)
// — the tooltip carries the combined total; RATE stats get a games-weighted
// average, said out loud; turnover_margin (the one season total) sums. Opponents
// are deduped (a rematch doesn't double a season) and FBS-only (no stat rows
// exist for FCS — the header note states the exclusion).
function oppAggCell(d, opp, school){
  if(!opp || !opp.n || d.stat_group==="Schedule") return null;
  const rows=opp.rows[d.stat_key];
  if(!rows || !rows.length) return null;
  const G=rows.reduce((a,r)=>a+r.g,0);
  if(!G) return null;
  const wmean=rows.reduce((a,r)=>a+r.v*r.g,0)/G;
  const sgn=v=>(v>0&&/margin/.test(d.stat_key)?"+":"")+Math.round(v).toLocaleString();
  if(d.stat_key==="turnover_margin"){
    const tot=rows.reduce((a,r)=>a+r.v,0);
    return {val:fmtStat(tot,d.format),
      tip:`Combined ${d.display_name} of ${school}'s ${rows.length} FBS opponents: ${sgn(tot)} total across ${G} games (${(tot/G>0?"+":"")+(tot/G).toFixed(2)} per game).`};
  }
  if(/_pg$|per_game/.test(d.stat_key)||d.stat_key==="possession_time"||d.stat_key==="scoring_margin"){
    const tot=rows.reduce((a,r)=>a+r.v*r.g,0);
    return {val:fmtStat(wmean,d.format),
      tip:`${school}'s ${rows.length} FBS opponents combined: ${d.stat_key==="possession_time"?fmtStat(wmean,d.format)+" per game":sgn(tot)+" total, "+fmtStat(wmean,d.format)+" per game"} across their ${G} games.`};
  }
  return {val:fmtStat(wmean,d.format),
    tip:`Games-weighted average ${d.display_name} across ${school}'s ${rows.length} FBS opponents (${G} combined games).`};
}
function statProfile(cat, statsRows, school, season, opp){
  season = season || STAT_SEASON;
  const cur={}, prior={};
  statsRows.forEach(r=>{ if(Number(r.season)===season) cur[r.stat_key]=r;
    else if(Number(r.season)===season-1) prior[r.stat_key]=r; });
  const hasOpp=!!(opp&&opp.n);
  let h=`<div class="sec${hasOpp?" wopp":""}"><div class="sectitle">${season} stat profile</div>
    <div class="secsub">Official season stats with national rank + percentile. Tap a label for what it means.${hasOpp?` <b>OPP</b> = the same stat combined across the ${opp.n} FBS opponents on the ${season} schedule (games-weighted; tap a value for the math${opp.fcs?`; ${opp.fcs} FCS game${opp.fcs>1?"s":""} excluded — no FBS stat rows exist`:""}).`:""} Source: CFBD.</div>`;
  if(hasOpp) h+=`<div class="statcolhead"><div class="chs">STAT</div><div class="cht">TEAM</div>
    <div class="cho" data-tip="What ${esc(school)}'s ${season} FBS opponents did in the same stat, combined across their own seasons (games-weighted). Schedule context: us vs what our opponents did.">OPP</div>
    <div class="chr">RANK</div><div class="chx"></div></div>`;
  let any=false;
  STAT_GROUPS.forEach(grp=>{

    if(!defs.length) return;
    any=true;
    const sideTag = grp==="Defense"?`<span class="sd def">DEF</span>`:grp==="Offense"?`<span class="sd off">OFF</span>`:"";
    h+=`<div class="statgrp"><div class="sgtitle">${grp}${sideTag}</div>`;
    defs.forEach(d=>{
      const r=cur[d.stat_key], pct=Number(r.percentile), bkt=rankBucket(pct), val=fmtStat(r.value,d.format);
      const baseV=_baselines&&_baselines.stat[d.stat_key];
      const tip=`${esc(d.display_name)} — ${esc(d.description)} ${esc(statExample(d, school, r.value, baseV))} #${r.rank} nationally (${ordinal(Math.round(pct))} percentile, ${STAT_SEASON}).`;
      const pr=prior[d.stat_key];
      let dlt=`<div class="dlt"></div>`;
      if(pr){ const dv=Number(pr.rank)-Number(r.rank);
        dlt = dv ? `<div class="dlt ${dv>0?"up":"down"}" data-tip="2024 rank #${pr.rank} to 2025 #${r.rank}.">${dv>0?'<svg class="ic" aria-hidden="true"><use href="#i-up"/></svg>':'<svg class="ic" aria-hidden="true"><use href="#i-down"/></svg>'}${Math.abs(dv)}</div>` : `<div class="dlt">—</div>`; }
      const oc=hasOpp?oppAggCell(d, opp, school):null;
      const oppCell=hasOpp?`<div class="sopp"${oc?` data-tip="${esc(oc.tip)}"`:""}>${oc?oc.val:"—"}</div>`:"";
      h+=`<div class="statrow">
        <div class="snm" data-tip="${tip}">${esc(d.display_name)}</div>
        <div class="sval">${val}</div>
        ${oppCell}
        <div class="srk r-${bkt}">#${r.rank}</div>
        <div class="statbar"><i class="bg-${bkt}" style="width:${Math.max(4,pct)}%"></i></div>
        ${dlt}</div>`;
    });
    h+=`</div>`;
  });
  return any ? h+`</div>` : "";
}

function teamLeaders(players){

    const pl=c[p.player]=c[p.player]||{pos:p.position,stats:{}}; pl.stats[p.stat_key]=Number(p.value); });

    for(const nm in c){ const v=c[nm].stats[key]; if(v!=null&&(!best||v>best.v)) best={nm,v,pos:c[nm].pos,stats:c[nm].stats}; }

function teamHonors(honors){
  // batch 12 #4: the team Honors panel — every third-party preseason honor for this
  // team's players across all_america / all_conference / award watch lists, one row per
  // player with the lists CHIP-STACKED ("Walter Camp 1st Team AA · Athlon 1st Team"),
  // each chip linking to its source. Facts + attribution only.
  const isConfPoll=x=>/\(conference poll\)/i.test(x.group_or_poll||"");
  const poll=honors.filter(h=>h.ranking_type==="preseason_poll" && !isConfPoll(h));
  const confPoll=honors.filter(h=>h.ranking_type==="preseason_poll" && isConfPoll(h));
  const NAMED=["preseason_all_america","preseason_all_conference","award_watchlist"];
  const named=honors.filter(h=>NAMED.includes(h.ranking_type) && h.player);
  const oldAA=honors.filter(h=>h.ranking_type==="all_american");
  if(!named.length && !oldAA.length && !poll.length && !confPoll.length) return "";
  // short chip label per honor row
  const shortSrc=s=>String(s||"").replace(" Football Foundation","").replace(" via On3","")
    .replace(" Sports","").replace(/ Conference \(official\)| \(official\)/,"");
  const lvl=s=>String(s||"").replace(/^First/,"1st").replace(/^Second/,"2nd")
    .replace(/ (Offense|Defense|Special Teams)$/,"");
  const chipLbl=x=>{
    if(x.ranking_type==="preseason_all_america") return `${shortSrc(x.source)} ${lvl(x.team_label)} AA`;
    if(x.ranking_type==="award_watchlist") return `${x.group_or_poll} watch list`;
    if(/^(First|Second|Watch List)/.test(x.team_label||""))
      return `${shortSrc(x.group_or_poll)} ${/^Watch List/.test(x.team_label)?"preseason watch list":lvl(x.team_label)+" Team All-Conference"}`;
    return `${shortSrc(x.group_or_poll)} ${x.team_label}`;   // a league preseason award
  };
  // fold the earlier June all_american rows in as chips, skipping outlets that now have a
  // fuller per-outlet list seeded (Phil Steele June subset vs the July full team)
  const newSrc=new Set(named.filter(x=>x.ranking_type==="preseason_all_america")
    .map(x=>shortSrc(x.source).toLowerCase()));
  const folded=oldAA.filter(x=>x.source!=="Consensus" && !newSrc.has(shortSrc(x.source).toLowerCase()))
    .map(x=>({...x, _lbl:`${shortSrc(x.source)} preseason AA`}))
    .concat(oldAA.filter(x=>x.source==="Consensus").map(x=>({...x, _lbl:"Consensus preseason AA (2+ outlets)"})));
  let h=`<div class="sec"><div class="sectitle">Around CFB — preseason 2026</div>
    <div class="secsub">Third-party preseason honors &amp; rankings, attributed and linked to each outlet — <b>not</b> Hashmark ratings.</div>`;
  poll.forEach(x=>{ h+=`<div class="honor"><div class="hb">${esc((x.source||"").toUpperCase().slice(0,10))}</div>
    <div class="hn">Projected <b>#${x.rank}</b> in <a class="srcpill" href="${esc(x.source_url)}" target="_blank" rel="noopener">${esc(x.source)}'s 2026 preseason Top&nbsp;25</a></div></div>`; });
  confPoll.forEach(x=>{ h+=`<div class="honor"><div class="hb">${esc((x.source||"").toUpperCase().slice(0,10))}</div>
    <div class="hn">Picked <b>#${x.rank}</b> in the <a class="srcpill" href="${esc(x.source_url)}" target="_blank" rel="noopener">${esc((x.group_or_poll||"").replace(" (conference poll)",""))} preseason poll</a></div></div>`; });
  const byPlayer={};
  named.concat(folded).forEach(x=>{ const k=normName(x.player);
    (byPlayer[k]=byPlayer[k]||{player:x.player, pos:x.position, items:[]}).items.push(x); });
  Object.values(byPlayer).sort((a,b)=>b.items.length-a.items.length || a.player.localeCompare(b.player))
    .forEach(p=>{
      const chips=p.items.map(x=>{ const lbl=esc(x._lbl||chipLbl(x));
        return x.source_url?`<a class="srcpill" href="${esc(x.source_url)}" target="_blank" rel="noopener">${lbl}</a>`
          :`<span class="srcpill">${lbl}</span>`; }).join(" ");
      h+=`<div class="honor"><div class="hb">${p.items.length}×</div>
        <div class="hn">${esc(p.player)} <small>· ${esc(p.pos||"")}</small><div class="hstack">${chips}</div></div></div>`;
    });
  return h+`</div>`;
}

// B4: custom dropdown — THE app-standard select. items:[{value,label,group?}].
// Accessible combobox pattern: focus stays on the button; aria-activedescendant tracks the
// focused option; ArrowUp/Down move, Enter/Space pick, Esc closes, outside click closes.
let _ddSeq=0;
function mountAppSelect(host, items, value, onChange, opts={}){
  if(!host) return; if(!host.id) host.id="appdd"+(++_ddSeq);
  let cur=value;
  host.classList.add("appdd"); if(opts.slim) host.classList.add("slim");
  const render=()=>{
    let list="", lastG=null;
    items.forEach((it,ix)=>{
      if(it.group && it.group!==lastG){ lastG=it.group; list+=`<div class="appdd-grp">${esc(it.group)}</div>`; }
      const sel=String(it.value)===String(cur);
      list+=`<div class="appdd-opt ${sel?"sel":""}" role="option" id="${host.id}-o${ix}" aria-selected="${sel}" data-ix="${ix}">
        <span>${esc(it.label)}</span><svg class="ic" aria-hidden="true"><use href="#i-check"/></svg></div>`; });
    const curIt=items.find(i=>String(i.value)===String(cur));
    host.innerHTML=`<button type="button" class="appdd-btn" aria-haspopup="listbox" aria-expanded="false"
        ${opts.ariaLabel?`aria-label="${esc(opts.ariaLabel)}"`:""} ${opts.disabled?"disabled":""}>${esc(curIt?curIt.label:(opts.placeholder||"Select"))}</button>
      <div class="appdd-pop" role="listbox" id="${host.id}-list">${list}</div>`;
    const btn=host.querySelector(".appdd-btn"), pop=host.querySelector(".appdd-pop");
    let focusIx=Math.max(0, items.findIndex(i=>String(i.value)===String(cur)));
    const optEls=()=>[...pop.querySelectorAll(".appdd-opt")];
    const setFocus=ix=>{ focusIx=Math.max(0,Math.min(items.length-1,ix));
      optEls().forEach(o=>o.classList.toggle("focus",Number(o.dataset.ix)===focusIx));
      btn.setAttribute("aria-activedescendant",`${host.id}-o${focusIx}`);
      const el=pop.querySelector(`[data-ix="${focusIx}"]`); if(el) el.scrollIntoView({block:"nearest"}); };
    const onDoc=e=>{ if(!host.contains(e.target)) close(); };
    const close=()=>{ host.classList.remove("open"); btn.setAttribute("aria-expanded","false"); document.removeEventListener("click",onDoc,true); };
    const open=()=>{ document.querySelectorAll(".appdd.open").forEach(d=>{ if(d!==host) d.classList.remove("open"); });
      host.classList.add("open"); btn.setAttribute("aria-expanded","true"); setFocus(focusIx);
      document.addEventListener("click",onDoc,true); };
    const pick=ix=>{ const it=items[ix]; if(!it) return; cur=it.value; close(); render(); if(onChange) onChange(it.value); };
    btn.onclick=e=>{ e.stopPropagation(); host.classList.contains("open")?close():open(); };
    pop.onclick=e=>{ const o=e.target.closest(".appdd-opt"); if(o){ e.stopPropagation(); pick(Number(o.dataset.ix)); } };
    btn.onkeydown=e=>{
      const isOpen=host.classList.contains("open");
      if(e.key==="ArrowDown"||e.key==="ArrowUp"){ e.preventDefault(); isOpen?setFocus(focusIx+(e.key==="ArrowDown"?1:-1)):open(); }
      else if(e.key==="Enter"||e.key===" "){ e.preventDefault(); isOpen?pick(focusIx):open(); }
      else if(e.key==="Escape"&&isOpen){ e.preventDefault(); close(); } };
  };
  render();
}

  const isConfPoll=r=>/\(conference poll\)/i.test(r.group_or_poll||"");
  const poll=rows.filter(r=>r.ranking_type==="preseason_poll" && !isConfPoll(r)).sort((a,b)=>a.rank-b.rank);
  const confPolls=rows.filter(r=>r.ranking_type==="preseason_poll" && isConfPoll(r)).sort((a,b)=>a.rank-b.rank);
  const fullAA=rows.filter(r=>r.ranking_type==="preseason_all_america");
  const allConf=rows.filter(r=>r.ranking_type==="preseason_all_conference");
  const watch=rows.filter(r=>r.ranking_type==="award_watchlist");
  const asof=(rows.find(r=>r.as_of_date)||{}).as_of_date||"";
  const link=(src,url)=>url?`<a class="srcpill" href="${esc(url)}" target="_blank" rel="noopener"><b>${esc(src)}</b> <svg class="ic" aria-hidden="true"><use href="#i-up-r"/></svg></a>`:`<span class="srcpill"><b>${esc(src)}</b></span>`;
  const teamTap=r=>r.team_id?` data-team="${r.team_id}"`:"";
  // audit-players brief //5: All-American PLAYER cells are display-only — browsing the AA
  // team must never dump the user onto a random team's home page.
  const aaTap=_r=>"";

  let h=`<div class="cmp">`+backHeader("Preseason")+`<div class="list" style="padding-top:6px">
    <div class="secsub" style="padding:0 2px 10px">Preseason 2026 — <b>third-party</b> selections &amp; projections, attributed and linked. <b>Not</b> Hashmark ratings. As of ${esc(asof)}.</div>`;

  // Consensus All-America team (grouped by position group)
  if(cons.length){
    h+=`<div class="sec"><div class="sectitle">Consensus All-Americans</div>
      <div class="secsub">Players named first-team by <b>2+ outlets</b> (${link("ESPN",espn[0]&&espn[0].source_url)} ${link("Phil Steele",steele[0]&&steele[0].source_url)}). Hashmark tally of their picks — not our rating.</div>`;
    const grp={}; cons.forEach(r=>{ const g=POSGRP[r.position]||"Other"; (grp[g]=grp[g]||[]).push(r); });
    Object.keys(grp).forEach(g=>{
      h+=`<div class="sgtitle" style="margin-top:10px">${g}</div><div class="aagrid">`;
      grp[g].forEach(r=>{ const t=teamMeta[r.team_id];
        h+=`<div class="aacell"${aaTap(r)}><div class="ap">${esc(r.position||"")}</div>
          <div class="anm">${esc(r.player)}<span class="scbadge sc-cons">2+</span></div>
          <div class="asc">${esc(t?t.school:r.school)}</div></div>`; });
      h+=`</div>`;
    });
    h+=`</div>`;
  }
  // By-source All-America teams
  const srcBlock=(label,list,url)=>{
    if(!list.length) return "";
    let b=`<div class="sec"><div class="sectitle">${label} — preseason All-America</div>
      <div class="secsub">First team, per ${link(label,url)}. Facts only (player · position · school).</div><div class="aagrid">`;
    list.forEach(r=>{ const t=teamMeta[r.team_id];
      b+=`<div class="aacell"${aaTap(r)}><div class="ap">${esc(r.position||"")}</div>
        <div class="anm">${esc(r.player)}</div><div class="asc">${esc(t?t.school:r.school)}</div></div>`; });
    return b+`</div></div>`;
  };
  h+=srcBlock("ESPN", espn, espn[0]&&espn[0].source_url);
  h+=srcBlock("Phil Steele", steele, steele[0]&&steele[0].source_url);

  // ---- batch 12 #4: preseason All-America — FULL teams, by outlet (attributed) ----
  const aaCell=r=>`<div class="aacell"><div class="ap">${esc(r.position||"")}</div>
    <div class="anm">${esc(r.player)}</div><div class="asc">${esc((teamMeta[r.team_id]||{}).school||r.school)}</div></div>`;
  if(fullAA.length){
    h+=`<div class="sec"><div class="sectitle">Preseason All-America — by outlet</div>
      <div class="secsub">Full published teams, per outlet — facts only (player · position · school), each list linked to its source. Spelling variants are normalized to one name; the source's own spelling is preserved in our records.</div>`;
    const byOut={}; fullAA.forEach(r=>{ (byOut[r.source]=byOut[r.source]||[]).push(r); });
    Object.keys(byOut).sort().forEach(src=>{
      const list=byOut[src];
      const byLvl={}; list.forEach(r=>{ (byLvl[r.team_label]=byLvl[r.team_label]||[]).push(r); });
      h+=`<div class="sgtitle" style="margin-top:10px">${esc(src)} ${link("source",list[0].source_url)}</div>`;
      Object.keys(byLvl).sort().forEach(lb=>{
        h+=`<div class="secsub" style="padding:4px 2px 2px"><b>${esc(lb)}</b></div><div class="aagrid">${byLvl[lb].map(aaCell).join("")}</div>`; });
    });
    h+=`</div>`;
  }

  // ---- batch 12 #4: preseason All-Conference — by league (official releases) ----
  if(allConf.length){
    h+=`<div class="sec"><div class="sectitle">Preseason All-Conference — by league</div>
      <div class="secsub">Official league releases only, seeded as printed (CUSA switched to a 50-player watch-list format; the Mountain West's release includes North Dakota State as printed). SEC, ACC, American and the Big Ten media poll release through late July — they appear here automatically as our tracker ingests them.</div>`;
    const byConf={}; allConf.forEach(r=>{ (byConf[r.group_or_poll]=byConf[r.group_or_poll]||[]).push(r); });
    Object.keys(byConf).sort().forEach(cn=>{
      const list=byConf[cn];
      h+=`<div class="sgtitle" style="margin-top:10px">${esc(cn)} ${link("official release",list[0].source_url)}</div>`;
      const awards=list.filter(r=>!/^(First|Second|Watch List)/.test(r.team_label||""));
      if(awards.length) h+=awards.map(r=>`<div class="honor"><div class="hb">AWARD</div>
        <div class="hn">${esc(r.team_label)}: <b>${esc(r.player)}</b> <small>· ${esc(r.position||"")} · ${esc((teamMeta[r.team_id]||{}).school||r.school)}</small></div></div>`).join("");
      const byLvl={}; list.filter(r=>/^(First|Second|Watch List)/.test(r.team_label||"")).forEach(r=>{ (byLvl[r.team_label]=byLvl[r.team_label]||[]).push(r); });
      Object.keys(byLvl).sort().forEach(lb=>{
        h+=`<div class="secsub" style="padding:4px 2px 2px"><b>${esc(lb)}</b></div><div class="aagrid">${byLvl[lb].map(aaCell).join("")}</div>`; });
    });
    h+=`<div class="secsub" style="padding-top:8px"><b>Pac-12:</b> no preseason all-conference team exists — the rebuilt league staged no media days and has released no preseason honors. Nothing to show is the honest state.</div>`;
    h+=`</div>`;
  }

  // ---- batch 12 #4: national award watch lists — collapsible per award (they're long) ----
  if(watch.length){
    const accP=(id,title,sub,inner)=>`<div class="acc">
      <button class="acchdr" aria-expanded="false" aria-controls="accb-${id}" data-acc="${id}">
        <span>${title}</span><small>${sub||""}</small><svg class="ic accchev" aria-hidden="true"><use href="#i-chev-d"/></svg></button>
      <div class="accbody" id="accb-${id}" hidden>${inner}</div></div>`;
    h+=`<div class="sec"><div class="sectitle">National award watch lists</div>
      <div class="secsub">Preseason watch lists, per the awarding body. The NCFAA lists (Maxwell, Nagurski, Outland, Butkus, Thorpe and friends) release Jul 28 – Aug 11 and appear here as they land.</div>`;
    const byAward={}; watch.forEach(r=>{ (byAward[r.group_or_poll]=byAward[r.group_or_poll]||[]).push(r); });
    Object.keys(byAward).sort().forEach((aw,i)=>{
      const list=byAward[aw];
      const partial=(list[0].note||"").toLowerCase().includes("partial");
      const inner=`<div class="aagrid">${list.map(aaCell).join("")}</div>
        ${partial?`<div class="secsub" style="padding:6px 2px 0">Partial list — only the slice we could verify is shown; the full list lands via our release-calendar tracker.</div>`:""}
        ${list[0].source_url?`<div class="morelink">${link("Full list at the source",list[0].source_url)}</div>`:""}`;
      h+=accP(`award${i}`, esc(aw), `${list.length} name${list.length===1?"":"s"}${partial?" · partial":""}`, inner);
    });
    h+=`</div>`;
  }

  // Preseason Top 25 — EVERY source, per-source lists + a consensus (brief #6: no single
  // outlet is featured as THE source; facts only, attributed and linked)
  const bySrc={}; poll.forEach(r=>{ (bySrc[r.source]=bySrc[r.source]||[]).push(r); });
  const srcs=Object.keys(bySrc).sort();
  h+=`<div class="sec"><div class="sectitle">Preseason Top 25 <small>${srcs.length} source${srcs.length===1?"":"s"}</small></div>`;
  if(srcs.length){
    if(srcs.length>=2){
      const agg={};
      srcs.forEach(sc=>bySrc[sc].forEach(r=>{ const k=r.team_id||r.school;
        (agg[k]=agg[k]||{team_id:r.team_id, school:r.school, ranks:[]}).ranks.push(Number(r.rank)); }));
      const consT=Object.values(agg).map(x=>({...x, avg:x.ranks.reduce((a2,b2)=>a2+b2,0)/x.ranks.length, n:x.ranks.length}))
        .sort((x,y)=>(y.n-x.n)||(x.avg-y.avg)).slice(0,25);
      h+=`<div class="sgtitle">Hashmark consensus <small>average rank · appearances across ${srcs.length} outlets</small></div>`;
      consT.forEach((r,i)=>{ const t=teamMeta[r.team_id];
        h+=`<div class="t25row"${r.team_id?` data-team="${r.team_id}"`:""}><div class="trk">${i+1}</div>
          ${crestEl("schedcr",(t?t.school:r.school),t?hx(t.color):"#384455")}
          <div class="tnm">${esc(t?t.school:r.school)}<small> avg #${r.avg.toFixed(1)} · ${r.n}/${srcs.length} lists</small></div></div>`; });
    }
    srcs.forEach(sc=>{ const list=bySrc[sc].slice().sort((x,y)=>x.rank-y.rank);
      // legal/rendering rule (owner, Jul 19): subjective outlet rankings render as a
      // TOP-10 EXCERPT + outbound link — never any single outlet's full 25 verbatim.
      // Official poll-result facts (AP/Coaches when they release) may render in full.
      const official=/official/i.test(list[0].group_or_poll||"") || sc==="AP Top 25" || sc==="Coaches Poll";
      const shown=official?list:list.slice(0,10);
      h+=`<div class="sgtitle" style="margin-top:10px">${esc(sc)} <small>${official?"official poll":"top-10 excerpt"}</small></div>`;
      shown.forEach(r=>{ const t=teamMeta[r.team_id];
        h+=`<div class="t25row"${teamTap(r)}><div class="trk">${r.rank}</div>
          ${crestEl("schedcr",(t?t.school:r.school),t?hx(t.color):"#384455")}
          <div class="tnm">${esc(t?t.school:r.school)}</div></div>`; });
      if(!official) h+=`<div class="morelink"><a class="srcpill" href="${esc(list[0].source_url||"#")}" target="_blank" rel="noopener">Full list at ${esc(sc)} <svg class="ic" aria-hidden="true"><use href="#i-up-r"/></svg></a></div>`; });
    h+=`<div class="secsub" style="padding-top:8px">The official <b>AP &amp; Coaches</b> preseason polls auto-appear here when released in August.</div>`;
  } else {
    h+=`<div class="secsub">The official AP &amp; Coaches preseason Top 25 release in August — they'll appear here automatically (CFBD).</div>`;
  }
  // batch 12 #4: conference coaches polls render separately — divisional ranks are not
  // national Top-25 votes, so they stay out of the consensus above
  if(confPolls.length){
    const byCP={}; confPolls.forEach(r=>{ (byCP[`${r.source}|${r.group_or_poll}`]=byCP[`${r.source}|${r.group_or_poll}`]||[]).push(r); });
    h+=`<div class="sgtitle" style="margin-top:12px">Conference preseason polls <small>official league polls · not part of the consensus</small></div>`;
    Object.keys(byCP).sort().forEach(k=>{ const list=byCP[k].slice().sort((a,b)=>a.rank-b.rank);
      h+=`<div class="secsub" style="padding:4px 2px 2px"><b>${esc((list[0].group_or_poll||"").replace(" (conference poll)",""))}</b> — ${esc(list[0].source)} ${link("source",list[0].source_url)}</div>`;
      list.forEach(r=>{ const t=teamMeta[r.team_id];
        h+=`<div class="t25row"${r.team_id?` data-team="${r.team_id}"`:""}><div class="trk">${r.rank}</div>
          ${crestEl("schedcr",(t?t.school:r.school),t?hx(t.color):"#384455")}
          <div class="tnm">${esc(t?t.school:r.school)}${r.note?`<small> ${esc(r.note)}</small>`:""}</div></div>`; }); });
  }
  h+=`</div>`;

  h+=`<div class="note"><b>Preseason 2026 — third-party.</b> All selections belong to the cited outlets and link to their source; Hashmark compiles a consensus only where 2+ agree and copies facts only, never their analysis. ${BRAND_LINE}</div></div></div>`;
  app.innerHTML=h;
  document.querySelector(".back").onclick=navBack;
}

function wireSearch(){

const tipEl=document.createElement("div"); tipEl.className="tip"; document.body.appendChild(tipEl);

  const r=el.getBoundingClientRect(), tw=Math.min(264,window.innerWidth-20);

  let top=r.top-tipEl.offsetHeight-8; if(top<8) top=r.bottom+8;
  tipEl.style.left=left+"px"; tipEl.style.top=top+"px"; }
const hideTip=()=>tipEl.classList.remove("show");
document.body.addEventListener("mouseover",e=>{const el=e.target.closest("[data-tip]");if(el)showTip(el);});
document.body.addEventListener("mouseout", e=>{const el=e.target.closest("[data-tip]");if(el)hideTip();});

// U23: the persistent header search — ONE icon (#hdrsearch) re-mounted into whichever
// header the active view rendered (.htop before the account slot, .dtop/.cmptop at the

// ══════════════ U54 — theme toggle (their pattern: a header control) ══════════════
// Same observer ride as the search icon, so every header variant gets it free. The
// choice persists to localStorage immediately and to the profile when signed in
// (sign-in on another device restores it — see applyProfileTheme).
function u54Theme(){ return document.documentElement.dataset.theme==="light"?"light":"dark"; }
function u54SetTheme(t, persist){
  document.documentElement.dataset.theme=t;
  try{ localStorage.setItem("hm_theme", t); }catch(_e){}
  const b=document.getElementById("hdrtheme");
  if(b) b.innerHTML=`<svg class="ic" aria-hidden="true"><use href="#i-${t==="light"?"moon":"sun"}"/></svg>`;
  if(persist && authUser){ try{ authFetch("PATCH", `profiles?id=eq.${authUser.id}`, {theme:t}); }catch(_e){} }
  try{ track("theme_set", t); }catch(_e){}
}
function mountThemeToggle(){
  if(document.getElementById("hdrtheme")) return;
  const search=document.getElementById("hdrsearch");
  if(!search || !search.parentNode) return;
  const b=document.createElement("button");
  b.id="hdrtheme"; b.className="hdrsearch";
  b.setAttribute("aria-label","Switch light/dark theme");
  b.innerHTML=`<svg class="ic" aria-hidden="true"><use href="#i-${u54Theme()==="light"?"moon":"sun"}"/></svg>`;
  b.onclick=()=>u54SetTheme(u54Theme()==="light"?"dark":"light", true);
  search.parentNode.insertBefore(b, search);
}
// signed-in restore: an explicit profile theme wins over the OS default, but never
// over a fresher local choice (localStorage was already applied pre-paint)
function applyProfileTheme(){
  try{
    if(authProfile && (authProfile.theme==="light"||authProfile.theme==="dark")
       && !localStorage.getItem("hm_theme"))
      u54SetTheme(authProfile.theme, false);
  }catch(_e){}
}
new MutationObserver(()=>{ try{ mountHeaderSearch(); mountThemeToggle(); }catch(_e){} }).observe(app, {childList:true});
setTimeout(()=>{ mountHeaderSearch(); mountThemeToggle(); }, 0);

// U32: the floating Ask Hashmark bubble — ONE body-level element, re-synced on every

// ═══════════════ U46 "Primetime Polish" — the shared section grammar ═══════════════
// One renderer for the eyebrow / display-H2 / count-chip / "ALL" pill header. Returns a
// string so every existing template-literal renderer can adopt it in place; nothing here
// creates or moves a layout box (U47 recomposes the page, this unit only re-dresses it).
//
// The ALL pill routes through data-allgo + ONE body delegate rather than each view's local
// data-go map, so a header can be dropped into any view and its link just works. It is a
// <span role=button>, not a <button>, and it never carries data-team (the U24 double-fire
// rule); the arrow is the monoline chevron symbol, never an arrow glyph (emoji linter).
const ALL_GO = {
  news:      ()=>openNewsArchive(),
  leaders:   ()=>openPlayerRankings(),
  explore:   ()=>openExplore(),
  standings: ()=>openStandings(),
  history:   ()=>openHistory(),
  stats:     ()=>openStats(),
  signature: ()=>openSignature(),
  // U47 band destinations (secHead only renders an ALL pill for a key that exists here)
  filmroom:  ()=>openFilmRoom(),
  nil:       ()=>openNILEconomy(),
  polls:     ()=>openPolls(),   // U51
  sim:       ()=>gatedSimulator(),
  checking:  ()=>openCheckingWork(),
};
// chip: string | {t, kind} | array of either. kind: "count" | "fresh" | "" (neutral)
function cChip(c){
  if(c==null || c==="") return "";
  if(Array.isArray(c)) return c.map(cChip).join("");
  const o = (typeof c==="string") ? {t:c} : c;
  const kind = o.kind ? ` ${o.kind}` : "";
  const dot = o.dot ? " dot" : "";
  return `<span class="cchip${kind}${dot}">${esc(o.t)}</span>`;
}
function secHead(eyebrow, title, opts){
  const o = opts||{};
  const eb = eyebrow ? `<div class="eyebrow brand">${esc(eyebrow)}</div>` : "";
  const chips = o.chip ? `<div class="chiprow">${cChip(o.chip)}</div>` : "";
  const all = (o.all && ALL_GO[o.all])
    ? `<span class="allpill" role="button" tabindex="0" data-allgo="${esc(o.all)}"
         aria-label="${esc(o.allLabel||"See all")}">${esc(o.allLabel||"All")}<svg class="ic"
         aria-hidden="true"><use href="#i-chev-r"/></svg></span>` : "";
  // .hsectitle is kept on the H2 so the existing home lookups keep resolving
  return `<div class="sechead"><div class="shl">${eb}<h2 class="${esc(o.cls||"")}">${esc(title)}</h2>${chips}</div>${all}</div>`;
}
document.addEventListener("click", e=>{
  const p = e.target.closest && e.target.closest("[data-allgo]");
  if(!p) return;
  const f = ALL_GO[p.dataset.allgo]; if(f) f();
});
document.addEventListener("keydown", e=>{
  if(e.key!=="Enter" && e.key!==" ") return;
  const p = e.target.closest && e.target.closest("[data-allgo]");
  if(!p) return;
  e.preventDefault(); const f = ALL_GO[p.dataset.allgo]; if(f) f();
});

// U46 motion: scroll-reveal FADES (opacity only — a transform would create a containing
// block and break the sticky stat sub-headers, and opacity can never shift a box, so this
// adds exactly 0 to CLS). Runs on the same #app observer as the header icon / Ask bubble,
// so future views inherit it. Three safety properties:
//   • prefers-reduced-motion: the observer is never created at all and no element is ever
//     marked .reveal — content renders opaque, exactly as before this unit.
//   • anything already in view reveals on the observer's first synchronous callback.
//   • a 1.2s failsafe reveals everything regardless, so a missed callback can never leave
//     a section invisible.
const HM_REDUCED = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let _revealIO = null;
function markReveals(){
  if(HM_REDUCED) return;
  // A HIDDEN document never hides content. Chrome pauses CSS transitions while
  // document.hidden is true (the transition sits at currentTime 0, playState
  // "running"), so a view rendered in a background tab would keep every section at
  // opacity 0 until the tab came forward. Rendering opaque costs nothing there --
  // nobody is looking -- and removes the whole failure class.
  if(document.hidden){ app.querySelectorAll(".reveal").forEach(el=>el.classList.add("on")); return; }
  if(!_revealIO) _revealIO = new IntersectionObserver(es=>{
    es.forEach(x=>{ if(x.isIntersecting){ x.target.classList.add("on"); _revealIO.unobserve(x.target); } });
  }, {rootMargin:"0px 0px -4% 0px", threshold:0.01});
  // direct children of a view's scroll body only — nested .sec inside .accbody panels and
  // anything inside an overlay are deliberately not observed
  app.querySelectorAll(".list > .sec, .list > .card, .list > .hsec, .list > .acc, "
    + ".detail > .sec, .detail > .recordcard")
    .forEach(el=>{
      if(el.dataset.rv) return;
      el.dataset.rv="1"; el.classList.add("reveal"); _revealIO.observe(el);
    });
  // the failsafe is deliberately NOT cancellable: a chatty view (home injects your-team,
  // teasers and news after its first paint) kept resetting a single shared timer, which
  // delayed the fade by seconds. Each pass now owns its own 1.2s timer instead.
  setTimeout(()=>app.querySelectorAll(".reveal").forEach(el=>el.classList.add("on")), 1200);
}

// (the wrapped open* registry below); transient overlays (sheets/modals/interstitials)
// PUSH one entry so Back CLOSES the overlay, one step; bubble/sub-toggle taps inside a

// Home is reached by Back only when Home genuinely is the prior state. The on-screen
// back arrow is navBack() — one REAL history step — never a hardwired load()/parent.
let _ovStack=[], _ovConsuming=false;
function navOverlay(dom, onBack){
  _ovStack.push({dom, onBack: onBack || (()=>{ try{ dom.remove(); }catch(_e){} })});
  try{ history.pushState({hm:1, ov:_ovStack.length}, ""); }catch(e){}
}
function ovDismiss(){                       // pure UI dismiss (x / backdrop / Esc): consume the entry

  try{ en.onBack(); }catch(_e){}

function ovClose(dom){                      // action close (a selection was made): overlay leaves,
  const i=_ovStack.findIndex(en=>en.dom===dom);   // its history entry goes dead and is skipped on Back

  try{ dom.remove(); }catch(_e){}

    history.pushState({hm:1, v, p:p||{}}, "");

  // rollup's top-teams board works); the three named surfaces also log their event

// V2 — Factor Waterfall: FBS-average baseline to final rating, one signed step per
// additive factor. The comps sum exactly to the overall (registry guarantee).
function waterfallSVG(comps, overall, t){
  const parts=CORDER.map(k=>{ const c=(comps||[]).find(x=>x.component===k);
    return c?{k, v:Number(c.value)}:null; }).filter(Boolean);
  if(!parts.length) return "";
  const W=340, RH=22, H=(parts.length+1)*RH+34;
  let cum=0; const pts=[{cum0:0}];
  const bounds=[0];
  parts.forEach(p=>{ bounds.push(cum, cum+p.v); cum+=p.v; });
  bounds.push(overall);
  const lo=Math.min(...bounds), hi=Math.max(...bounds);
  const span=Math.max(0.02, hi-lo);
  const PL=78, PR=W-42;                       // label column left, value gutter right
  const X=v=>PL+(v-lo)/span*(PR-PL);
  const col=hx((t&&t.color)||"#E8B657");
  const vlab=(a,b,y,txt,bold)=> (b+34<=W)
    ? `<text x="${b+4}" y="${y}" fill="var(--text${bold?"":"3"})" font-size="8.5"${bold?' font-weight="700"':""}>${txt}</text>`
    : `<text x="${a-4}" y="${y}" fill="var(--text${bold?"":"3"})" font-size="8.5" text-anchor="end"${bold?' font-weight="700"':""}>${txt}</text>`;
  let s=`<svg class="wfall" viewBox="0 0 ${W} ${H}" role="img" aria-label="Factor waterfall">`;
  s+=`<line x1="${X(0)}" y1="6" x2="${X(0)}" y2="${H-24}" stroke="rgba(148,163,184,.35)" stroke-dasharray="3 3"/>`;
  s+=`<text x="${Math.max(46,X(0))}" y="${H-14}" fill="var(--text3)" font-size="8.5" text-anchor="middle">FBS average</text>`;
  cum=0;
  parts.forEach((p,i)=>{ const y=8+i*RH;
    const a=X(Math.min(cum,cum+p.v)), b=X(Math.max(cum,cum+p.v));
    s+=`<text x="${PL-8}" y="${y+10}" fill="var(--text2)" font-size="9" text-anchor="end">${CMETA[p.k].name}</text>`;
    s+=`<rect x="${a}" y="${y+2}" width="${Math.max(2,b-a)}" height="11" rx="2.5" fill="${p.v>=0?"var(--model)":"#E5705C"}" opacity=".9"><title>${esc(CMETA[p.k].name+" "+f3(p.v)+" — "+CMETA[p.k].tip)}</title></rect>`;
    s+=vlab(a,b,y+11,f3(p.v),false);
    cum+=p.v;
    if(i<parts.length-1) s+=`<line x1="${X(cum)}" y1="${y+13}" x2="${X(cum)}" y2="${y+RH+2}" stroke="rgba(148,163,184,.4)"/>`;
  });
  const fy=8+parts.length*RH;
  const fa=X(Math.min(0,overall)), fb=X(Math.max(0,overall));
  s+=`<text x="${PL-8}" y="${fy+10}" fill="var(--text)" font-size="9" font-weight="700" text-anchor="end">Rating</text>`;
  s+=`<rect x="${fa}" y="${fy+2}" width="${Math.max(2,fb-fa)}" height="11" rx="2.5" fill="var(--model)"/>`;   // U70: the rating IS model output — teal, never the team color (a red team read as a negative total)
  s+=vlab(fa,fb,fy+11,f3(overall),true);
  return s+`</svg><div class="secsub" style="padding:0 2px 4px">From FBS average to the final rating — every factor's exact contribution (${phaseLabel()}).</div>`;
}

// V4 — Schedule Gauntlet: 12 cells colored by win prob + the record distribution.
async function gauntletData(teamId){
  const games=await api(`games?select=id,week,season_type,home_team_id,away_team_id,home_team,away_team,neutral_site,start_date,start_time_tbd,network,home_points,away_points,completed&season=eq.${SEASON_SCHED}&season_type=eq.regular&or=(home_team_id.eq.${teamId},away_team_id.eq.${teamId})&order=week.asc`);
  const pairs=[...new Set(games.map(g=>{ const lo=Math.min(g.home_team_id,g.away_team_id), hi=Math.max(g.home_team_id,g.away_team_id); return `and(team_a.eq.${lo},team_b.eq.${hi})`; }))];
  let wp=[];
  if(pairs.length) try{ wp=await api(`matchup_winprob?select=team_a,team_b,win_prob_a,win_prob_a_home,win_prob_a_away&season=eq.${SEASON_SCHED}&or=(${pairs.join(",")})`); }catch(e){}
  const wpm=new Map(); wp.forEach(r=>wpm.set(r.team_a+"-"+r.team_b,r));
  return {games, wpm};
}
function gauntletP(teamId, g, wpm){
  const lo=Math.min(+g.home_team_id,+g.away_team_id), hi=Math.max(+g.home_team_id,+g.away_team_id);
  const row=wpm.get(lo+"-"+hi); if(!row) return null;
  const home=+g.home_team_id===+teamId;
  let pHome;
  if(g.neutral_site){ const pLo=Number(row.win_prob_a); pHome=(+g.home_team_id===lo)?pLo:1-pLo; }
  else if(+g.home_team_id===lo) pHome=Number(row.win_prob_a_home);
  else pHome=1-Number(row.win_prob_a_away);
  return home?pHome:1-pHome;
}
function gauntletHTML(teamId, games, wpm, compact){
  const cells=games.map(g=>{ const home=+g.home_team_id===+teamId;
    const opp=home?g.away_team_id:g.home_team_id;
    const fcs=opp==null;
    const o=fcs?{school:(home?g.away_team:g.home_team)||"FCS opponent"}:(teamMeta[opp]||{school:"TBD"});
    const done=g.completed&&g.home_points!=null;
    const won=done&&((home?g.home_points>g.away_points:g.away_points>g.home_points));
    const p=fcs?(P4_FCS.has((teamMeta[teamId]||{}).conference)?P_FCS.p4:P_FCS.g5):gauntletP(teamId,g,wpm);
    const hue=p==null?null:Math.round(p*120);   // 0=red, 120=green
    const bg=done?(won?"#274d3a":"#4d2a27"):(p==null?"var(--surface)":`hsl(${hue} 45% 22%)`);
    const big=p!=null&&p<0.40&&!done;
    const dt=g.start_date?new Date(g.start_date).toLocaleDateString("en-US",{month:"short",day:"numeric"}):"";
    return `<div class="gcell${big?" hard":""}" style="background:${bg}" data-team="${opp}"
      data-tip="${esc((home?"vs ":"@ ")+o.school+(p!=null?` — the model wins this ${Math.round(p*100)} of 100 times`:" — no line yet")+(done?` (final)`:""))}">
      <div class="gwk">Wk ${g.week}</div>
      <div class="gmono" style="color:${hx(o.color)}">${esc(monogram(o.school))}</div>
      <div class="gp">${done?(won?"W":"L"):(p==null?"—":Math.round(p*100)+"%")}</div>
      ${compact?"":`<div class="gdt">${esc(dt)}${g.network?` · ${esc(g.network)}`:""}</div>`}</div>`; }).join("");
  // record distribution: Poisson-binomial over remaining win probs + locked results
  const probs=games.map(g=>{ const done=g.completed&&g.home_points!=null;
    if(done){ const home=+g.home_team_id===+teamId; return (home?g.home_points>g.away_points:g.away_points>g.home_points)?1:0; }
    const opp=+g.home_team_id===+teamId?g.away_team_id:g.home_team_id;
    if(opp==null) return P4_FCS.has((teamMeta[teamId]||{}).conference)?P_FCS.p4:P_FCS.g5;
    const p=gauntletP(teamId,g,wpm); return p==null?0.5:p; });
  let dist=[1];
  probs.forEach(p=>{ const nd=new Array(dist.length+1).fill(0);
    for(let k=0;k<dist.length;k++){ nd[k]+=dist[k]*(1-p); nd[k+1]+=dist[k]*p; } dist=nd; });
  const dmax=Math.max(...dist);
  const bars=dist.map((d,w)=>`<div class="rdcol" data-tip="${esc(`${w}-${games.length-w}: ${Math.round(d*100)} of 100 seasons`)}">
    <i style="height:${Math.max(2,d/dmax*34)}px"></i><small>${w}</small></div>`).join("");
  return `<div class="gauntlet">${cells}</div>
    <div class="rdist"><div class="rdbars">${bars}</div>
    <div class="secsub" style="padding:2px 2px 0">Projected: <b>${probs.reduce((a,b)=>a+b,0).toFixed(1)} wins</b> (${SEASON_SCHED}, model win probabilities). The single most common record, ${dist.indexOf(dmax)}-${games.length-dist.indexOf(dmax)}, lands in ${Math.round(dmax*100)} of 100 seasons — every other total splits the rest.${schedCountTag(games.length)?` <b>${schedCountTag(games.length)}.</b>`:""}</div></div>`;
}

  const xlo=Math.min(...pts.map(p2=>p2.x)), xhi=Math.max(...pts.map(p2=>p2.x));
  const ylo2=Math.min(...pts.map(p2=>p2.y)), yhi2=Math.max(...pts.map(p2=>p2.y));
  const SX=v=>PAD+(v-xlo)/Math.max(1e-9,xhi-xlo)*(W-2*PAD), SY=v=>H-PAD-(v-ylo2)/Math.max(1e-9,yhi2-ylo2)*(H-2*PAD);
  let sc=`<svg class="quad" viewBox="0 0 ${W} ${H}">`;
  sc+=`<line x1="${SX(xlo)}" y1="${SY(a02+bc*xlo)}" x2="${SX(xhi)}" y2="${SY(a02+bc*xhi)}" stroke="rgba(148,163,184,.5)" stroke-dasharray="4 3" stroke-width="1.5"/>`;
  sc+=`<text x="${W-PAD}" y="${PAD-8}" fill="#5BD39A" font-size="9" font-weight="700" text-anchor="end">coaching over-expectation</text>`;
  pts.forEach(pp=>{ const me=String(pp.id)===String(teamId);
    sc+=`<circle cx="${SX(pp.x)}" cy="${SY(pp.y)}" r="${me?9:6}" fill="${hx(pp.t.color)}" opacity="${me?1:.65}" ${me?'stroke="var(--amber)" stroke-width="2.5"':""} data-rteam="${pp.id}" style="cursor:pointer"><title>${esc((pp.t.school||"?")+" — talent "+pp.x.toFixed(0)+", rating "+f3(pp.y)+" (#"+pp.rank+"); "+(pp.resid>=0?"+":"")+f3(pp.resid)+" vs the talent expectation")}</title></circle>`; });
  sc+=`</svg>`;
  app.innerHTML=`<div class="cmp">${backHeader("Roster Economy")}<div class="list" style="padding-top:6px">

    <div class="sec"><div class="sectitle">Talent in vs performance out <small>${SEASON_RESULTS} talent · ${phaseLabel()} rating</small></div>
      <div class="secsub">Roster talent across, Hashmark rating up. The dashed line is expectation from talent alone — distance above it is what the STAFF adds (the coaching over-expectation lane).</div>
      ${sc}</div>
    <div class="note"><b>Roster Economy — entering ${SEASON_SCHED}.</b> Portal values are prior-season production (PPA + usage share), position-weighted; never recruiting stars, never dollar figures. Talent is the ${SEASON_RESULTS} composite; the expectation line is a least-squares fit across FBS. ${BRAND_LINE}</div></div></div>`;
  document.querySelector(".back").onclick=navBack;
  document.getElementById("repick").onclick=()=>teamPicker(null, id=>openRosterEconomy(id));

// P3 — Player percentile cards: value grade + within-position percentile BARS (never

async function playerCardData(aid){
  const [idx, rk]=await Promise.all([
    api(`player_index?select=athlete_id,player,team_id,position&athlete_id=eq.${aid}&limit=1`),
    api(`player_rankings?select=*&season=eq.${SEASON_SCHED}&order=pos_rank.asc`)]);
  const p=idx[0]; if(!p) return null;
  const mine=rk.find(r=>r.player.toLowerCase()===p.player.toLowerCase());
  if(!mine) return {p, bars:null};
  const stats=await api(`player_stat_season?select=stat_key,value,rank&season=eq.${SEASON_RESULTS}&player=eq.${encodeURIComponent(p.player)}&team_id=eq.${p.team_id}`);
  const pool=await api(`player_stat_season?select=stat_key,rank&season=eq.${SEASON_RESULTS}&stat_key=in.(${[...new Set(stats.map(s=>s.stat_key))].slice(0,8).join(",")})&order=rank.desc`);
  const nBy={}; pool.forEach(r=>{ nBy[r.stat_key]=Math.max(nBy[r.stat_key]||0, r.rank||0); });
  const bars=stats.slice(0,7).map(s=>({label:s.stat_key.replace(/_/g," "), value:s.value,
    pct: nBy[s.stat_key]>1? Math.round(100*(nBy[s.stat_key]-s.rank)/(nBy[s.stat_key]-1)) : null}))
    .filter(b=>b.pct!=null);
  return {p, mine, bars};
}

async function checkReturnFeed(){
  try{
    if(sessionStorage.getItem("hm_feed_sess")) return;             // <=1 surface/session
    if(sessionStorage.getItem("hm_join_token")) return;            // U72: a pending ?join= invite wins the first surface
    const lastSeen=localStorage.getItem("hm_last_visit");
    localStorage.setItem("hm_last_visit", new Date().toISOString());
    const seen=JSON.parse(localStorage.getItem("hm_feed_seen")||"{}");
    const fav=Number(favTeamId()||0);
    let ga=[]; try{ ga=await api(`${FEED_SELECT}&order=asof.desc&limit=80`); }catch(e){}
    ga=ga.filter(r=>Date.now()-new Date(r.asof).getTime()<8*864e5); // fresh Monday drop only
    if(ga.length){ const k0=ga[0].season*100+ga[0].week; ga=ga.filter(r=>r.season*100+r.week===k0); }
    let ids={}, favRow=null;
    if(ga.length){
      try{ const gs=await api(`games?select=id,home_team_id,away_team_id&id=in.(${ga.map(r=>r.game_id).join(",")})`);
        gs.forEach(g=>ids[g.id]=g); }catch(e){}
      if(fav) favRow=ga.find(r=>{ const g=ids[r.game_id]; return g&&(g.home_team_id===fav||g.away_team_id===fav); });
    }
    const cards=[], covered=new Set();
    if(favRow && !seen["ga:"+favRow.game_id]){
      cards.push({k:"ga:"+favRow.game_id, kind:"film", row:favRow});
      const g=ids[favRow.game_id]; covered.add(g.home_team_id); covered.add(g.away_team_id);
    }
    const wkKey=ga.length?ga[0].season*100+ga[0].week:null;
    if(wkKey && !seen["gw:"+wkKey])
      cards.push({k:"gw:"+wkKey, kind:"filmwk", season:ga[0].season, week:ga[0].week, n:ga.length});
    // UG3: the weekly Grade Report card — priority BELOW the Monday Film Room,
    // once per week, same seen-state + archive machinery (no new pop-up system)
    try{
      const rc=(await api(`report_cards?select=season,week,payload,asof&order=season.desc,week.desc&limit=1`))[0];
      if(rc && Date.now()-new Date(rc.asof).getTime()<8*864e5 && !seen["rc:"+(rc.season*100+rc.week)] && cards.length<4){
        const favN=fav&&rc.payload.teams&&rc.payload.teams[String(fav)];
        cards.push({k:"rc:"+(rc.season*100+rc.week), kind:"gradereport", rc, favN});
      }
    }catch(e){}
    // U72 #6: the "picks due" card — the return surface IS the reminder (push is owner-held).
    // Once per week-key; leads the queue because it expires at kickoff.
    try{
      if(authUser && cards.length<4){
        const due=await pkDueInfo();
        if(due && !seen["pkdue:"+due.k]) cards.unshift({k:"pkdue:"+due.k, kind:"pkdue", due});
      }
    }catch(_e){}
    if(lastSeen && cards.length<4){
      const majors=await api(`news_items?select=headline,url,source,published_at,team_tags,category&major=eq.true&published_at=gt.${encodeURIComponent(lastSeen)}&order=published_at.desc&limit=20`).catch(()=>[]);
      const mine=fav?majors.filter(m=>(m.team_tags||[]).some(t=>Number(t)===fav)):[];
      [...mine, ...majors.filter(m=>!mine.includes(m))].forEach(m=>{
        if(cards.length>=4 || seen["news:"+m.url]) return;
        if((m.team_tags||[]).some(t=>covered.has(Number(t)))) return;  // dedupe vs film cards
        cards.push({k:"news:"+m.url, kind:"news", m});
      });
    }
    if(!cards.length) return;                                       // nothing-state: no surface
    sessionStorage.setItem("hm_feed_sess","1");
    const persist=()=>{ try{
      cards.forEach(c=>seen[c.k]=Date.now());
      const keys=Object.keys(seen); if(keys.length>200)
        keys.sort((a,b)=>seen[a]-seen[b]).slice(0,keys.length-200).forEach(k=>delete seen[k]);
      localStorage.setItem("hm_feed_seen", JSON.stringify(seen));
      if(typeof authUser!=="undefined"&&authUser) authFetch("PATCH",`profiles?id=eq.${authUser.id}`,
        {notify_prefs:Object.assign({},(authProfile||{}).notify_prefs||{},{feed_seen_at:new Date().toISOString()})});
    }catch(e){} };
    const CAT={injury_out:"INJURY",coaching_change:"COACHING",realignment:"REALIGNMENT",
      transfer_major:"TRANSFER",controversy:"NEWS",rankings_shakeup:"RANKINGS",title_cfp:"CFP"};
    const ov=document.createElement("div"); ov.className="pickov";
    ov.innerHTML=`<div class="picksheet"><div class="pickhd">
      <div style="font-weight:800;font-size:15px;flex:1">While you were away</div>

      <div class="picklist">${cards.map((c,i)=>{
        if(c.kind==="film") return `<div class="fmcard" data-fc="${i}">

          <button class="navbtn" style="width:100%;min-height:38px;margin-top:4px">Full analysis <span class="chip-plus" style="display:inline-flex">HASHMARK+</span></button></div>`;
        if(c.kind==="filmwk") return `<div class="fmcard" data-fc="${i}">
          <span class="fmangle">FILM ROOM</span>
          <div class="fmhead">The weekend, analyzed: ${c.n} game breakdowns from Week ${c.week}</div>
          <div class="fmmeta">Monday drop · tap for the full board</div></div>`;
        if(c.kind==="pkdue") return `<div class="fmcard" data-fc="${i}">
          <span class="fmangle">PICK'EM</span>
          <div class="fmhead">Picks due — ${c.due.n} game${c.due.n===1?"":"s"} in your group${c.due.groups>1?"s":""} lock${c.due.n===1?"s":""} within 48 hours</div>

        if(c.kind==="gradereport"){ const pw=c.rc.payload.pow;
          return `<div class="fmcard" data-fc="${i}">
          <span class="fmangle">GRADE REPORT</span>${c.favN&&c.favN.best?`<span class="fmangle" style="color:var(--text2);border-color:var(--line2);margin-left:5px">YOUR TEAM</span>`:""}
          <div class="fmhead">${c.favN&&c.favN.best?`${esc(c.favN.best.name)} led your team — Week ${c.rc.week} grades are in`:`${esc(pw.name)} (${esc(pw.team)}) is the Week ${c.rc.week} Player of the Week`}</div>

        return `<a class="awayrow" href="${esc(c.m.url)}" target="_blank" rel="noopener noreferrer">
          <span class="awaycat">${CAT[c.m.category]||"NEWS"}</span>
          <span class="awayhl">${esc(decodeEnt(c.m.headline))}<span class="newsattr" style="display:block">${esc(c.m.source||"")}</span></span></a>`;
      }).join("")}
      <div class="secsub" style="padding:8px 2px">Your return brief: this week's analyses and the headlines that matter, once per visit. ${BRAND_LINE}</div>
      </div></div>`;
    document.body.appendChild(ov);
    navOverlay(ov, ()=>{ try{ ov.remove(); }catch(_e){} persist(); });   // U17: Back closes + persists
    ov.querySelector(".pickx").onclick=()=>{ persist(); ovDismiss(); };
    ov.onclick=e=>{ if(e.target===ov){ persist(); ovDismiss(); } };
    ov.querySelectorAll("[data-fc]").forEach(el=>el.onclick=ev=>{
      if(ev.target.closest("a")) return;
      const c=cards[Number(el.dataset.fc)]; persist();

      else if(c.kind==="pkdue") openPickem();

  }catch(e){}

// ══════ Watchdog hardening (Aug 3 2026) — loop-health surfaces ══════
// The daily loop was dead Jul 27-Aug 2 and no alert reached a human. These surfaces need
// NO push: the health state renders the moment the admin opens the app. loop_heartbeat is
// public-read (RLS); id=1 = the daily loop, id=2 = the livewp poller — judged independently,
// because a fresh row from one agent never excuses the other (that masking is exactly how
// the Monday review stayed silent).
function loopHealth(rows){
  // U58 §2: tri-state for the daily loop (id=1) driven by progress heartbeats — the
  // tick mirrors status='running' + its current step at every major boundary, so
  // "alive but slow" is distinguishable from "dead". Thresholds are the MEASURED
  // ones (model repo): STALLED > 45m without progress, DEAD > 30h without a
  // completed tick (was 48h). id=2 (livewp) stays independently judged — a fresh
  // row from one agent never excuses the other.
  const now=Date.now();
  const fmt=ts=>new Date(ts).toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
  const one=(id,name,deadH)=>{
    const r=(rows||[]).find(x=>x.id===id);
    if(!r) return {id, name, state:"DEAD", dead:true, why:"no heartbeat row", ts:null};
    const ageH=(now-new Date(r.ts).getTime())/36e5;
    if(id===1 && r.status==="running"){
      if(ageH*60<=45) return {id, name, state:"RUNNING", dead:false, ts:r.ts,
        why:`tick in flight — ${esc0(r.detail)||"working"} · progress ${Math.round(ageH*60)}m ago`};
      return {id, name, state:"STALLED", dead:true, ts:r.ts,
        why:`tick started but NO PROGRESS for ${Math.round(ageH*60)}m (>45m) — ${esc0(r.detail)||"step unknown"}. Past the 4h lock ceiling the next tick reclaims.`};
    }
    if(r.status!=="ok") return {id, name, state:"DEAD", dead:true, ts:r.ts,
      why:`last tick ERRORED (${fmt(r.ts)}) — ${String(r.detail||"").slice(0,140)}`};
    if(ageH>deadH) return {id, name, state:"DEAD", dead:true, ts:r.ts,
      why:`no heartbeat for ${Math.round(ageH)}h (> ${deadH}h; last: ${fmt(r.ts)})`};
    return {id, name, state:"OK", dead:false, ts:r.ts, why:`ok, ${ageH<1?Math.round(ageH*60)+"m":Math.round(ageH)+"h"} ago`};
  };
  return [one(1,"Daily loop",30), one(2,"Livewp poller",48)];
}
const esc0=s=>esc(String(s||""));
function loopDeadBannerHTML(h, compact){
  const bad=h.filter(x=>x.dead);
  if(!bad.length) return "";
  const anyDead=bad.some(x=>x.state==="DEAD");
  const title=anyDead?"LOOP DEAD":"LOOP STALLED";
  const since=bad[0].ts?new Date(bad[0].ts).toLocaleDateString("en-US",{month:"short",day:"numeric"}):"unknown";
  return `<div class="loopdead${compact?" compact":""}" id="loopdeadbanner" role="alert">
    <div class="ldt">${title} since ${esc(since)}</div>
    ${bad.map(x=>`<div class="ldw"><b>${esc(x.name)}:</b> ${esc(x.why)}</div>`).join("")}
    ${compact?`<div class="ldw" style="color:var(--text2)">Tap for the owner console.</div>`:`<div class="ldw" style="color:var(--text2)">Mac: launchctl list | grep hashmark · read loop.launchd.log + loop.log. The livewp agent escalates a daily push until this heals.</div>`}
  </div>`;
}

let _liveTimer=null;
function liveArm(){ if(_liveTimer) clearInterval(_liveTimer);
  liveTick(); _liveTimer=setInterval(()=>{ if(document.visibilityState==="visible") liveTick(); },60000); }
async function liveTick(){
  let rows=[];
  try{
    const since=new Date(Date.now()-12*60*1000).toISOString();
    rows=await api(`live_win_prob?select=game_id,period,clock,home_points,away_points,home_wp,leverage,segment,fetched_at&fetched_at=gt.${since}&order=fetched_at.desc&limit=120`);
  }catch(e){ return; }
  const seen={}, live=[];
  rows.forEach(r=>{ if(!seen[r.game_id]){ seen[r.game_id]=1; live.push(r); } });
  let host=document.getElementById("livewrap");
  if(!live.length){ if(host) host.remove(); return; }
  if(!host){ host=document.createElement("div"); host.id="livewrap";
    const hero=document.getElementById("v2hero");
    const anchor=(hero&&hero.parentNode===app)?hero:app.firstElementChild;   // hero may be nested
    app.insertBefore(host, anchor); }
  await ensureTeamMeta();
  let ginfo={};
  const ids=live.map(r=>r.game_id).join(",");
  try{
    (await api(`games?select=id,home_team_id,away_team_id&id=in.(${ids})`)).forEach(g=>ginfo[g.id]=g);

        h+=`</div>`;
        const players=pc.rows.filter(x=>x.subject_type!=="team");

          window._paceP[r.game_id]=players;

            <div id="pacep-${r.game_id}" style="display:none"></div>`;

  }
  h+=`<div class="note" style="margin:2px">${typeof BRAND_LINE!=="undefined"?BRAND_LINE:""}</div>`;

let RCPT_ROWS=[];
const _scGameRow=scGameRow;
scGameRow=function(g){
  let h=_scGameRow(g);
  const done=g.completed&&g.home_points!=null&&g.away_points!=null;
  if(done&&g.home_team_id&&g.away_team_id&&typeof SHOW_PREDICTIONS!=="undefined"&&SHOW_PREDICTIONS){
    RCPT_ROWS.push({id:g.id,h:g.home_team_id,a:g.away_team_id,hw:g.home_points>g.away_points});
    h=h.replace('</div>$','');
    h=h.replace(/<\/div>\s*$/,`<span class="rcpt" data-rcpt="${g.id}" style="display:none;margin-top:4px"></span></div>`);
  }
  return h;
};
const _drawScores=drawScores;
drawScores=async function(){
  RCPT_ROWS=[];
  await _drawScores.apply(this,arguments);
  const rows=RCPT_ROWS.slice(0,40); if(!rows.length) return;
  try{
    const ors=rows.map(r=>{const a=Math.min(r.h,r.a),b=Math.max(r.h,r.a);return `and(team_a.eq.${a},team_b.eq.${b})`;}).join(",");
    const mw=await api(`matchup_winprob?select=team_a,team_b,win_prob_a_home&or=(${ors})`);
    const byPair={}; mw.forEach(m=>byPair[m.team_a+"-"+m.team_b]=m);
    rows.forEach(r=>{
      const a=Math.min(r.h,r.a),b=Math.max(r.h,r.a); const m=byPair[a+"-"+b]; if(!m) return;
      const predHomeWin = (a===r.h)? m.win_prob_a_home>0.5 : m.win_prob_a_home<0.5;
      if(predHomeWin===r.hw){
        const el=document.querySelector(`[data-rcpt="${r.id}"]`);
        if(el){ el.style.display="inline-flex"; el.className="chip-model";
          el.innerHTML=`<svg class="ic"><use href="#i-check"/></svg>MODEL`; }
      }
    });
  }catch(e){}
};

async function renderTalentDividend(meta, era){

  const latest=(await api(`talent_performance?select=season&era=eq.${era}&excluded=eq.false&order=season.desc&limit=1`).catch(()=>[]))[0];

  const [rows, sus, excl]=await Promise.all([
    yr?api(`talent_performance?select=*&era=eq.${era}&season=eq.${yr}&excluded=eq.false&order=residual.desc`).catch(()=>[]):[],
    api(`talent_performance?select=school,team_id,coach,tenure_n,tenure_mean,sustained,season&era=eq.${era}&sustained=not.is.null&order=season.desc&limit=600`).catch(()=>[]),
    yr?api(`talent_performance?select=school,team_id,excl_reason&era=eq.${era}&season=eq.${yr}&excluded=eq.true`).catch(()=>[]):[] ]);
  const lbl=rows[0]?rows[0].era_label:"", src=rows[0]?rows[0].source:"";
  const tenBy={};   // latest row per (school, coach) tenure
  sus.forEach(r=>{ const k2=r.school+"|"+(r.coach||""); if(!tenBy[k2]) tenBy[k2]=r; });
  const tens=Object.values(tenBy).sort((x,y)=>Math.abs(Number(y.tenure_mean))-Math.abs(Number(x.tenure_mean)));
  const line=r=>`<div class="histrow">${crestEl("glcr",(teamMeta[r.team_id]||{}).school||r.school,oppColor(r.team_id))}

    <div class="bva" style="font-size:16px;font-weight:800${Number(r.residual)>=0?";color:var(--model)":""}">${Number(r.residual)>=0?"+":""}${Number(r.residual).toFixed(1)}</div></div>`;
  let h=`<div class="cmp">${backHeader(meta[0])}<div class="list" style="padding-top:6px">
    <div class="secsub" style="padding:0 2px 8px">${esc(meta[1])} Unit: <b>points per game vs talent-expected</b> — the residual off one national curve (year fixed effects, spline-adjusted). ${esc(lbl)}. ${esc(src)}.</div>
    <div class="lbtoggle" style="margin:2px 2px 10px">
      <button data-tdera="roster"${era==="roster"?' class="on"':""}>Roster era 2015+</button>
      <button data-tdera="class"${era==="class"?' class="on"':""}>Class era 2002&ndash;14</button></div>`;
  if(!rows.length) h+=`<div class="sec"><div class="secsub">No ${era}-era rows on file.</div></div>`;
  else{
    h+=`<div class="sec"><div class="sectitle">Did more with less <small>${yr} season · top 10</small></div>
      ${rows.slice(0,10).map(line).join("")}</div>
    <div class="sec"><div class="sectitle">Did less with more <small>${yr} season · bottom 10</small></div>
      ${rows.slice(-10).reverse().map(line).join("")}</div>
    <div class="sec"><div class="sectitle">Sustained <small>coach-tenure means · 3+ seasons · badge at 0.5 SD</small></div>
      ${tens.slice(0,12).map(r=>`<div class="histrow">${crestEl("glcr",(teamMeta[r.team_id]||{}).school||r.school,oppColor(r.team_id))}
        <div style="flex:1"><span class="pteamlink" data-team="${r.team_id}"><b>${esc(r.school)}</b></span> <small>${esc(r.coach||"")} · ${r.tenure_n} seasons</small></div>

      <div class="secsub">A sustained badge describes a tenure — it does not promise persistence (overperforming coaches get hired away, and the residual doesn't travel).</div></div>`;
    if(excl.length) h+=`<div class="sec"><div class="sectitle">Insufficient talent data <small>${yr} · excluded, never numbered</small></div>
      <div class="secsub">${excl.map(x=>`${esc(x.school)} (${esc((x.excl_reason||"").split(" - ")[0])})`).join(" · ")}</div></div>`;
  }
  h+=`<div class="sec"><div class="sectitle">Read this honestly</div><div class="secsub">

    <div class="note"><b>Talent Dividend — descriptive only.</b> It scores past seasons; it predicts nothing and is not coupled to the model's forecasts (which price the portal directly). ${BRAND_LINE}</div></div></div>`;
  app.innerHTML=h;

  document.querySelectorAll("[data-tdera]").forEach(b=>b.onclick=()=>{ if(b.dataset.tdera!==era) renderTalentDividend(meta, b.dataset.tdera); });

        <div class="sigclaim"><b>${esc(t.school||"?")}</b> is the preseason top-10 team most likely to fall out of the rankings.</div></div>
      <div class="sigchips">${drv.map(x=>`<span class="sigchip">${esc(String(x))}</span>`).join("")}</div>
      ${tr.n?`<div class="eyebrow" style="margin-top:8px">record: ${tr.hits}/${tr.n}</div>`:""}
      <div class="acc" style="margin-top:8px"><button class="acchdr" aria-expanded="false" aria-controls="accb-sighow" data-acc="sighow">
        <span>How this works</span><small>basis, scale, honesty</small><svg class="ic accchev" aria-hidden="true"><use href="#i-chev-d"/></svg></button>
      <div class="accbody" id="accb-sighow" hidden>
        <div class="secsub" style="padding:6px 2px">A regression watch-list, not a prediction — every call is logged and scored, and misses stay up.
        ${d.chance?` This call: ${esc(String(d.chance))}.`:""}${d.base_rate?` For scale: ${esc(String(d.base_rate))}.`:""}
        ${d.poll_basis?` Built on the ${esc(String(d.poll_basis))}.`:""}
        ${tr.n?` Record since ${tr.since||2014}: ${tr.hits} of ${tr.n}.`:""}
        ${esc(String(d.disclaimer||"n=11 seasons — no proven edge claimed; we log and score every call"))}</div></div></div>
    </div>`;
  } else {
    h+=`<div class="card" style="margin:10px 2px;padding:14px"><b>Collapse Index</b>
      <p style="color:var(--text2);font-size:12px;margin:4px 0 0">First board publishes with the preseason run.</p></div>`;
  }
  // Batch 8 #8: every card leads with its one-line claim (boards themselves stay
  // server-side RLS-locked to Hashmark+ rows)
  const LOCKED=[["luck_audit","Luck Audit","The teams whose records ran ahead of their play — flagged to step back."],
    ["hidden_riser","Hidden Riser","The breakout the underlying numbers already see coming."],
    ["model_vs_poll","Model vs Poll","The teams we rank furthest from the voters — tracked to a verdict."],
    ["gauntlet","The Gauntlet","The single toughest three-game stretch in football this season."],
    ["talent_bomb","Talent Bomb","Top-25 talent coming off a bottom-60% scoring-margin season — the usual bounce-back list."],
    ["lookahead_watch","Lookahead Watch","The remaining-schedule sandwich spots — with the honest 91-of-100 history attached."],
    ["talent_dividend","Talent Dividend","Who did more with less — points per game vs what that roster's talent typically produces."]];
  h+=`<div class="sect-h">The full set</div><div class="xgrid" style="padding:0 2px">`;
  LOCKED.forEach(([key,t2,p])=>{ h+=`<div class="xcard" data-lock="${key}"><svg class="ic" style="color:var(--amber)"><use href="#i-flame"/></svg>
    <h4>${t2} <span class="chip-plus" style="display:inline-flex">HASHMARK+</span></h4><p>${p}</p></div>`; });
  h+=`</div>`;
  if(myth){
    const md=myth.drivers||{};
    h+=`<div class="card" style="margin:12px 2px;padding:14px">
      <div class="eyebrow">Folklore check · non-predictive</div>
      <b>Trap-game check: the top-10 usually handles it.</b>
      <p style="color:var(--text2);font-size:12px;margin:5px 0 0">${esc(String(md.claim||"Top-10 teams win about 91 of 100 of these spots."))}${md.record?` Record: <b>${esc(String(md.record))}</b>.`:""} We publish this so you know we check the folklore too.</p></div>`;
  }
  h+=`<div class="note">${typeof BRAND_LINE!=="undefined"?BRAND_LINE:""}</div></div>`;
  app.innerHTML=h;
  document.querySelector(".back").onclick=navBack;
  document.querySelectorAll("[data-lock]").forEach(el=>el.onclick=()=>openSignatureBoard(el.dataset.lock));
}

/* boot */
refreshMyTeamTab();
// load() begins before this block parses — if the first home render won the race
// (microtasks run between script blocks), patch the extras in after the fact.
setTimeout(()=>{ try{
  // U57: bands home (the current home — #u50-band is its marker) never matches the
  // legacy guard below because its own bands ARE `.band` elements; arm the LIVE strip
  // directly if the boot race left it unarmed. v2HomeExtras stays legacy-home-only.
  if(document.getElementById("u50-band")){ if(!_liveTimer) liveArm(); }
  else if(!document.getElementById("v2hero") && !app.querySelector(".band")
     && /national leaders/i.test(app.textContent||"")){ v2HomeExtras(); liveArm(); }
}catch(e){} }, 1200);
setTimeout(()=>{ try{
  if(document.getElementById("u50-band")){ if(!_liveTimer) liveArm(); }   // U57 (see above)
  else if(!document.getElementById("v2hero") && !app.querySelector(".band")
     && /national leaders/i.test(app.textContent||"")){ v2HomeExtras(); liveArm(); }
}catch(e){} }, 3500);
// U47: the views declared in THIS block are invisible to the wrap loop in the first block
// (declarations do not hoist across <script> boundaries). Re-run it here — it is idempotent.
try{ installNavWraps(); }catch(_e){}
</script>


<script>
// PWA service worker — caches the app shell for offline + instant repeat loads. Registered
// from a relative path so it scopes correctly under the GitHub Pages project subpath. Live

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
