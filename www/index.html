     31.2 KB subset of Bricolage Grotesque, OFL — see fonts/README.md). No third-party font CDN

<script>
// U54 theme boot — runs BEFORE the stylesheet parses and before anything paints, so
// there is no flash of the wrong theme. Resolution order: the user's explicit choice
// (localStorage, mirrored to the profile for signed-in users) > OS preference
// (prefers-color-scheme) > dark (the app's native look).
(function(){
  try{
    var t=localStorage.getItem("hm_theme");
    if(t!=="light"&&t!=="dark")
      t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches)?"light":"dark";
    document.documentElement.dataset.theme=t;
  }catch(e){ document.documentElement.dataset.theme="dark"; }
})();
</script>
<style>
  /* PRIMETIME (games-ux sprint, decided): deep navy under-the-lights base, gold primary,
     teal accent. Semantics unchanged: amber=user, teal=Model, green/red=stat good/bad.
     Team badges stay TRUE team colors (broadcast treatment) — inline styles, untouched. */
  :root{
    --bg:#0b1120; --surface:#131C31; --surface2:#182342; --line:rgba(255,255,255,.07);
    --line2:rgba(255,255,255,.12); --tabbar:#0C1326;
    --text:#EAF0FB; --text2:#7F92B0;
    /* U55: --text3 was #5A6C8C, which measured 3.55:1 on --bg, 3.20 on --surface and 3.28 on
       a card — under WCAG AA for the small micro-caps text it carries, and that was true
       BEFORE any video existed. Raised until it clears 4.5 on every surface the app paints. */
    --text3:#7188B0; --legal:#41506B;
    --amber:#FFBE3D; --amber-tint:rgba(255,190,61,.13);
    --teal:#31E0C8; --teal-tint:rgba(49,224,200,.12);
    --live:#FF5C5C; --loss:#E05B5B;
    /* U49 SEMANTIC ACCENT TOKENS — the contract, expressed as variables so a future
       reclassification is a one-line edit instead of a sweep. Full inventory and the
       per-usage classification live in briefs/audit-U49-palette.md.
         --model   the Model speaks: anything Hashmark itself computed or predicted
         --user    the human side: you, your team, your picks, the crowd/consensus,
                   and the primary interactive state (an active tab IS where you are)
         --warn    provisional / disputed / stale — neither Model nor user. Keeps the
                   exact hue it already had, so U49 changes no pixels here; it just
                   stops these caveats from being mistaken for the user accent.
         --stat    official third-party stat emphasis (CFBD leaders, poll ranks,
                   stat-vs-stat winners). DELIBERATELY still amber — see the audit's
                   "not remapped" section. Flip this one line to neutralise them. */
    --model:var(--teal); --model-tint:var(--teal-tint);
    /* the model family is COOL (aqua -> teal -> blue). --model-strong keeps the three
       rating boards distinguishable now that Overall has left the amber side:
       Overall #6DF2D8 / Offense --teal #31E0C8 / Defense #7CA8FF. */
    --model-strong:#6DF2D8;
    --user:var(--amber); --user-tint:var(--amber-tint);
    --warn:#E8B657;
    --stat:var(--amber);
  }


  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:"Barlow",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:460px;margin:0 auto;min-height:100vh;
    /* U56: the column's one-off radial became --trt-base (same values). Inert today —
       U55's `.wrap{background:transparent!important}` lets the backdrop stage paint —
       but if that override ever lifts, the column falls back to the token, not a hex. */
    background:var(--trt-base);
    border-left:1px solid var(--line);border-right:1px solid var(--line)}
  header{position:sticky;top:0;z-index:5;padding:18px 18px 0;
    background:rgba(11,17,32,.9);backdrop-filter:blur(10px)}
  .wordmark{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:26px;letter-spacing:-.5px;cursor:pointer}
  .wordmark .dot{color:var(--amber)}
  /* season toggle */
  .toggle{display:flex;gap:6px;margin:14px 0 10px;background:var(--surface);
    border:1px solid var(--line);border-radius:12px;padding:4px}
  .toggle button{flex:1;background:transparent;border:0;color:var(--text2);
    font-family:"Barlow";font-weight:700;font-size:13px;padding:9px 6px;
    border-radius:9px;cursor:pointer;line-height:1.2}
  .toggle button small{display:block;font-weight:500;font-size:10px;opacity:.8;margin-top:2px}
  .toggle button.on{background:linear-gradient(150deg,#ffc44d,#ff9e2e);color:#3a2400;
    box-shadow:0 4px 14px rgba(255,158,46,.28)}
  .toggle button.on small{opacity:.75}
  .subtitle{color:var(--text2);font-size:12.5px;margin:2px 0 12px}
  .subtitle b{color:var(--text);font-weight:600}
  .fdline{height:2px;background:var(--amber);box-shadow:0 0 12px rgba(246,180,60,.5);border-radius:2px}
  .list{padding:6px 12px 18px}   /* U70 (P3 #14): body already pads 76px for the tab bar — 90px here stacked to ~170px of dead bottom space */
  .row{display:flex;align-items:center;gap:12px;padding:12px 8px;border-bottom:1px solid var(--line)}
  .rank{font-family:"IBM Plex Mono",monospace;font-weight:700;font-size:15px;
    color:var(--text2);width:26px;text-align:right;flex:none}
  .row.top .rank{color:var(--amber)}
  .crest{width:40px;height:40px;border-radius:11px;flex:none;display:grid;place-items:center;
    font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:13px;letter-spacing:.3px;
    border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 -8px 14px rgba(0,0,0,.28)}
  .meta{flex:1;min-width:0}
  .team{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .conf{color:var(--text2);font-size:12px;margin-top:2px}
  .rating{text-align:right;flex:none}
  .rval{font-family:"IBM Plex Mono",monospace;font-weight:700;font-size:17px;
    border-bottom:2px solid var(--amber);padding-bottom:1px}
  .rlbl{color:var(--text2);font-size:10px;letter-spacing:.4px;margin-top:3px;text-transform:uppercase}
  .splits{display:flex;gap:8px;justify-content:flex-end;margin-top:5px}
  .chip{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--text2)}
  .chip b{color:var(--teal);font-weight:700}
  .chip.d b{color:#7CA8FF}
  .note{color:var(--text2);font-size:11px;line-height:1.5;padding:16px 20px 30px;border-top:1px solid var(--line)}
  .loading,.err{color:var(--text2);text-align:center;padding:50px 20px;font-family:"IBM Plex Mono",monospace;font-size:13px}
  .err{color:#E5705C}
  [data-tip]{cursor:help}
  .tip{position:fixed;z-index:60;max-width:264px;background:var(--surface2);
    border:1px solid var(--amber);color:var(--text);font-size:12.5px;line-height:1.5;
    padding:11px 13px;border-radius:11px;box-shadow:0 10px 28px rgba(0,0,0,.55);
    pointer-events:none;opacity:0;transform:translateY(5px);transition:opacity .12s,transform .12s}
  .tip.show{opacity:1;transform:translateY(0)}
  .hint{color:var(--text2);font-size:11px;text-align:center;padding:10px 0 2px}
  .row{cursor:pointer}
  .chev{color:var(--text2);font-size:20px;flex:none;width:10px;text-align:center;opacity:.7}
  /* ---- team detail page ---- */
  .detail{padding:0 0 96px}
  .dtop{display:flex;align-items:center;gap:12px;padding:14px 16px 4px;position:sticky;top:0;z-index:5;
    background:rgba(11,15,20,.92);backdrop-filter:blur(10px)}
  .back{background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:10px;
    width:38px;height:38px;font-size:20px;cursor:pointer;flex:none;display:grid;place-items:center;line-height:1}
  .dtop .wordmark{font-size:20px}
  .dhead{display:flex;align-items:center;gap:14px;padding:8px 18px 4px}
  .dcrest{width:60px;height:60px;border-radius:16px;flex:none;display:grid;place-items:center;
    font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:19px;letter-spacing:.3px;
    border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 -10px 18px rgba(0,0,0,.3)}
  .dschool{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:23px;letter-spacing:-.3px;line-height:1.1}
  .dconf{color:var(--text2);font-size:13px;margin-top:4px}
  .dconf .rk{color:var(--amber);font-weight:700}
  .drating{text-align:center;padding:10px 18px 18px}
  .drk{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:20px;color:var(--amber);margin-top:8px}
  .drk small{color:var(--text3);font-weight:600;font-size:11px}
  .dunits{display:flex;gap:14px;justify-content:center;margin-top:6px;font-family:"IBM Plex Mono",monospace;font-size:12.5px}
  .dunits span{cursor:help}
  .dunits span:first-child{color:var(--teal)} .dunits span:last-child{color:#7CA8FF}
  .dbig{font-family:"IBM Plex Mono",monospace;font-weight:700;font-size:46px;line-height:1;
    border-bottom:3px solid var(--amber);display:inline-block;padding-bottom:5px}
  .dlbl{color:var(--text2);font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;margin-top:9px}
  .od{display:flex;gap:12px;padding:6px 18px 14px}
  .odcard{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 14px;text-align:center}
  .odk{font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--text2)}
  .odv{font-family:"IBM Plex Mono",monospace;font-weight:700;font-size:22px;margin-top:4px}
  .odcard.o .odv{color:var(--teal)} .odcard.d .odv{color:#7CA8FF}
  .sec{padding:4px 18px}
  .sectitle{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:15px;margin:16px 0 2px}
  .secsub{color:var(--text2);font-size:11.5px;margin-bottom:8px;line-height:1.5}
  .driver{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}
  .dvk{width:84px;flex:none;font-weight:600;font-size:13px}
  .dvbar{flex:1;height:9px;background:var(--surface2);border-radius:6px;position:relative}
  .dvbar i{position:absolute;top:0;bottom:0;border-radius:6px}
  .dvbar i.pos{background:var(--amber)} .dvbar i.neg{background:#5C6B7A}
  .dvbar .mid{position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--line)}
  .dvv{font-family:"IBM Plex Mono",monospace;font-weight:700;font-size:13px;width:54px;text-align:right;flex:none}
  .ctx{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:4px 0;
    background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 10px}
  .ctxcol{text-align:center;flex:1}
  .ctxcol .y{color:var(--text2);font-size:11px;text-transform:uppercase;letter-spacing:.4px}
  .ctxcol .v{font-family:"IBM Plex Mono",monospace;font-weight:700;font-size:17px;margin-top:4px}
  .ctxcol .vs{font-size:11px;color:var(--text2);font-weight:500;margin-top:2px}
  .ctxarrow{color:var(--amber);font-size:22px;flex:none}
  .prem{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;
    padding:14px 16px;margin-bottom:11px;overflow:hidden}
  .prem .ptitle{font-weight:700;font-size:13.5px;margin-bottom:9px;display:flex;align-items:center;gap:7px}
  .prem .ptitle .ic{opacity:.85}
  .prem .blur{filter:blur(5px);opacity:.45;pointer-events:none;user-select:none}
  .prem .fakebar{height:9px;background:var(--surface2);border-radius:6px;margin:8px 0}
  .prem .lock{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:5px;background:linear-gradient(180deg,rgba(20,26,34,.15),rgba(20,26,34,.78))}
  .lockbadge{background:var(--amber);color:#10130c;font-weight:700;font-size:10.5px;
    padding:3px 10px;border-radius:20px;letter-spacing:.5px}
  .lock .lt{font-size:12.5px;color:var(--text);font-weight:600;text-align:center;padding:0 20px}
  /* ---- leaderboards (overall / offense / defense + conference) ---- */
  .bnav{display:flex;gap:6px;margin:0 0 9px;background:var(--surface);
    border:1px solid var(--line);border-radius:11px;padding:4px}
  .bnav button{flex:1;background:transparent;border:0;color:var(--text2);
    font-family:"Barlow";font-weight:700;font-size:12.5px;padding:8px 4px;
    border-radius:8px;cursor:pointer;line-height:1.1}
  .bnav button.on{background:var(--surface2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
  .bnav button.on.off{color:var(--teal)} .bnav button.on.def{color:#7CA8FF}
  .confbar{display:flex;gap:7px;overflow-x:auto;padding:1px 0 10px;scrollbar-width:none}
  .confbar::-webkit-scrollbar{display:none}
  .confpill{flex:none;background:var(--surface);border:1px solid var(--line);color:var(--text2);
    font-family:"Barlow";font-size:12px;font-weight:600;padding:6px 12px;border-radius:20px;
    cursor:pointer;white-space:nowrap}
  .confpill.on{background:var(--amber);color:#10130c;border-color:var(--amber)}
  .cstr{margin:2px 0 4px}
  .cstrtitle{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:12.5px;color:var(--text2);
    text-transform:uppercase;letter-spacing:.4px;margin:2px 2px 6px}
  .cstrrow{display:flex;align-items:center;gap:10px;padding:7px 2px;border-bottom:1px solid var(--line);cursor:pointer}
  .cstrrow .ci{font-family:"IBM Plex Mono",monospace;font-weight:700;font-size:12px;color:var(--text2);width:18px;text-align:right;flex:none}
  .cstrrow .cn{flex:none;width:108px;font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cstrrow .cn small{color:var(--text2);font-weight:500;font-size:10px}
  .cstrrow .cbar{flex:1;height:8px;background:var(--surface2);border-radius:5px;position:relative;overflow:hidden}
  .cstrrow .cbar i{position:absolute;top:0;bottom:0;border-radius:5px}
  .cstrrow .cbar i.neg{background:#5C6B7A;opacity:.8}
  .cstrrow .cvv{font-family:"IBM Plex Mono",monospace;font-weight:700;font-size:12px;width:54px;text-align:right;flex:none}
  .csum{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 15px;margin:0 0 8px}
  .csum .ch{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .csum .cnm{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:18px;line-height:1.1}
  .csum .crk{color:var(--amber);font-weight:700;font-size:12px;flex:none}
  .csum .cv{font-family:"IBM Plex Mono",monospace;font-weight:700;font-size:16px;margin-top:7px}
  .csum .csub{color:var(--text2);font-size:11.5px;margin-top:2px;line-height:1.4}
  /* ---- compare affordances (rankings + team detail) ---- */
  .cmpcta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
    background:var(--surface);border:1px solid var(--amber);color:var(--amber);
    font-family:"Barlow";font-weight:700;font-size:13px;padding:11px;border-radius:12px;
    cursor:pointer;margin:0 0 8px}
  .cmpcta .ar{font-size:15px;line-height:1}
  .cmpcta:hover{background:rgba(246,180,60,.08)}
  /* ---- compare screen ---- */
  .cmp{padding:0 0 96px}
  .cmptop{display:flex;align-items:center;gap:12px;padding:14px 16px 4px;position:sticky;top:0;z-index:5;
    background:rgba(11,15,20,.92);backdrop-filter:blur(10px)}
  .cmptop .wordmark{font-size:20px}
  .cmptag{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:13px;color:var(--text2);
    margin-left:auto;letter-spacing:.4px;text-transform:uppercase}
  /* U23: the persistent header search icon — ONE element re-mounted into whichever
     header the active view rendered; margin-left:auto rides flex to the right edge
     (.cmptop's cmptag already owns the auto margin, so there it just appends after) */
  .hdrsearch{flex:none;display:flex;align-items:center;justify-content:center;width:34px;height:34px;
    margin-left:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;
    color:var(--text2);cursor:pointer;padding:0}
  .hdrsearch .ic{width:15px;height:15px}
  .hdrsearch:active{border-color:var(--amber);color:var(--amber)}
  .cmptop .hdrsearch{margin-left:0}   /* cmptag already owns the auto margin there */
  /* U23: notched-iOS safe area — the sticky headers (the icon rides inside them) pad
     below the status bar in the standalone PWA */
  @supports(padding:max(0px)){
    header{padding-top:max(18px, env(safe-area-inset-top))}
    .dtop{padding-top:max(14px, env(safe-area-inset-top))}
    .cmptop{padding-top:max(14px, env(safe-area-inset-top))}
  }
  /* team pickers */
  .pickrow{display:flex;align-items:stretch;gap:9px;padding:12px 14px 4px}
  .pick{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;
    padding:13px 8px 11px;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;text-align:center}
  .pick:hover{border-color:var(--amber)}
  .pick .pcrest{width:54px;height:54px;border-radius:15px;display:grid;place-items:center;
    font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:16px;letter-spacing:.3px;
    border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 -9px 15px rgba(0,0,0,.28)}
  .pick .pname{font-weight:700;font-size:14.5px;line-height:1.15;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .pick .pconf{color:var(--text2);font-size:11px}
  .pick .pchg{color:var(--amber);font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
    border:1px solid var(--line);border-radius:20px;padding:2px 9px;margin-top:1px}
  .pickvs{align-self:center;font-family:"Barlow Condensed",sans-serif;font-weight:800;color:var(--text2);font-size:13px;flex:none}
  /* venue toggle (reuses .toggle) */
  .venue{margin:6px 14px 2px}
  .venuesub{text-align:center;color:var(--text2);font-size:11.5px;margin:3px 0 4px;line-height:1.4}
  .venuesub b{color:var(--text);font-weight:600}
  /* headline */
  .headcard{margin:9px 14px 4px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:15px 15px 14px}
  .hl{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:19px;line-height:1.25;text-align:center}
  .hl .by{color:var(--amber)}
  .hlsub{text-align:center;color:var(--text2);font-size:12px;margin-top:5px}
  .hlsub b{color:var(--text)}
  .wpbar{display:flex;height:30px;border-radius:9px;overflow:hidden;margin-top:13px;border:1px solid var(--line)}
  .wpbar .seg{display:flex;align-items:center;font-family:"IBM Plex Mono",monospace;font-weight:700;
    font-size:12.5px;padding:0 10px;min-width:0;overflow:hidden;white-space:nowrap}
  .wpbar .seg.b{justify-content:flex-end}
  .wplbl{display:flex;justify-content:space-between;margin-top:7px;font-size:11px;color:var(--text2)}
  .wplbl b{color:var(--text);font-weight:600}
  /* compare rows (ratings + components) */
  .cmpsec{padding:4px 16px}
  .cmprow{padding:10px 2px;border-bottom:1px solid var(--line)}
  .cmpk{text-align:center;font-size:11px;color:var(--text2);font-weight:700;margin-bottom:7px;
    text-transform:uppercase;letter-spacing:.5px}
  .cmpgrid{display:grid;grid-template-columns:54px 1fr 1fr 54px;align-items:center;gap:6px}

  /* ============ v2 DESIGN LAYER (redesign brief) ============ */
  .ic{width:1em;height:1em;display:inline-block;vertical-align:-.12em}
  .nic .ic{width:15px;height:15px}
  body{padding-bottom:76px}
  .wrap{max-width:460px}
  h1,h2,.wordmark,.screen-title{font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.02em}
  /* tab bar */
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;justify-content:center;
    padding:8px 10px calc(10px + env(safe-area-inset-bottom));

  .tabbar button{flex:1;min-height:44px;background:transparent;border:0;border-radius:999px;
    color:var(--text2);font-family:"Barlow",sans-serif;font-weight:700;font-size:11.5px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px}
  .tabbar button .ic{width:17px;height:17px}
  .tabbar button.on{background:var(--amber);color:#10130c}

  /* cards + hero */
  .card-hero-amber{background:linear-gradient(160deg,#241a08,#101828 55%);border-color:rgba(255,190,61,.3);
    box-shadow:0 0 0 1px rgba(49,224,200,.14), 0 14px 40px rgba(20,80,120,.24)}
  .card-hero-teal{background:linear-gradient(160deg,#0E1A16,#121820 55%);border-color:rgba(53,217,196,.3)}
  /* probability bar */
  .pbar{position:relative;height:6px;border-radius:999px;background:rgba(255,255,255,.08);overflow:visible}
  .pbar .fill{position:absolute;inset:0 auto 0 0;border-radius:999px;background:linear-gradient(90deg,#B87708,#FFB020);transition:width .5s ease}
  .pbar .tick{position:absolute;top:-2px;bottom:-2px;width:2px;background:rgba(255,255,255,.4)}
  .pbar.teal .fill{background:linear-gradient(90deg,#0F8E7E,#35D9C4)}
  .plabel{display:flex;justify-content:space-between;font-size:11px;color:var(--text2);margin-top:5px}
  .plabel b{color:var(--text);font-family:"IBM Plex Mono",monospace}
  /* season dot strip */
  .dotstrip{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
  .dotstrip .d{width:11px;height:11px;border-radius:999px}
  .dotstrip .d.w{background:var(--teal)} .dotstrip .d.l{background:var(--loss)}
  .dotstrip .d.n{background:transparent;border:1.6px solid var(--amber);animation:hmPulse 1.6s infinite}
  /* percentile dial */
  .dial{--p:50;--dc:var(--amber);width:44px;height:44px;border-radius:50%;position:relative;flex:none;
    background:conic-gradient(var(--dc) calc(var(--p)*1%),rgba(255,255,255,.08) 0)}
  .dial::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--surface)}
  .dial span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:700;z-index:1}
  /* pills + chips */
  .chip-model{display:inline-flex;align-items:center;gap:4px;font-family:"IBM Plex Mono",monospace;
    font-size:9px;font-weight:600;letter-spacing:.08em;color:var(--teal);background:var(--teal-tint);
    border:1px solid rgba(53,217,196,.35);border-radius:999px;padding:2px 7px;text-transform:uppercase}
  .chip-live{display:inline-flex;align-items:center;gap:5px;font-family:"IBM Plex Mono",monospace;

  .eyebrow{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--text3)}
  .sect-h{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);margin:18px 0 8px}
  .sect-h .ctx{font-family:"IBM Plex Mono",monospace;font-weight:400;letter-spacing:.06em;margin-left:6px}
  /* omnibox */
  .omni{position:fixed;inset:0;z-index:80;background:rgba(11,15,20,.94);display:none;flex-direction:column;padding:14px}
  .omni.show{display:flex;animation:hmRise .25s ease}
  .omni input,.omni .results{width:100%;max-width:560px;margin-left:auto;margin-right:auto}   /* U70: keep the app column on desktop */
  .omni input{background:var(--surface2);border:1px solid var(--line2);border-radius:12px;color:var(--text);

  .omni .r-row{display:flex;align-items:center;gap:10px;min-height:44px;padding:8px 6px;border-bottom:1px solid var(--line);cursor:pointer}

  .xgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  /* PRIMETIME finishing layer: card gradients + restrained glow (lighting, not neon) */

  /* U46 accent discipline: a W-L record is a plain fact - it is neither the user/crowd
     (amber) nor the Model (teal), so it wears the warm display tier and no glow. */
  .recbig{color:var(--textw);text-shadow:none}

  /* ══════════════ U46 "PRIMETIME POLISH" — app-wide token pass ══════════════
     RESTYLE ONLY. Nothing here moves, reorders or adds a layout box; every rule
     re-dresses markup that already existed (the home rebuild is U47).

     ACCENT CONTRACT (the one rule that governs colour in this app):
       --amber  = the USER and the CROWD — your team, your picks, what the crowd
                  thinks, and the primary interactive state.
       --teal   = the MODEL — anything Hashmark itself computed or predicted.
       green/red = a stat being good/bad. Team colours = a team's own identity.
       Nothing else earns an accent. Accents are NEVER decoration: no accent-tinted
       borders, glows or fills that don't carry one of the meanings above.
     Set-dressing therefore has to come from LIGHT, not colour - hence the veil /
     texture / watermark layer below, which is white-on-navy at 2-4% and colourless. */
  @font-face{
    font-family:"Hashmark Display";
    src:url("fonts/hashmark-display.woff2") format("woff2-variations");
    font-weight:600 800;font-style:normal;font-display:swap;
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,
      U+2013-2014,U+2018-201A,U+201C-201E,U+2020-2022,U+2026,U+2030,U+2039-203A,
      U+2044,U+2122,U+2212;
  }
  :root{
    /* display face — always falls back to the existing condensed stack, so a missing
       font file changes nothing but the texture of the headlines */
    --display:"Hashmark Display","Barlow Condensed",system-ui,sans-serif;
    /* warm the TYPE, not the background (dark-first adaptation of the cream comp) */
    --textw:#F2EFE7;
    /* display type scale — tight leading, slight negative tracking */
    --d1:30px; --d2:22px; --d3:18px; --d4:15px;
    --lh-d:.94; --tr-d:-.018em;
    /* micro-caps voice (eyebrows, ALL pills, chips, table heads) */
    --caps-size:9.5px; --caps-track:.16em;
    /* spacing rhythm */
    --s1:4px; --s2:8px; --s3:12px; --s4:18px; --s5:26px;
    /* radius + shadow */
    --r-chip:999px; --r-card:14px; --r-panel:18px;
    --sh-card:0 6px 22px rgba(0,0,0,.34); --sh-pop:0 12px 30px rgba(0,0,0,.5);
    /* U54: the card fill became a token (was a hardcoded dark gradient at 5 call
       sites — invisible-in-dark, but it painted every core card dark in light mode) */
    --card-fill:linear-gradient(165deg,#151f36,#101828);
    --card-fill-amber:linear-gradient(160deg,#241a08,#101828 60%);
    /* band tone (U47 alternates --bg against this) + the amber-to-teal band hairline */
    --band:#0E1626;
    /* atmosphere: yard lines every 40px + a hash-mark tick row — white at 2-3.5%, no hue */
    --tex-yard:repeating-linear-gradient(90deg,rgba(255,255,255,.030) 0 1px,transparent 1px 40px);
    --tex-hash:repeating-linear-gradient(90deg,transparent 0 18px,rgba(255,255,255,.022) 18px 19px,transparent 19px 40px);
    --veil:linear-gradient(180deg,rgba(11,17,32,0) 0%,rgba(11,17,32,.55) 62%,rgba(11,17,32,.92) 100%);
  }

  /* ---- atmosphere layer: one fixed, pointer-transparent stage behind the app.
     Sub-perceptual by design (a 3% yard-line grid + a 2% hash-tick row + one very
     soft amber corner flare). Fixed + transform-free, so it can never shift layout. */
  .wrap{position:relative;isolation:isolate}
  .wrap::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:var(--tex-yard),var(--tex-hash),
      radial-gradient(70% 42% at 50% -6%,rgba(255,255,255,.045),transparent 70%);}
  /* a reusable bottom veil for any stacked/overlaid surface (U47/U48 reuse this) */
  .veil{position:absolute;inset:0;pointer-events:none;background:var(--veil)}
  /* ghost display-type watermark — huge, 3.5% white, clipped, never interactive */
  .ghostwm{position:absolute;pointer-events:none;user-select:none;z-index:0;
    font-family:var(--display);font-weight:800;letter-spacing:-.04em;line-height:.8;
    color:rgba(242,239,231,.035);white-space:nowrap;text-transform:uppercase}
  /* team surface: the school name set huge behind its own header. Absolutely positioned
     inside an overflow-clipped, already-existing header row -> it occupies no space and
     cannot move anything; the row keeps its own height. */
  .dhead{position:relative;overflow:hidden}
  /* line-height must be >=1 here: the base .ghostwm rule squeezes the line box to .8,
     which pushes ascenders above the box and the clipped header crops them */
  .dhead .ghostwm{left:-2px;top:2px;font-size:44px;line-height:1.3;z-index:0}
  /* the shared veil token, used for real: the watermark dissolves into the page rather
     than ending on a hard clip edge (same gradient U47/U48 use on band + stage edges) */
  .dhead::after{content:"";position:absolute;left:0;right:0;bottom:0;height:36px;
    pointer-events:none;background:var(--veil);z-index:0}
  .dhead > *:not(.ghostwm){position:relative;z-index:1}

  /* ---- display type: applied to HEADLINE surfaces only. Tabular numerals stay
     IBM Plex Mono (swapping them would break column alignment) and the wordmark
     stays Barlow Condensed (a logo is not a token). */
  .sectitle,.hsectitle,.sechead h2,.dschool,.acchdr,.cmp h2,.card h2,.sec h2{
    font-family:var(--display);letter-spacing:var(--tr-d);color:var(--textw)}
  .sectitle{font-weight:700;font-size:var(--d3);line-height:var(--lh-d);margin:16px 0 3px}
  .hsectitle{font-weight:700;font-size:var(--d3);line-height:var(--lh-d)}
  .dschool{font-weight:800;font-size:24px;line-height:.96}
  .acchdr{font-weight:700;font-size:var(--d4);letter-spacing:-.005em}
  /* the contextual <small> that ~40 section titles already carry becomes ONE
     micro-caps voice everywhere (no uppercase forcing — several are sentences) */
  .sectitle small,.hsectitle small{font-family:"IBM Plex Mono",monospace;font-weight:500;
    font-size:9.5px;letter-spacing:.06em;color:var(--text3);text-transform:none}

  /* ---- micro-caps eyebrow (the "HASHMARK · X" drumbeat) */
  .eyebrow{font-family:"IBM Plex Mono",monospace;font-size:var(--caps-size);font-weight:600;
    letter-spacing:var(--caps-track);text-transform:uppercase;color:var(--text3)}
  .eyebrow.brand{color:var(--text2)}
  .eyebrow.brand::before{content:"";display:inline-block;width:5px;height:5px;border-radius:999px;
    background:currentColor;opacity:.55;margin-right:6px;vertical-align:2px}

  /* ---- section grammar: eyebrow / display H2 / count-freshness chip / "ALL" pill */
  .sechead{display:flex;align-items:flex-end;gap:10px;margin:var(--s4) 2px var(--s2)}
  .sechead .shl{flex:1;min-width:0}
  /* h2 is uppercase app-wide (the global h1,h2 rule) - display caps want tracking near
     zero, not the negative tracking that suits mixed-case display type */
  .sechead h2{font-weight:700;font-size:var(--d2);line-height:var(--lh-d);margin:4px 0 0;
    text-transform:uppercase;letter-spacing:-.008em}
  .sechead .chiprow{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .allpill{flex:none;display:inline-flex;align-items:center;gap:5px;min-height:44px;padding:0 12px;
    font-family:"IBM Plex Mono",monospace;font-size:9.5px;font-weight:600;letter-spacing:.14em;
    text-transform:uppercase;color:var(--text2);background:var(--surface);
    border:1px solid var(--line2);border-radius:var(--r-chip);cursor:pointer;white-space:nowrap}
  .allpill:hover{border-color:var(--amber);color:var(--text)}
  .allpill .ic{width:11px;height:11px;flex:none}

  /* ---- standardized count / freshness chips ("136 TEAMS", "UPDATED SUNDAY").
     Neutral by default; .fresh is the only tinted variant and it is teal because
     freshness is a statement about the MODEL's own pipeline. */
  .cchip{display:inline-flex;align-items:center;gap:5px;font-family:"IBM Plex Mono",monospace;
    font-size:9px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--text3);
    border:1px solid var(--line);border-radius:var(--r-chip);padding:3px 9px;white-space:nowrap}
  .cchip.count{color:var(--text2)}
  .cchip.fresh{color:var(--teal);border-color:rgba(49,224,200,.30);background:var(--teal-tint)}
  .cchip.dot::before{content:"";width:5px;height:5px;border-radius:999px;background:currentColor;
    flex:none;animation:hmPulse 2.4s infinite}

  /* ---- scroll-reveal: opacity ONLY. A transform would create a containing block
     and break the sticky sub-headers inside stat panels (U36), and opacity can
     never move a box — so this contributes exactly 0 to CLS. */
  .reveal{opacity:0;transition:opacity .5s ease}
  .reveal.on{opacity:1}
  /* reduced motion: no fade, no pulse, nothing hidden — content is simply THERE */
  @media (prefers-reduced-motion: reduce){
    .reveal{opacity:1!important;transition:none!important}
    .cchip.dot::before{animation:none!important}
  }
  /* ══════════════════════════ end U46 tokens ══════════════════════════ */

  /* ══════════════ U49 PALETTE REMAP — Model = teal, user/crowd = amber ══════════════
     OWNER-DECIDED. U46 flagged that the Model's flagship numbers were painted in the
     USER accent and refused to half-fix it; this block finishes the job.

     It is an OVERRIDE layer on purpose: the original rules are left untouched, so the
     whole remap is one readable, revertable diff (the U46 pattern). Selectors only —
     no markup moved, no logic, no copy changed.
     Every classification is recorded in briefs/audit-U49-palette.md. Contrast on the
     darkest surface this app paints (--surface2 #182342): teal 9.30:1, amber 9.34:1 —
     both far past WCAG AA (4.5) and AAA (7), so the swap costs no legibility. */

  /* ---- 1. RATINGS: the flagship model number, its rank, and its drivers ----
     NOT here: .rval and .row.top .rank. rowHTML() is shared by the model board AND the
     final-AP board, so a blanket rule would have painted official poll ranks in the
     Model's colour (caught in visual verify). The model board already accents its own
     underline inline from MODES.accent, which U49 points at --model; the AP board and
     the top-3 position highlight are classified --stat in section 4 below. */
  .dconf .rk{color:var(--model)}                           /* "#5" in the team line */
  .drk{color:var(--model)}                                 /* "#5 of 138" under the hero */
  .dbig{color:var(--model);border-bottom-color:var(--model);
    text-shadow:0 0 18px rgba(49,224,200,.42)}             /* the rating hero itself */
  .dvbar i.pos{background:var(--model)}                    /* why-this-rating drivers */

  /* ---- 2. WIN PROBABILITY / PROJECTIONS ---- */
  .mwpbar i{background:var(--model)}                       /* matchup win-prob bar */
  /* .boxrow .win is the app's "this is the model's headline number" cell: the game
     page's win %, live win prob, Hashmark Grades >=70, EPA/play callouts, and the
     poll-era title count (a Hashmark-curated ledger under a stated definition). */
  .boxrow .win{color:var(--model)}
  .gleg .glp{color:var(--model)}                           /* gauntlet leg win prob */
  /* the probability bar is only ever fed model output (playoff odds, live win prob) */
  .pbar .fill{background:linear-gradient(90deg,#0F8E7E,#35D9C4)}

  /* ---- 3. SIMULATOR + PLAYOFF ODDS (Monte-Carlo output) ---- */
  .oddrow .ov:first-of-type{color:var(--model)}            /* Make CFP % */
  /* the distribution histogram is Monte-Carlo output in both of its user-facing uses
     (projected win totals on a team page, projected seed in the sim). The owner
     console reuses the same component for DAU counts - tagged .admin, stays neutral. */
  .rdcol i{background:var(--model)}
  .rdist.admin .rdcol i{background:var(--text3)}
  .simseed .ssn{color:var(--model)}                        /* projected seed */
  .simseed .ssr .ssmc{color:var(--model)}                  /* MAKE CFP chip */

  /* ---- 4. OFFICIAL THIRD-PARTY STATS: classified, deliberately NOT recoloured.
     These are neither Model nor user (CFBD leaders, poll ranks, stat-vs-stat winners).
     Pointing them at --stat makes that classification executable: one line in :root
     neutralises them all if the owner decides they should stop wearing an accent. */
  .leadrow .lst,.ncard .nval,.lbmini .mvl,.t25row .trk,
  .mrow .mval.win b,.row.top .rank{color:var(--stat)}
  .rval{border-bottom-color:var(--stat)}   /* overridden inline on the model board only */

  /* ---- 5. CAVEAT STATES: provisional / disputed / stale. Same hue as before —
     this only stops them from reading as the user accent. ---- */
  .simstale{color:var(--warn);background:rgba(232,182,87,.09);border-color:rgba(232,182,87,.5)}
  .nilrow.hot{border-color:var(--warn)}
  .nilconf.disputed{color:var(--warn)}

  /* ---- 6. CONTRAST PAIRS: the surfaces whose entire job is Model vs crowd/user.
     Both sides must read as two colours, so they are pinned explicitly. ---- */
  .lknm .u-crowd{color:var(--user);font-weight:700}        /* crowd vs model radar */
  .lknm .u-model{color:var(--model);font-weight:700}
  .boxrow.is-model .bk{color:var(--model)}                 /* pick'em: the Model member */
  .boxrow.is-model .bvb{color:var(--model)}
  .strow.me,.boxrow.is-me .bk{color:var(--user)}           /* pick'em: you */
  .simmeta .u-you{color:var(--user);font-weight:700}       /* sim: your scenario ... */
  .simmeta .u-model{color:var(--model);font-weight:700}    /* ... vs the model default */
  /* ══════════════════════════ end U49 remap ══════════════════════════ */

  /* ══════════════ U47 HOME BAND GRAMMAR ══════════════
     The home page recomposed as a stack of full-bleed bands. Every band follows the U46
     grammar (eyebrow / display H2 / count-freshness chips / ALL pill) and every accent
     obeys the U49 contract (teal = the Model, amber = you and the crowd).
     Bands alternate --bg against a slightly raised tone, separated by a 2px amber-to-teal
     hairline: the human side of the rule flows into the model side. */
  .band{position:relative;padding:18px 12px 20px;margin:0 -12px}
  .band + .band{border-top:1px solid var(--line)}
  .band.raised{background:var(--band)}
  .band.rule::before{content:"";position:absolute;left:0;right:0;top:-1px;height:2px;
    background:linear-gradient(90deg,var(--user),var(--model));opacity:.55}
  .band > .bandin{max-width:100%}

  /* ---- Band 1: the hero. A static layer stack today - base gradient, hash/yard texture,
     veil, copy. U48 swaps the middle layer for the self-drawing win-probability canvas;
     the layers below are already in their final order so that lands as one insertion. */
  .hero47{position:relative;overflow:hidden;border-radius:18px;margin:2px 0 4px;
    padding:26px 16px 18px;isolation:isolate;
    background:radial-gradient(120% 90% at 50% -20%,#17233f,#0d1526 55%,#0a1120)}
  .hero47::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
    background:var(--tex-yard),var(--tex-hash)}
  /* U48: the hero's veil is NOT the shared --veil any more. --veil starts fully transparent at
     the top, which was fine over a flat gradient but not over footage: measured against the
     composited stack the 12.5px sub-copy fell to 2.68:1 and the eyebrow pill to 2.25:1, both
     under AA. This veil keeps a darkness FLOOR across the whole hero, so every layer beneath it
     is legible-safe rather than legible-by-luck. Re-measured after the change in the report. */
  .hero47::after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
    background:
      linear-gradient(100deg,rgba(9,14,26,.94) 0%,rgba(9,14,26,.91) 42%,rgba(9,14,26,.66) 72%,rgba(9,14,26,.52) 100%),
      linear-gradient(180deg,rgba(9,14,26,.34) 0%,rgba(9,14,26,.20) 45%,rgba(9,14,26,.82) 100%)}
  /* U55: the footage moved OUT of the hero and became the page background (#u55bg below), so
     the hero no longer carries its own <video>/poster - one file, one decode, for the whole page.
     The canvas curve stays here; the hero is simply the band where the background reads loudest.
     Still absolutely positioned => zero layout contribution => CLS unchanged. */
  .hero47 .hcurve{position:absolute;inset:0;width:100%;height:100%;
    z-index:0;pointer-events:none;border:0;opacity:.92}
  /* the season/game chip that names the curve's source game */
  .hero47 .hcchip{position:absolute;right:12px;bottom:10px;z-index:1;
    font-family:"IBM Plex Mono",monospace;font-size:8px;font-weight:600;letter-spacing:.11em;
    text-transform:uppercase;color:var(--text2);background:rgba(11,17,32,.55);
    border:1px solid var(--line);border-radius:999px;padding:3px 8px;pointer-events:none}
  .hero47 > *{position:relative;z-index:1}
  .hero47 h1{font-family:var(--display);font-weight:800;font-size:32px;line-height:.94;
    letter-spacing:-.02em;color:var(--textw);margin:10px 0 0;text-transform:uppercase}
  .hero47 h1 .l2{display:block;color:var(--model);font-style:italic}
  .hero47 .hsub{color:var(--text2);font-size:12.5px;line-height:1.5;margin:9px 0 0;max-width:34em}
  .heropill{display:inline-flex;align-items:center;gap:6px;font-family:"IBM Plex Mono",monospace;
    font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--text2);
    border:1px solid var(--line2);border-radius:999px;padding:4px 10px;background:rgba(11,17,32,.5)}
  .heropill::before{content:"";width:5px;height:5px;border-radius:999px;background:var(--model);
    animation:hmPulse 2.4s infinite}
  .herolive{display:flex;align-items:center;gap:8px;margin-top:13px;padding:10px 12px;cursor:pointer;
    background:rgba(11,17,32,.55);border:1px solid var(--line2);border-radius:12px;min-height:44px}
  .herolive .hl-k{font-family:"IBM Plex Mono",monospace;font-size:8.5px;font-weight:600;
    letter-spacing:.14em;text-transform:uppercase;color:var(--text3);flex:none}
  .herolive .hl-v{flex:1;min-width:0;font-size:12.5px;font-weight:600;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .herocta{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  .herocta button{flex:1 1 46%;min-height:44px;border-radius:999px;cursor:pointer;
    font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:13px;letter-spacing:.04em;
    text-transform:uppercase;display:inline-flex;align-items:center;justify-content:center;gap:6px}
  .herocta .cta-a{background:var(--user);color:#10130c;border:0}
  .herocta .cta-b{background:transparent;color:var(--text);border:1px solid var(--line2)}
  .herocta .ic{width:13px;height:13px}

  /* ---- Band 2: the proof row. Hairline-split cells, each one a link to its receipt. */
  .proofrow{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:4px}
  .proofcell{padding:12px 10px;cursor:pointer;border-top:1px solid var(--line);min-height:44px}
  .proofcell:nth-child(2n){border-left:1px solid var(--line)}
  .proofcell .pv{font-family:var(--display);font-weight:800;font-size:23px;line-height:1;
    letter-spacing:-.02em;color:var(--textw)}
  .proofcell .pv.model{color:var(--model)}
  .proofcell .pk{font-family:"IBM Plex Mono",monospace;font-size:9px;font-weight:600;
    letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-top:5px;line-height:1.4}
  .proofcell .pk .ic{width:9px;height:9px;opacity:.7;vertical-align:-1px}
  .proofcell:hover .pk{color:var(--text2)}

  /* ---- Band 4: the flagship ratings card + twin mini-boards ---- */
  .flagcard{background:linear-gradient(160deg,#0E1A16,#111a2c 60%);border:1px solid rgba(53,217,196,.22);
    border-radius:var(--r-panel);padding:14px;margin-top:4px;box-shadow:var(--sh-card)}
  .flagcard .fcdesc{color:var(--text2);font-size:12px;line-height:1.5;margin:6px 0 10px}
  .twinboards{display:grid;grid-template-columns:1fr;gap:10px}
  @media (min-width:430px){ .twinboards{grid-template-columns:1fr 1fr} }
  .mboard{background:rgba(11,17,32,.45);border:1px solid var(--line);border-radius:13px;padding:10px}
  .mbhead{display:flex;align-items:baseline;gap:6px;margin-bottom:6px}
  .mbhead .mbt{font-family:"IBM Plex Mono",monospace;font-size:9px;font-weight:600;
    letter-spacing:.13em;text-transform:uppercase;color:var(--text3);flex:1}
  .mbrow{display:flex;align-items:center;gap:8px;padding:6px 0;cursor:pointer;min-height:34px;
    border-top:1px solid var(--line)}
  .mbrow:first-of-type{border-top:0}
  .mbrow .mbr{font-family:"IBM Plex Mono",monospace;font-weight:700;font-size:11px;
    color:var(--text3);width:15px;flex:none;text-align:right}
  .mbrow .mbn{flex:1;min-width:0;font-size:12.5px;font-weight:600;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mbrow .mbv{font-family:"IBM Plex Mono",monospace;font-weight:700;font-size:12px;flex:none}
  .mbrow .mbv.model{color:var(--model)} .mbrow .mbv.stat{color:var(--stat)}
  .mbbar{height:3px;border-radius:2px;margin-top:3px;opacity:.85}

  /* ---- Band 8: the team chip cloud ---- */
  .chipcloud{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
  .teamchip{display:inline-flex;align-items:center;gap:7px;padding:6px 11px 6px 6px;min-height:44px;
    background:var(--surface);border:1px solid var(--line);border-radius:999px;cursor:pointer;
    font-size:12.5px;font-weight:600;white-space:nowrap}
  .teamchip:hover{border-color:var(--user)}
  .teamchip.fav{border-color:var(--user)}
  .teamchip .tcc{width:22px;height:22px;border-radius:7px;flex:none;display:grid;place-items:center;
    font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:8px;letter-spacing:.2px;
    border:1px solid rgba(255,255,255,.14)}

  /* ---- Band 3 rail: Today / Film Room ---- */
  .todayrail{display:flex;gap:9px;overflow-x:auto;scrollbar-width:none;padding:2px 0 8px;
    -webkit-overflow-scrolling:touch}
  .todayrail::-webkit-scrollbar{display:none}
  .tcard{flex:0 0 auto;width:232px;background:var(--surface);border:1px solid var(--line);
    border-radius:14px;padding:11px 12px;cursor:pointer;min-height:44px}
  .tcard:hover{border-color:var(--line2)}
  .tcard .tct{font-size:13px;font-weight:700;line-height:1.32;margin-top:6px}
  .tcard .tcm{font-size:10.5px;color:var(--text2);margin-top:5px;line-height:1.4}
  .tagchip{display:inline-flex;align-items:center;font-family:"IBM Plex Mono",monospace;
    font-size:8.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
    border-radius:999px;padding:2px 7px;border:1px solid var(--line2);color:var(--text3)}
  .tagchip.game{color:var(--model);border-color:rgba(49,224,200,.35)}
  .tagchip.film{color:var(--user);border-color:rgba(255,190,61,.35)}

  /* ---- Band 9: notifications / briefing ---- */
  .briefband{position:relative;overflow:hidden;border-radius:16px;padding:16px 14px;margin-top:4px;
    /* U56: the one-off gradient (#101a2e->#0c1322) became the --trt-chalk token */
    background:var(--trt-chalk);border:1px solid var(--line)}
  .briefband .ghostwm{right:-8px;bottom:-16px;font-size:64px;line-height:1;opacity:1}
  .briefband > *{position:relative;z-index:1}
  /* ══════════════════════════ end U47 bands ══════════════════════════ */

  /* ══════════════ U55 — FULL-PAGE VIDEO BACKGROUND ══════════════
     ONE encoded file (four scenes already crossfaded, media/LICENSE.md) mounted once behind the
     whole home page. position:fixed so it stays put while the page scrolls over it.

     READABILITY IS THE RISK - it is what U48's AA bug was. The rule here: copy never sits directly
     on moving footage. Every band that carries text gets its own near-opaque scrim, and the video
     is allowed to read at the band EDGES and through the hero, between the cards rather than under
     the paragraphs. Measured contrast per band on the loop's BRIGHTEST frame is in the report. */
  #u55bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
    /* U56: the layer is now the app-wide backdrop stage — it paints the active
       section treatment (was a flat #0b1120 before treatments existed) */
    background:var(--u56-trt,var(--trt-base))}
  #u55bg .u55m{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    opacity:.52;border:0}
  #u55bg .u55v{opacity:0;transition:opacity 1.1s ease}
  #u55bg .u55v.on{opacity:.52}
  /* global veil over the footage: a floor of darkness everywhere plus extra weight low down,
     so even a fully transparent band edge never exposes raw bright footage under text */
  #u55bg::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(9,14,26,.58) 0%,rgba(9,14,26,.50) 42%,rgba(9,14,26,.78) 100%)}
  /* the app column sits above the background; the shell must not paint over it */
  .wrap{background:transparent!important}
  body.u55-on .wrap::before{opacity:.55}
  #app{position:relative;z-index:1}
  header{background:rgba(11,17,32,.94)!important}

  /* ---- per-band scrims. Near-opaque through the middle (where the text lives), softer at the
     top and bottom edges so the footage breathes BETWEEN bands rather than under copy. ---- */
  /* the EDGE alpha is not a taste decision: it is the softest point of the scrim, so it sets the
     worst case for the smallest text tier. Measured on the loop's brightest frame, .55 put
     --text3 at 4.07:1; these values are the lowest that keep every tier at AA. */
  /* U56: the measured gradients moved verbatim into --scrim-band/--scrim-raised so the
     band treatments can compose with them — values unchanged, one source of truth */
  body.u55-on .band{background:var(--scrim-band)}
  body.u55-on .band.raised{background:var(--scrim-raised)}
  /* the hero band is the one place the footage is meant to be seen: no band scrim, the hero's own
     directional veil (U48) does the contrast work and is measured with the rest */
  body.u55-on .band:first-child{background:none}
  /* the closing note + the app-level surfaces keep their own solid backgrounds */
  body.u55-on .note{background:rgba(11,17,32,.93)}
  /* cards inside bands already carry their own gradient fill from U46; make them fully opaque so
     no paragraph is ever composited against moving video */
  body.u55-on .sec,body.u55-on .card,body.u55-on .lbcard,body.u55-on .scgame,
  body.u55-on .recordcard,body.u55-on .xcard,body.u55-on .flagcard,body.u55-on .mboard,
  body.u55-on .tcard,body.u55-on .briefband,body.u55-on .teamchip,body.u55-on .newsline{
    background-color:#111a2c}
  body.u55-on .flagcard{background:linear-gradient(160deg,#0E1A16,#111a2c 60%)}
  body.u55-on .newsline{background:transparent}

  /* ══════════════ U56 — DYNAMIC BACKGROUNDS (treatment token layer) ══════════════
     Owner: "adjust our background colors throughout the app so that it is dynamic."
     EXACTLY FOUR background treatments, defined here and nowhere else — no band or
     section may invent its own background hex (the U46 token discipline, extended):
       --trt-base   neutral navy wash — Home (under the U55 footage), Explore, team pages
       --trt-chalk  raised neutral — Games section; also band 9 (briefing), whose former
                    one-off gradient (#101a2e -> #0c1322) BECAME this token
       --trt-model  teal-cast navy — Stats section + the model-voiced home bands
                    (U49: teal = the Model speaks)
       --trt-user   amber-cast navy — Picks section + the you/your-team home bands
                    (U49: amber = the human side)
     Every token is declared in a DARK/LIGHT PAIR (the light values live in the
     [data-theme="light"] block below) so U54 flips one attribute instead of migrating.
     Team pages tint --trt-base with a luminance-CLAMPED team color (JS side) — a
     modifier on the base treatment, not a fifth treatment.
     Retained on purpose (documented in briefs/audit-U56-backgrounds.md): the hero's
     own stage radial (a U48-measured video substrate) and card FILLS like .flagcard
     (surfaces, not backgrounds — they stay on --surface/U46 tokens). */
  :root{
    --trt-base:radial-gradient(120% 62% at 50% -8%,#16203A 0%,#0B1120 46%,#080C16 100%);
    --trt-chalk:linear-gradient(170deg,#101A2E 0%,#0C1322 62%,#0A0F1C 100%);
    --trt-model:radial-gradient(120% 62% at 50% -8%,#0F2A31 0%,#0B1826 46%,#08111A 100%);
    --trt-user:radial-gradient(120% 62% at 50% -8%,#271F12 0%,#12131F 46%,#0A0D16 100%);
    /* the U55 band scrims, tokenized so band treatments can COMPOSE with them
       instead of copying the gradient (one source of truth for the measured alphas) */
    --scrim-band:linear-gradient(180deg,
      rgba(11,17,32,.80) 0%, rgba(11,17,32,.94) 14%,
      rgba(11,17,32,.94) 86%, rgba(11,17,32,.80) 100%);
    --scrim-raised:linear-gradient(180deg,
      rgba(14,22,38,.84) 0%, rgba(14,22,38,.96) 14%,
      rgba(14,22,38,.96) 86%, rgba(14,22,38,.84) 100%);
    /* band tint caps: a thin accent cast at the band's TOP edge only, dead by 38% —
       the copy zone (14%-86%, where the scrim is near-opaque) stays effectively
       untouched. .045 is the highest alpha that keeps --text3 at AA (4.56:1 worst)
       for an eyebrow 18px into the SHORTEST band over a pure-white frame — the
       full table is in briefs/audit-U56-backgrounds.md */
    --tintcap-model:linear-gradient(180deg,rgba(49,224,200,.045) 0%,rgba(49,224,200,0) 38%);
    --tintcap-user:linear-gradient(180deg,rgba(255,190,61,.045) 0%,rgba(255,190,61,0) 38%);
  }
  /* the LIGHT half of every pair — INERT until U54 sets data-theme="light" on <html>.
     U54 owns the light-side contrast pass (no user can reach these today); the pairs
     exist now so U54 is an attribute flip + audit, not a second migration. */
  :root[data-theme="light"]{
    --trt-base:radial-gradient(120% 62% at 50% -8%,#FFFFFF 0%,#EEF2F8 46%,#E4EAF3 100%);
    --trt-chalk:linear-gradient(170deg,#F4F7FB 0%,#E9EEF6 62%,#E2E8F1 100%);
    --trt-model:radial-gradient(120% 62% at 50% -8%,#E4F6F2 0%,#EAF1F6 46%,#E2E9F1 100%);
    --trt-user:radial-gradient(120% 62% at 50% -8%,#FBF3E2 0%,#F1EFEA 46%,#E8EAF0 100%);
    --scrim-band:linear-gradient(180deg,
      rgba(244,247,251,.80) 0%, rgba(244,247,251,.94) 14%,
      rgba(244,247,251,.94) 86%, rgba(244,247,251,.80) 100%);
    --scrim-raised:linear-gradient(180deg,
      rgba(233,238,246,.84) 0%, rgba(233,238,246,.96) 14%,
      rgba(233,238,246,.96) 86%, rgba(233,238,246,.84) 100%);
    --tintcap-model:linear-gradient(180deg,rgba(15,142,126,.08) 0%,rgba(15,142,126,0) 38%);
    --tintcap-user:linear-gradient(180deg,rgba(196,138,20,.08) 0%,rgba(196,138,20,0) 38%);
  }

  /* ---- section -> treatment. syncTabbar stamps data-hmsec (the U38 section) and
     data-hmview on <body>; the fixed backdrop (#u55bg) inherits the var and paints it.
     Home + Explore stay on base; the team tint below overrides within any section. */
  body{background:var(--u56-trt,var(--trt-base))}
  body[data-hmsec="games"]{--u56-trt:var(--trt-chalk)}
  body[data-hmsec="stats"]{--u56-trt:var(--trt-model)}
  body[data-hmsec="picks"]{--u56-trt:var(--trt-user)}
  /* team pages: the base treatment plus a clamped team-color glow from the top.
     --u56-team-rgb is set by u56TeamTint() AFTER the luminance clamp — raw team hexes
     never reach a surface (a near-black or near-white primary would otherwise vanish
     or wash the page). */
  body[data-hmteam]{--u56-trt:
    radial-gradient(130% 46% at 50% -6%,rgba(var(--u56-team-rgb),.12),rgba(var(--u56-team-rgb),0) 62%),
    var(--trt-base)}
  /* the media (poster/video) reads on home only — other sections show their treatment
     on the same fixed stage. Opacity-only => zero layout, zero CLS. */
  body:not([data-hmview="home"]):not([data-hmview="landing"]) #u55bg .u55m{opacity:0!important}
  body:not([data-hmview="home"]):not([data-hmview="landing"]) #u55bg::after{opacity:0}
  /* ghost school-NAME watermark (text, ours — never a logo) on the team backdrop */
  #u56wm{position:absolute;left:50%;bottom:5vh;transform:translateX(-50%);z-index:0;
    pointer-events:none;user-select:none;white-space:nowrap;
    font-family:var(--display);font-weight:800;text-transform:uppercase;
    letter-spacing:-.04em;line-height:.9;font-size:clamp(64px,17vw,150px);
    color:rgba(var(--u56-team-rgb,242,239,231),.07)}

  /* ---- per-BAND treatments on home: the model/user-voiced bands wear their accent
     as a top-edge cap composed OVER the measured U55 scrims (one token each side). */
  body.u55-on .band.trt-model{background:var(--tintcap-model),var(--scrim-band)}
  body.u55-on .band.raised.trt-model{background:var(--tintcap-model),var(--scrim-raised)}
  body.u55-on .band.trt-user{background:var(--tintcap-user),var(--scrim-band)}
  body.u55-on .band.raised.trt-user{background:var(--tintcap-user),var(--scrim-raised)}
  /* defensive no-video fallback (mountPageBackground failed => no .u55-on): the caps
     still render over the band's own base so the bands stay authored, not flat */
  body:not(.u55-on) .band.trt-model{background:var(--tintcap-model)}
  body:not(.u55-on) .band.raised.trt-model{background:var(--tintcap-model),var(--band)}
  body:not(.u55-on) .band.trt-user{background:var(--tintcap-user)}
  body:not(.u55-on) .band.raised.trt-user{background:var(--tintcap-user),var(--band)}
  /* ══════════════════════════ end U56 ══════════════════════════ */

  /* ══════════════ U50 — 2026 KICKOFF COUNTDOWN ══════════════
     Fan surface -> AMBER per U49 (a countdown is emotional territory, not Model output).
     The digits are IBM Plex Mono with tabular-nums inside FIXED-WIDTH cells (2ch, 3ch for
     days), so a tick can only repaint glyphs — it can never move a box. CLS 0 by
     construction, measured anyway in the verify. */
  .kcgrid{display:flex;gap:8px;margin:10px 0 2px}
  .kcell{flex:0 0 auto;min-width:62px;text-align:center;background:var(--surface);
    border:1px solid rgba(255,190,61,.30);border-radius:12px;padding:10px 9px 8px}
  .kcell .kv{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;
    font-weight:700;font-size:25px;line-height:1;color:var(--user);
    display:inline-block;width:2ch}
  .kcell.days .kv{width:3ch}
  .kcell .kk{font-family:"IBM Plex Mono",monospace;font-size:8.5px;font-weight:600;
    letter-spacing:.14em;text-transform:uppercase;color:var(--text3);margin-top:6px}
  /* ══════════════════════════ end U50 ══════════════════════════ */

  /* ══════════════ U51 — FAN POLLS ══════════════
     Crowd data -> AMBER per U49. Results render as bars only after the visitor's own
     vote (or when localStorage says they already voted). */
  .pollopt{display:flex;align-items:center;gap:9px;width:100%;min-height:44px;margin-top:8px;
    padding:10px 14px;background:var(--surface);border:1px solid var(--line2);border-radius:12px;
    color:var(--text);font-family:"Barlow",sans-serif;font-weight:600;font-size:13px;
    text-align:left;cursor:pointer}
  .pollopt:hover{border-color:var(--user)}
  .pollres{position:relative;margin-top:8px;min-height:38px;border-radius:10px;overflow:hidden;
    background:var(--surface);border:1px solid var(--line)}
  .pollres i{position:absolute;inset:0 auto 0 0;background:var(--user-tint);border-right:2px solid rgba(255,190,61,.45)}
  .pollres.mine i{background:rgba(255,190,61,.22)}
  .pollres .pl{position:relative;display:flex;align-items:center;gap:8px;padding:9px 12px;
    font-size:12.5px;font-weight:600}
  .pollres .pl b{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--user)}
  .pollres.mine .pl::after{content:"YOUR VOTE";font-family:"IBM Plex Mono",monospace;font-size:7.5px;
    font-weight:700;letter-spacing:.12em;color:var(--user);border:1px solid rgba(255,190,61,.4);
    border-radius:999px;padding:2px 6px;flex:none}
  /* ══════════════════════════ end U51 ══════════════════════════ */
  /* ══════ watchdog hardening: the LOOP DEAD banner (admin surfaces only) ══════ */
  .loopdead{background:linear-gradient(160deg,rgba(224,91,91,.16),rgba(224,91,91,.06));
    border:1.5px solid var(--loss);border-radius:14px;padding:13px 15px;margin:6px 2px 12px}
  .loopdead .ldt{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.01em;
    color:#FF9B9B;text-transform:uppercase}
  .loopdead .ldw{font-size:12px;line-height:1.5;color:var(--text);margin-top:5px}
  .loopdead.compact{margin:0 2px 10px}
  .loopdead.compact .ldt{font-size:16px}

  /* ══════════════════════════ end U55 background ══════════════════════════ */

  /* ══════════════ U54 — LIGHT MODE ══════════════
     A second value set for the SAME token system (U46/U49/U56) — dark values are
     untouched, light adjusts only its own ramps. U56 already paired every background
     TREATMENT; this block pairs the base tokens and the handful of component surfaces
     that hardcoded dark washes before the token era.
     !! U49 CONTRACT IN LIGHT: bright amber/teal are ~1.6:1 on white, so the LIGHT
     accent ramps are dark ambers/teals — hue identity + mutual distinguishability
     kept, AA re-measured per theme (table in the report). Fills that carry dark text
     (CTAs, active toggles) keep bright amber via explicit overrides below.
     DELIBERATE DARK ISLANDS (self-contained, same look in both themes, documented):
     the U48/U55 hero video stage (footage + measured veils — it re-pins the dark
     text vars for its own subtree), gauntlet heat cells (always-dark backgrounds get
     explicit light text), crest tiles (true team colors), share-card canvases
     (exported images must not depend on the viewer's theme), and the modal dimmer. */
  :root[data-theme="light"]{
    --bg:#EDF1F7; --surface:#FFFFFF; --surface2:#E7EDF6;
    --line:rgba(16,24,40,.12); --line2:rgba(16,24,40,.20); --tabbar:#FFFFFF;
    --text:#111827; --text2:#3E4E66; --text3:#54657E; --legal:#5E7089;
    --textw:#16202E;
    --amber:#8A5B06; --amber-tint:rgba(138,91,6,.10);
    --teal:#0B6E60; --teal-tint:rgba(11,110,96,.10);
    --model-strong:#075A50;
    --live:#BB2727; --loss:#B23A2E; --warn:#7d5A0A;
    --band:#E7EDF5;
    --veil:linear-gradient(180deg,rgba(244,247,251,0) 0%,rgba(244,247,251,.55) 62%,rgba(244,247,251,.92) 100%);
    --tex-yard:repeating-linear-gradient(90deg,rgba(16,24,40,.035) 0 1px,transparent 1px 40px);
    --tex-hash:repeating-linear-gradient(90deg,transparent 0 18px,rgba(16,24,40,.026) 18px 19px,transparent 19px 40px);
    --sh-card:0 6px 22px rgba(15,23,42,.10); --sh-pop:0 12px 30px rgba(15,23,42,.18);
    --card-fill:linear-gradient(165deg,#FFFFFF,#F3F6FB);
    --card-fill-amber:linear-gradient(160deg,#FBEFD8,#FFFFFF 60%);
  }
  /* active pills/tabs keep the BRIGHT amber fill (their dark text needs it); the
     dark-amber light ramp is for text/border accents only */
  :root[data-theme="light"] .bub.on,
  :root[data-theme="light"] .confpill.on{background:#FFBE3D;border-color:#E8A82A}
  :root[data-theme="light"] #statsfab,
  :root[data-theme="light"] #simfab{background:#FFBE3D}
  :root[data-theme="light"] .lbtoggle button.on{background:#FFBE3D;border-color:#E8A82A}
  :root[data-theme="light"] .navbtn.primary{background:linear-gradient(180deg,#FFFFFF,#EDF2F9);border-color:#C4D0E0}
  /* the two sticky page headers hardcoded the dark blur pre-tokens */
  :root[data-theme="light"] .dtop,
  :root[data-theme="light"] .cmptop{background:rgba(244,247,251,.92)}
  /* component surfaces that hardcoded dark washes pre-tokens */
  :root[data-theme="light"] header{background:rgba(244,247,251,.94)!important}
  :root[data-theme="light"] .wrap::before{opacity:.8}
  :root[data-theme="light"] .heropill,
  :root[data-theme="light"] .herolive,
  :root[data-theme="light"] .hero47 .hcchip{background:rgba(255,255,255,.72)}
  :root[data-theme="light"] .mboard{background:rgba(255,255,255,.65)}
  :root[data-theme="light"] .note{background:var(--surface2)}
  :root[data-theme="light"] .flagcard{background:linear-gradient(160deg,#E9F4F0,#FFFFFF 60%);border-color:rgba(11,110,96,.25)}
  :root[data-theme="light"] .briefband{background:var(--trt-chalk)}
  /* accent FILLS keep bright amber (their text is dark by design — AA holds on the
     bright fill, and a dark-amber fill would break it) */
  :root[data-theme="light"] .herocta .cta-a{background:#FFBE3D}
  :root[data-theme="light"] .pollres i{background:rgba(138,91,6,.14);border-right-color:rgba(138,91,6,.45)}
  /* dark islands: the hero stage keeps its footage look — re-pin its subtree vars */
  :root[data-theme="light"] .hero47{
    --textw:#F2EFE7; --text2:#93A5C0; --text3:#8496B5;
    --line2:rgba(255,255,255,.16)}
  :root[data-theme="light"] .hero47 .heropill,
  :root[data-theme="light"] .hero47 .herolive{background:rgba(11,17,32,.55)}
  :root[data-theme="light"] .gcell{color:#EAF0FB}
  :root[data-theme="light"] .gcell .gwk{color:#B9C6DE}
  /* home band scrims over the footage: dark text needs the light scrim pairs (U56)
     — nothing to declare here, the tokens flip with the theme. The U55 media veil
     stays dark (it sits UNDER the scrims and over dark footage in both themes). */
  /* pre-token hardcoded surfaces, light counterparts */
  :root[data-theme="light"] .tabbar{background:linear-gradient(180deg,rgba(244,247,251,0) 0%,#F4F7FB 26%)}
  :root[data-theme="light"] .tabbar button.on{background:#FFBE3D}   /* bright fill keeps its dark text AA */
  :root[data-theme="light"] .card-hero-amber{background:linear-gradient(160deg,#FBEFD8,#FFFFFF 55%);border-color:rgba(138,91,6,.30);box-shadow:0 0 0 1px rgba(11,110,96,.12), 0 14px 40px rgba(15,23,42,.10)}
  :root[data-theme="light"] .card-hero-teal{background:linear-gradient(160deg,#E7F4F0,#FFFFFF 55%);border-color:rgba(11,110,96,.30)}
  /* the U55 opaque-card set: those rules hardcode the dark card fill so paragraphs
     never composite on footage — same guarantee, light fill */
  :root[data-theme="light"] body.u55-on .sec,:root[data-theme="light"] body.u55-on .card,
  :root[data-theme="light"] body.u55-on .lbcard,:root[data-theme="light"] body.u55-on .scgame,
  :root[data-theme="light"] body.u55-on .recordcard,:root[data-theme="light"] body.u55-on .xcard,
  :root[data-theme="light"] body.u55-on .mboard,:root[data-theme="light"] body.u55-on .tcard,
  :root[data-theme="light"] body.u55-on .teamchip{background-color:#FFFFFF}
  :root[data-theme="light"] body.u55-on .flagcard{background:linear-gradient(160deg,#E9F4F0,#FFFFFF 60%)}
  :root[data-theme="light"] body.u55-on .briefband{background:var(--trt-chalk)}
  :root[data-theme="light"] body.u55-on .note{background:var(--surface2)}
  :root[data-theme="light"] body.u55-on .newsline{background:transparent}
  /* ══════════════════════════ end U54 ══════════════════════════ */
</style>
</head>

async function authAction(kind){
  if(!sb) return;
  const email=(document.getElementById("authemail")||{}).value, pw=(document.getElementById("authpw")||{}).value;
  try{
    if(kind==="google"){ const {error}=await sb.auth.signInWithOAuth({provider:"google", options:{redirectTo:getRedirectTarget(), ...captchaOpts()}});
      if(error) authMsg(/provider|not enabled|unsupported/i.test(error.message)?"Google sign-in isn't enabled yet — use email below.":error.message); return; }
    // E1: email OTP CODES, never links — immune to SafeLinks prefetch, cross-device PKCE
    // breaks, and Capacitor webviews. sendcode = sign-IN only (shouldCreateUser:false);
    // signupcode = the explicit account-creation path.
    if(kind==="sendcode"||kind==="signupcode"){
      if(!email) return authMsg("Enter your email first.");
      const {error}=await sb.auth.signInWithOtp({email,
        options:{shouldCreateUser:kind==="signupcode", ...captchaOpts()}});
      resetTurnstile();   // token consumed — mint a fresh one for verify/resend
      if(error) return authMsg(/captcha/i.test(error.message)
        ?"Please complete the security check below, then try again."
        :/signups not allowed|user not found/i.test(error.message)
        ?"No account with that email yet — tap “Create account” instead."
        :(error.status>=500||!error.message||error.message==="{}")   // 5xx bodies stringify to "{}"
        ?"We couldn't send the email right now — please try again in a minute.":error.message);
      const st=document.getElementById("otpstep"); if(st) st.style.display="block";
      const sb2=document.getElementById("sendcodebtn"); if(sb2) sb2.textContent="Resend code";
      authMsg("We emailed you a 6-digit code — enter it above.", true); return; }
    if(kind==="verifycode"){
      const code=((document.getElementById("authcode")||{}).value||"").trim();
      if(!email||code.length!==6) return authMsg("Enter your email and the 6-digit code.");
      const {error}=await sb.auth.verifyOtp({email, token:code, type:"email", options:{...captchaOpts()}});
      resetTurnstile();
      if(error) return authMsg(/expired|invalid/i.test(error.message)
        ?"That code didn't match or expired — send a fresh one.":error.message);
      closeAuth(); return; }
    if(kind==="pwtoggle"){ const p=document.getElementById("pwstep");
      if(p) p.style.display = p.style.display==="none"?"block":"none"; return; }
    if(kind==="password"){ if(!email||!pw) return authMsg("Enter your email and password.");
      const {error}=await sb.auth.signInWithPassword({email,password:pw,options:{...captchaOpts()}});
      resetTurnstile(); if(error) return authMsg(error.message); closeAuth(); return; }
    if(kind==="reset"){ if(!email) return authMsg("Enter your email to reset your password.");
      const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:getRedirectTarget(), ...captchaOpts()});
      resetTurnstile();
      authMsg(error?error.message:"Password-reset email sent.", !error); return; }
    if(kind==="signout"){ await sb.auth.signOut(); closeAuth(); return; }
    if(kind==="favpick"){ closeAuth(); await ensureTeamMeta(); teamPicker(null, id=>setFavoriteTeam(id)); return; }
    if(kind==="notifyprefs"){ closeAuth(); openNotifyPrefs(); return; }
  }catch(e){ authMsg(e.message||"Something went wrong — try again."); }
}

    .concat(hasPost?[{key:"PS", label:"Bowls / CFP", f:g=>g.season_type==="postseason"}]:[]);
  if(!scoresWeek || !keys.find(k=>k.key===scoresWeek)){
    // land on the current/upcoming week once the season starts; Week 1 before kickoff
    const cutoff = Date.now() - 36*36e5;   // a game that kicked off <36h ago still counts as "this week"
    const upcoming = keys.find(k=>games.some(g=>k.f(g) && !g.completed && g.start_date && new Date(g.start_date).getTime()>=cutoff));
    scoresWeek = (upcoming || keys[0] || {}).key || null;
  }
  if(scoresSeason===SEASON_SCHED){
    try{
      const lw=await api(`signature_stats?select=team_id,drivers&stat_key=eq.lookahead_watch&order=rank.asc&limit=14`);
      const wkNum=Number(String(scoresWeek).replace("R",""));
      const here=lw.filter(r=>r.drivers&&Number(r.drivers.week)===wkNum);
      if(here.length){ await ensureTeamMeta();
        const names=here.slice(0,3).map(r=>(teamMeta[r.team_id]||{}).school).filter(Boolean).join(", ");
        lookStrip=`<div class="sec" data-go-sig="lookahead_watch" style="cursor:pointer;padding:10px 12px;margin:2px 2px 8px">
          <div class="sectitle" style="padding:0">Lookahead watch <small>· ${here.length} spot${here.length>1?"s":""} this week</small></div>
          <div class="secsub" style="padding:2px 0 0">${esc(names)} in classic sandwich spots — but top-10 teams still won about 91 of 100 of these (2014-2024). Watch, not bank.</div></div>`; }
    }catch(e){}
  }
  const active = keys.find(k=>k.key===scoresWeek);
  const list = (active?games.filter(active.f):[]).slice()
    .sort((a,b)=>(a.start_date||"").localeCompare(b.start_date||""));

  let h = `<div class="cmp">
    <div class="cmptop"><button class="back"><svg class="ic" aria-hidden="true"><use href="#i-chev-l"/></svg></button>
      <div class="wordmark" role="link" tabindex="0" aria-label="Home">Hashmark<span class="dot">.</span></div>
      <div class="cmptag">Scores</div></div>
    <div class="venue"><div class="toggle">
      <button data-ss="${SEASON_SCHED}" class="${scoresSeason===SEASON_SCHED?"on":""}">${SEASON_SCHED}<small>Schedule</small></button>
      <button data-ss="${SEASON_RESULTS}" class="${scoresSeason===SEASON_RESULTS?"on":""}">${SEASON_RESULTS}<small>Final scores</small></button>
    </div></div>
    <div class="list" style="padding-top:4px">
    <div class="confbar">`;
  keys.forEach(k=>{ h+=`<button class="confpill ${scoresWeek===k.key?"on":""}" data-wk="${k.key}">${k.label}</button>`; });
  h += `</div>${lookStrip}
    <div class="secsub" style="padding:0 2px 4px">${scoresSeason===SEASON_RESULTS
      ? "Official final scores — winner marked. Tap a team to open it."
      : "Official 2026 schedule — dates, kickoff times &amp; TV shown as they're announced. Tap a team to open it."}</div>`;
  list.forEach(g=>h+=scGameRow(g));
  if(!list.length) h+=`<div class="loading" style="padding:30px">No games.</div>`;
  const hasMkt = scoresSeason===SEASON_SCHED && list.some(g=>!g.completed && marketMap && marketMap[g.id]);
  h += `<div class="note"><b>Official ${scoresSeason} ${scoresSeason===SEASON_RESULTS?"results":"schedule"}.</b> Source: CFBD game data. ${hasMkt?MKT_NOTE+" ":""}${BRAND_LINE}</div></div></div>`;
  app.innerHTML = h;
  document.querySelector(".back").onclick=navBack;
  document.querySelectorAll("[data-ss]").forEach(b=>b.onclick=()=>{ const s=+b.dataset.ss;
    if(s!==scoresSeason){ scoresSeason=s; scoresWeek=null; drawScores(); window.scrollTo(0,0); } });
  document.querySelectorAll("[data-wk]").forEach(b=>b.onclick=()=>{ if(b.dataset.wk!==scoresWeek){
    scoresWeek=b.dataset.wk; drawScores(); window.scrollTo(0,0); } });
  const ls=document.querySelector("[data-go-sig]");
  if(ls) ls.onclick=()=>openSignatureBoard(ls.dataset.goSig);
}

function probitApprox(p){   // Acklam inverse-normal (display-only margin mapping)
  p=Math.min(0.999,Math.max(0.001,Number(p)));
  const a=[-39.69683028665376,220.9460984245205,-275.9285104469687,138.357751867269,-30.66479806614716,2.506628277459239],
        b=[-54.47609879822406,161.5858368580409,-155.6989798598866,66.80131188771972,-13.28068155288572],
        c=[-0.007784894002430293,-0.3223964580411365,-2.400758277161838,-2.549732539343734,4.374664141464968,2.938163982698783],
        d=[0.007784695709041462,0.3224671290700398,2.445134137142996,3.754408661907416];
  const pl=0.02425;
  let q,r;
  if(p<pl){ q=Math.sqrt(-2*Math.log(p));
    return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1); }
  if(p<=1-pl){ q=p-0.5; r=q*q;
    return (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1); }
  q=Math.sqrt(-2*Math.log(1-p));
  return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);
}

    const rat=(ratings&&ratings[id]!=null)?`<span class="favtag" style="background:var(--model-tint);color:var(--model)" data-tip="Hashmark power-rating rank (preseason board)">HASHMARK #${ratings[id]}</span>`:"";

async function openGame(gameId){

function wpSparkline(series, color){
  const W=340,H=120,P=8, n=series.length;
  if(n<2) return "";
  const X=i=>P+(i/(n-1))*(W-2*P), Y=v=>H-P-(v*(H-2*P));
  let path="", dark=false;
  series.forEach((r,i)=>{ if(r.home_wp==null){ dark=true; return; }
    path+=(path?" L":"M")+X(i).toFixed(1)+" "+Y(Number(r.home_wp)).toFixed(1); });
  return `<svg class="quad" viewBox="0 0 ${W} ${H}" style="max-height:130px">
    <line x1="${P}" y1="${Y(0.5)}" x2="${W-P}" y2="${Y(0.5)}" stroke="var(--line2)" stroke-dasharray="3 3"/>
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2.2"/>
    ${dark?`<text x="${W-P}" y="12" text-anchor="end" fill="var(--text3)" font-size="8">OT: probability dark (calibration gate)</text>`:""}
  </svg>`;
}

// Table stakes come from the same ESPN-sourced feed everyone has — the differentiation is
