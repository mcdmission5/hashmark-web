async function pkgRenderPicks(host){
  const g=pkg.g, wk=pkg.week;
  if(wk==null){ host.innerHTML=`<div class="secsub">No slate yet — the weekly slate seeds from the Model's board when it publishes.</div>`; return; }
  const rows=pkg.sl.filter(r=>r.week===wk).map(r=>pkg.games[r.game_id]).filter(Boolean)
    .sort((a,b)=>(a.start_date||"").localeCompare(b.start_date||""));
  const N=rows.length;
  // my picks + the Model's revealed picks + post-lock group distribution
  pkg.mine={}; pkg.model={}; let allPicks=[];
  if(authUser){
    const r=await authFetch("GET", `pickem_group_picks?select=game_id,user_id,pick_team,confidence&group_id=eq.${pkg.gid}&season=eq.${pk.season}&week=eq.${wk}`);
    allPicks=r.data||[];
    allPicks.forEach(p=>{ if(p.user_id===authUser.id) pkg.mine[p.game_id]={pick_team:p.pick_team, confidence:p.confidence}; });
  }
  if(g.model_plays){
    if(g.is_system){
      try{ (await pkAnonRpc("pickem_model_reveal",{p_season:pk.season, p_week:wk})).forEach(r=>{
        if(r.model_pick_team) pkg.model[r.game_id]={pick_team:r.model_pick_team, confidence:r.model_conf}; }); }catch(_e){}
    } else {
      allPicks.forEach(p=>{ if(p.user_id===MODEL_UID) pkg.model[p.game_id]={pick_team:p.pick_team, confidence:p.confidence}; });
    }
  }
  // post-lock pick distribution: National = server crowd %, custom = visible locked picks
  pkg.dist={};
  if(g.is_system){
    try{ (await api(`pickem_slate_games?select=game_id,crowd_home_pct&season=eq.${pk.season}&week=eq.${wk}`))
      .forEach(r=>{ if(r.crowd_home_pct!=null) pkg.dist[r.game_id]={homePct:Math.round(r.crowd_home_pct)}; }); }catch(_e){}
  } else {
    const byGame={};
    allPicks.filter(p=>p.user_id!==MODEL_UID).forEach(p=>{ (byGame[p.game_id]=byGame[p.game_id]||[]).push(p); });
    Object.entries(byGame).forEach(([gid2,ps])=>{ const game=pkg.games[gid2];
      if(!game||!pkLockedIso(game.start_date)||ps.length<2) return;
      const hp=ps.filter(p=>p.pick_team===game.home_team_id).length;
      pkg.dist[gid2]={homePct:Math.round(100*hp/ps.length)}; });
  }
  pkg.tb=null; pkg.tbMine=null;
  if(g.is_system){
    try{ const trow=(await api(`pickem_slates?select=tiebreak_game_id&season=eq.${pk.season}&week=eq.${wk}&status=neq.draft`))[0];
      pkg.tb=trow&&trow.tiebreak_game_id;
      if(pkg.tb&&authUser){
        const r=await authFetch("GET", `pickem_tiebreaks?select=total_points_guess&season=eq.${pk.season}&week=eq.${wk}&user_id=eq.${authUser.id}`);
        pkg.tbMine=r.data&&r.data[0]&&r.data[0].total_points_guess; }
    }catch(_e){}
  }
  if(!pkg.stats) pkg.stats=await pkLoadStats(rows.map(r=>({home_team_id:r.home_team_id, away_team_id:r.away_team_id})));
  if(!pkg.ap){ pkg.ap={};
    try{ (await api(`poll_rankings?select=team_id,rank&season=eq.${pk.season}&poll=eq.AP%20Top%2025`)).forEach(r=>pkg.ap[r.team_id]=r.rank); }catch(_e){}
  }
  if(!pkg.rec){ pkg.rec={};
    try{ const gs=await fetchSeasonGames(SEASON_SCHED);
      gs.filter(x=>x.completed&&x.home_points!=null).forEach(x=>{
        const hw=x.home_points>x.away_points;
        [[x.home_team_id,hw],[x.away_team_id,!hw]].forEach(([id,won])=>{
          const r=pkg.rec[id]=pkg.rec[id]||{w:0,l:0}; if(won) r.w++; else r.l++; }); });
    }catch(_e){}
  }
  const usedConf=new Set(Object.entries(pkg.mine).map(([gid2,p])=>p.confidence).filter(Boolean));
  Object.entries(pkg.stage).forEach(([gid2,s])=>{ if(s.conf) usedConf.add(s.conf); });
  let h=pkgWeekBtns(wk);
  if(!authUser) h+=`<div class="sec"><div class="secsub">Viewing only — sign in to make picks.</div>
    <div class="navrow"><button class="navbtn primary" data-acct="signin">Sign in</button></div></div>`;
  else if(g.scoring_mode==="confidence")
    h+=`<div class="secsub" style="padding:0 2px 6px">Rank your confidence 1–${N} (${N} = most sure);
      each number once. Correct picks score their rank. Picks save instantly, per game.</div>`;
  else h+=`<div class="secsub" style="padding:0 2px 6px">Tap a team — every correct pick scores 1 point. Picks save instantly, per game.</div>`;
  rows.forEach(game=>{
    const locked=pkLockedIso(game.start_date);
    const mine=pkg.stage[game.id]||pkg.mine[game.id]||{};
    const myTeam=mine.pick_team||mine.team;
    const model=pkg.model[game.id];
    const dist=pkg.dist[game.id];
    const res = game.completed&&game.home_points!=null&&game.home_points!==game.away_points
      ? (game.home_points>game.away_points?game.home_team_id:game.away_team_id) : null;
    const chip=id=>{ const parts=[];
      if(pkg.ap[id]) parts.push(`#${pkg.ap[id]} AP`);
      const r=pkg.rec[id]; if(r&&(r.w||r.l)) parts.push(`${r.w}-${r.l}`);
      return parts.join(" · "); };
    const chipA=chip(game.away_team_id), chipH=chip(game.home_team_id);
    const myHit = res&&myTeam ? (myTeam===res?" · <b>you got it</b>":" · missed") : "";
    h+=`<div class="sec pkgame" style="padding:8px 10px;margin:6px 0">
      <div class="secsub" style="padding:0 0 6px">${new Date(game.start_date).toLocaleString([], {weekday:"short", month:"short", day:"numeric", hour:"numeric", minute:"2-digit"})}
        · ${locked?`<svg class="ic" aria-hidden="true"><use href="#i-lock"/></svg> locked`:`<span data-pkcd="${esc(game.start_date)}">${pkCdTxt(game.start_date)}</span>`}
        ${res?` · <b>${esc(res===game.home_team_id?game.home_team:game.away_team)} won</b>${myHit}`:""}
        ${dist?` · group: ${dist.homePct>=50?dist.homePct:100-dist.homePct}% ${esc(dist.homePct>=50?game.home_team:game.away_team)}`:""}</div>
      ${(chipA||chipH)?`<div class="pkchips"><span>${chipA||"&nbsp;"}</span><span>${chipH||"&nbsp;"}</span></div>`:""}
      <div class="navrow">
        <button class="navbtn ${myTeam===game.away_team_id?"primary":""}" data-pkgpick="${game.id}" data-pkteam="${game.away_team_id}" ${locked||!authUser?"disabled":""}>${esc(game.away_team)}</button>
        <span style="align-self:center;color:var(--text2)">${game.neutral_site?"vs":"@"}</span>
        <button class="navbtn ${myTeam===game.home_team_id?"primary":""}" data-pkgpick="${game.id}" data-pkteam="${game.home_team_id}" ${locked||!authUser?"disabled":""}>${esc(game.home_team)}</button>
        ${g.scoring_mode==="confidence"?`<div data-pkgconf="${game.id}"></div>`:""}</div>
      ${g.model_plays?(model
        ?`<div class="secsub" style="padding:4px 0 0"><span class="u-model"><svg class="ic" aria-hidden="true"><use href="#i-bot"/></svg> Model: ${esc(model.pick_team===game.home_team_id?game.home_team:game.away_team)}${model.confidence?` · #${model.confidence} confidence`:""}</span>${res?(model.pick_team===res?" · got it":" · missed"):""}</div>`
        :(locked?"":`<div class="secsub" style="padding:4px 0 0;color:var(--text3)">The Model's pick reveals at kickoff.</div>`)):""}
      ${g.is_system&&pkg.tb===game.id&&authUser?`<div class="navrow" style="padding-top:4px">
        <input class="authin" style="max-width:210px" id="tbguess" type="number" min="0" max="200"
          placeholder="Tiebreak: total points" value="${pkg.tbMine!=null?pkg.tbMine:""}" ${locked?"disabled":""}></div>`:""}
      <div class="authmsg" id="pkm-${game.id}"></div>
      <div class="pkcmprow">
        <button class="pkcmpbtn" data-pkcmp="${game.id}" aria-expanded="false"><svg class="ic" aria-hidden="true"><use href="#i-vs"/></svg> Compare teams <svg class="ic chev" aria-hidden="true"><use href="#i-chev-r"/></svg></button>
        <button class="pkcmpbtn" data-pkgp="${game.id}" aria-expanded="false"><svg class="ic" aria-hidden="true"><use href="#i-cal"/></svg> Game page <svg class="ic chev" aria-hidden="true"><use href="#i-chev-r"/></svg></button>
      </div>
      <div class="pkdrawer" id="pkdrawer-${game.id}" hidden></div>
      <div class="pkdrawer" id="pkgpdrawer-${game.id}" hidden></div>
    </div>`;
  });
  if(!rows.length) h+=`<div class="secsub">No games on this week's slate.</div>`;
  host.innerHTML=h;
  pkTickArm();
  host.querySelectorAll("[data-pkgpick]").forEach(b=>b.onclick=()=>{
    const gid2=Number(b.dataset.pkgpick);
    const st=pkg.stage[gid2]=pkg.stage[gid2]||{};
    st.team=Number(b.dataset.pkteam);
    pkgSaveGame(gid2);
  });
  host.querySelectorAll("[data-pkgconf]").forEach(el=>{
    const gid2=Number(el.dataset.pkgconf);
    const game=pkg.games[gid2];
    const locked=game?pkLockedIso(game.start_date):true;
    const cur=(pkg.stage[gid2]&&pkg.stage[gid2].conf)||(pkg.mine[gid2]&&pkg.mine[gid2].confidence)||"";
    const opts=[{value:"",label:"rank"}];
    for(let v=N; v>=1; v--){
      if(usedConf.has(v)&&v!==cur) continue;      // each number once — free it by changing that pick
      opts.push({value:v,label:String(v)});
    }
    mountAppSelect(el, opts, cur, v=>{
      const st=pkg.stage[gid2]=pkg.stage[gid2]||{};
      st.conf=Number(v)||undefined;
      pkgSaveGame(gid2);
    }, {slim:true, ariaLabel:"Confidence rank", disabled:locked||!authUser});
  });
  host.querySelectorAll("[data-pkcmp]").forEach(b=>b.onclick=()=>pkgToggleDrawer(Number(b.dataset.pkcmp),"cmp"));
  host.querySelectorAll("[data-pkgp]").forEach(b=>b.onclick=()=>pkgToggleDrawer(Number(b.dataset.pkgp),"gp"));
  const tbIn=host.querySelector("#tbguess");
  if(tbIn) tbIn.onchange=async()=>{
    const v=Number(tbIn.value);
    if(!(v>=0&&v<=200)||!authUser) return;
    await authFetch("POST","pickem_tiebreaks?on_conflict=season,week,user_id",
      {season:pk.season, week:pkg.week, user_id:authUser.id, total_points_guess:v});
  };
  pkgWireWeeks(host, ()=>{ pkg.stats=null; pkgLoadTab(); });
}
async function pkgSaveGame(gid2){
  const g=pkg.g, game=pkg.games[gid2];
  const msgEl=document.getElementById("pkm-"+gid2);
  const say=(t,cls)=>{ if(msgEl){ msgEl.textContent=t; msgEl.className="authmsg "+(cls||""); } };
  if(!game||pkLockedIso(game.start_date)){ say("This game is locked.","err"); return; }
  const st=pkg.stage[gid2]||{};
  const team=st.team||(pkg.mine[gid2]&&pkg.mine[gid2].pick_team);
  const conf=g.scoring_mode==="confidence" ? (st.conf||(pkg.mine[gid2]&&pkg.mine[gid2].confidence)) : null;
  if(!team) return;
  if(g.scoring_mode==="confidence" && !conf){ say("Pick a confidence number to save."); pkgRefreshButtons(gid2, team); return; }
  if(!(await pkRequireHandle())) return;
  say("saving…");
  try{
    if(g.is_system){
      // the National Pool writes through the LEGACY board (U71: the mirror trigger is
      // the single source that keeps both scoreboards identical — flipping this write
      // to the group RPC would fork them)
      const r=await authFetch("POST","pickem_picks?on_conflict=season,week,game_id,user_id",
        {season:pk.season, week:pkg.week, game_id:gid2, user_id:authUser.id, pick_team:team, confidence:conf});
      if(r.error) throw new Error(r.status===409?"That confidence number is on another of your picks.":"Save failed — try again.");
    } else {
      await predRpc("group_pick",{gid:pkg.gid, p_week:pkg.week, p_game:gid2, p_pick:team, p_conf:conf});
    }
    pkg.mine[gid2]={pick_team:team, confidence:conf};
    delete pkg.stage[gid2];
    say("Saved — you can change it until kickoff.","ok");
    try{ track("pickem_pick", String(gid2)); }catch(_e){}
    pkgRefreshButtons(gid2, team);
  }catch(e){ say(e.message||"save failed","err"); }
}
function pkgRefreshButtons(gid2, team){
  document.querySelectorAll(`[data-pkgpick="${gid2}"]`).forEach(b=>
    b.classList.toggle("primary", Number(b.dataset.pkteam)===team));
}
// U74-C: one drawer open per card — opening either expander collapses the other; both
// re-tap to collapse; chevron + amber .open state mirror the drawer.
function pkgToggleDrawer(gid2, kind){
  const ids={cmp:"pkdrawer-", gp:"pkgpdrawer-"}, attrs={cmp:"data-pkcmp", gp:"data-pkgp"};
  const d=document.getElementById(ids[kind]+gid2);
  const btn=document.querySelector(`[${attrs[kind]}="${gid2}"]`);
  if(!d||!pkg.games[gid2]) return;
  const opening=d.hidden;
  const other=kind==="cmp"?"gp":"cmp";
  const od=document.getElementById(ids[other]+gid2);
  const ob=document.querySelector(`[${attrs[other]}="${gid2}"]`);
  if(opening&&od&&!od.hidden){ od.hidden=true; if(ob){ ob.classList.remove("open"); ob.setAttribute("aria-expanded","false"); } }
  d.hidden=!opening;
  if(btn){ btn.classList.toggle("open", opening); btn.setAttribute("aria-expanded", String(opening)); }
  if(!opening||d.dataset.loaded) return;
  if(kind==="cmp") pkgLoadCompare(gid2, d);
  else pkgLoadGamePre(gid2, d);
}
async function pkgLoadCompare(gid2, d){
  const game=pkg.games[gid2];
  d.innerHTML=`<div class="loading" style="padding:10px">Loading comparison…</div>`;
  try{
    const a=game.away_team_id, hm=game.home_team_id;
    const lo=Math.min(a,hm), hi=Math.max(a,hm);
    const [adjRows]=await Promise.all([
      api(`matchup_adjusted?select=payload&season=eq.${pk.season}&team_a=eq.${lo}&team_b=eq.${hi}`).catch(()=>[]),
      loadMarketLines(), ensureCatalog()]);
    const adj=(adjRows&&adjRows[0])?adjRows[0].payload:null;
    const chip=marketChip(game);
    const strip=pkStatStrip({home_team_id:hm, away_team_id:a}, pkg.stats)||"";
    let h="";
    if(chip) h+=`<div style="padding:4px 0">${chip}</div>`;
    h+=strip;
    if(adj&&adj.panels){
      h+=`<div class="secsub" style="padding:6px 0 2px"><b>Adjusted for schedule</b> — raw stats reward
        soft schedules; these duel rows adjust for the offenses and defenses each side actually faced.</div>`;
      adj.panels.forEach(p=>{
        const tOff=teamMeta[p.off]||{school:"?"}, tDef=teamMeta[p.def]||{school:"?"};
        const free=[...p.rows, ...(p.fallback||[])].filter(r=>ADJ_FREE_KEYS.includes(r.key));
        if(!free.length) return;
        h+=`<div class="duelpanelhd" style="padding-top:6px">${esc(tOff.school)} offense vs ${esc(tDef.school)} defense</div>`;
        free.forEach(r=>{ h+=duelRowHTML(r, tOff, tDef, false); });
      });
    } else if(!strip) {
      h+=`<div class="secsub">Adjusted comparison data lands with the season's first results.</div>`;
    }
    h+=`<div class="navrow" style="padding-top:6px"><button class="navbtn" data-pklab="${gid2}">Full Matchup Lab <svg class="ic" aria-hidden="true"><use href="#i-chev-r"/></svg></button></div>`;
    d.innerHTML=h; d.dataset.loaded="1";
    d.querySelectorAll("[data-pklab]").forEach(b=>b.onclick=()=>{
      openMatchup(game.home_team_id, game.away_team_id, game.neutral_site?"neutral":"aHome"); });
  }catch(e){ d.innerHTML=`<div class="secsub">Comparison unavailable right now.</div>`; }
}
// U74-C: the in-card game summary — the game page's PRE renderers verbatim (win % +
// projected margin, market chip, key players, series line) with the full page one tap away.
async function pkgLoadGamePre(gid2, d){
  d.innerHTML=`<div class="loading" style="padding:10px">Loading game summary…</div>`;
  try{
    const g=(await api(`games?select=${GAME_SEL}&id=eq.${gid2}`))[0];
    if(!g) throw new Error("no game");
    const {wpCard, mkt, kpCard, hhCard} = await gamePreCards(g);
    let h="";
    if(mkt) h+=`<div class="mktline" style="text-align:center;padding:4px 0 2px">${mkt}</div>`;
    h+=wpCard+kpCard+hhCard;
    if(!h) h=`<div class="secsub">Game details land as the season data fills in.</div>`;
    h+=`<div class="navrow" style="padding-top:6px"><button class="navbtn" data-pkgpfull="${gid2}">Open full game page <svg class="ic" aria-hidden="true"><use href="#i-chev-r"/></svg></button></div>`;
    d.innerHTML=h; d.dataset.loaded="1";
    d.querySelectorAll("[data-pkgpfull]").forEach(b=>b.onclick=()=>openGame(gid2));
  }catch(e){ d.innerHTML=`<div class="secsub">Game summary unavailable right now.</div>`; }
}

// ---- #5: standings + champion banner + trophy case ----
async function pkgRenderStandings(host){
  const g=pkg.g;
  const get = q => authUser
    ? authFetch("GET", q).then(r=>r.data||[])
    : api(q).catch(()=>[]);
  const [board, champs]=await Promise.all([

    get(`pickem_group_champions?select=season,user_id,handle,display_name,total_points,decided_by&group_id=eq.${pkg.gid}&order=season.desc`)]);

  let h="";

      past.forEach(x=>{ h+=`<div class="boxrow"><div class="bva">${x.season}</div>
        <div class="bk">${pkName(x.user_id,x.handle,x.display_name)}</div>
        <div class="bvb">${x.total_points}</div></div>`; });
      h+=`</div>`;
    }
  }
  const drops=g.drop_n_weeks>0;
  h+=`<div class="sec"><div class="sectitle">${pk.season} season</div>`;
  if(!cur.length){
    // U74-D: an unscored group is NOT empty — every member lists at 0 immediately,

    if(g.is_system){
      const n=roster&&roster.member_count!=null?roster.member_count:null;
      if(n!=null){
        const meIn=roster&&roster.you_in;
        h+=`<div class="secsub" style="padding:0 2px 4px"><b>${meIn?`You + ${Math.max(0,n-1)} other${n===2?"":"s"} are in`:`${n} player${n===1?"":"s"} are in`}</b> — the National Pool board fills in as weeks score.</div>`;
      }
    } else if(roster&&Array.isArray(roster.members)&&roster.members.length){
      h+=`<div class="pkstand hd"><span>#</span><span>Member</span><span>Points</span><span title="Weekly wins"><svg class="ic" aria-hidden="true"><use href="#i-trophy"/></svg></span><span>Best</span><span>Win%</span><span>Wks</span></div>`;
      const mem=[...roster.members].sort((x,y)=>(x.joined_at||"").localeCompare(y.joined_at||""));
      if(g.model_plays) mem.push({user_id:MODEL_UID, handle:"model", joined_at:null});
      mem.forEach((r,i)=>{
        const me=authUser&&r.user_id===authUser.id;

        h+=`<div class="pkstand${model?" is-model":""}${me?" is-me":""}">
          <span>${i+1}</span>

          <span><b>0</b></span><span></span><span></span><span></span><span><small>0</small></span></div>`;
      });

    h+=`<div class="secsub" style="padding-top:4px">No scored weeks yet — results post after the week's games finish and
      the weekly scoring pass runs (opening-weekend results land with the first weekly pass).</div>`;
  }
  else{
    h+=`<div class="pkstand hd"><span>#</span><span>Member</span><span>${drops?"After drops":"Points"}</span><span title="Weekly wins"><svg class="ic" aria-hidden="true"><use href="#i-trophy"/></svg></span><span>Best</span><span>Win%</span><span>Wks</span></div>`;
    cur.forEach((r,i)=>{

async function pkgWeekScores(){
  const el=document.getElementById("pkwkscores");

async function pkDueInfo(){
  if(!authUser) return null;
  try{
    const mem=await authFetch("GET", `pickem_members?select=group_id&user_id=eq.${authUser.id}`);
    const gids=[...new Set((mem.data||[]).map(r=>r.group_id))];
    if(!gids.length) return null;
    const sl=(await authFetch("GET", `pickem_group_slates?select=group_id,season,week,game_id&season=eq.${pk.season}&group_id=in.(${gids.join(",")})`)).data||[];
    if(!sl.length) return null;
    const ids=[...new Set(sl.map(r=>r.game_id))];
    const games=await api(`games?select=id,start_date&id=in.(${ids.join(",")})`);
    const soon={};
    games.forEach(g=>{ const t=new Date(g.start_date)-Date.now();
      if(t>0&&t<48*36e5) soon[g.id]=g.start_date; });
    const need=sl.filter(r=>soon[r.game_id]);
    if(!need.length) return null;
    const weeks=[...new Set(need.map(r=>r.week))];
    const mine=(await authFetch("GET", `pickem_group_picks?select=group_id,week,game_id&season=eq.${pk.season}&user_id=eq.${authUser.id}&week=in.(${weeks.join(",")})`)).data||[];
    const have=new Set(mine.map(p=>`${p.group_id}|${p.week}|${p.game_id}`));
    const missing=need.filter(r=>!have.has(`${r.group_id}|${r.week}|${r.game_id}`));
    if(!missing.length) return null;
    const first=missing.map(r=>soon[r.game_id]).sort()[0];
    const wkKey=pk.season*100+Math.max(...missing.map(r=>r.week));
    return {n:missing.length, first, k:wkKey, groups:[...new Set(missing.map(r=>r.group_id))].length};
  }catch(_e){ return null; }
}

  ["national_champion","National champion"],["award_winner","Awards"],["win_total","Team win totals"]];

async function predRpc(fn, body){
  const { data } = await sb.auth.getSession();
  const tok = data && data.session && data.session.access_token;
  if(!tok) throw new Error("sign in required");
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`,{method:"POST",
    headers:{apikey:KEY, Authorization:"Bearer "+tok, "Content-Type":"application/json"},
    body:JSON.stringify(body||{})});
  const j = await res.json().catch(()=>null);
  if(!res.ok) throw new Error((j&&(j.message||j.hint))||("HTTP "+res.status));
  return j;
}
const predLocked = m => m.status!=="open" || new Date(m.locks_at) <= new Date();
function predLockTxt(iso){
  const ms = new Date(iso) - Date.now();
  if(ms<=0) return "locked";
  const d=Math.floor(ms/864e5), h=Math.floor(ms%864e5/36e5), mi=Math.floor(ms%36e5/6e4);
  return d ? `locks in ${d}d ${String(h).padStart(2,"0")}h`
           : h ? `locks in ${h}h ${String(mi).padStart(2,"0")}m` : `locks in ${mi}m`;
}

function predProbOpts(k){
  // mirror the RPC's floor exactly: round(1/k + 0.005, 2) — below it a pick would call
  // its own choice less likely than a blind uniform guess
  const min = Math.round(100/k + 0.5);
  const vals=[min];
  for(let p=Math.ceil((min+1)/5)*5; p<=95; p+=5) vals.push(p);
  vals.push(99);
  return [...new Set(vals)].map(p=>({value:String(p), label:p+"%"}));
}

async function predSave(key){
  const m = pred.open.find(x=>x.market_key===key); if(!m) return;
  const st = pred.sel[key]||{};
  const my = pred.mine[key];
  const opt = st.opt!=null ? st.opt : (my ? my.option_idx : null);
  const prob = st.prob!=null ? st.prob : (my ? Math.round(my.prob*100) : null);
  const msg = t=>{ const el=document.querySelector(`[data-predmsg="${CSS.escape(key)}"]`); if(el) el.textContent=t; };
  if(opt==null || !prob){ msg("Pick an option and how sure you are — it saves automatically."); return; }
  msg("Saving…");
  try{
    const r = await predRpc("prediction_pick", {p_market:key, p_option:opt, p_prob:prob/100});
    pred.mine[key] = {market_key:key, option_idx:r.option_idx, prob:Number(r.prob)};
    try{ track("feature_open","prediction_pick"); }catch(_e){}
    msg(`Saved: ${(m.options[r.option_idx]||{}).label||"?"} at ${Math.round(Number(r.prob)*100)}% — changeable until lock.`);
  }catch(e){
    // the server is the authority — a lock refusal lands here verbatim
    msg("Not saved: "+ (e.message||e));
  }
}

async function fanPool(pos){
  const S=fanSeason(), k=S+":"+pos;
  if(_fanPoolCache[k]) return _fanPoolCache[k];
  const [pool, top] = await Promise.all([
    api(`fantasy_pool?select=athlete_id,player,team_id,position&season=eq.${S}&position=eq.${pos}&order=player.asc&limit=2500`),
    api(`fantasy_player_week?select=athlete_id,conv_points&season=eq.${S-1}&position=eq.${pos}&order=conv_points.desc&limit=400`).catch(()=>[])]);
  const pts={};
  top.forEach(r=>{ pts[r.athlete_id]=(pts[r.athlete_id]||0)+Number(r.conv_points); });
  pool.forEach(p=>{ p.pts=pts[p.athlete_id]||0; });
  _fanPoolCache[k]={pool, ranked:[...pool].filter(p=>p.pts>0).sort((a,b)=>b.pts-a.pts)};
  return _fanPoolCache[k];
}

// ---------- User-driven Simulator: pick winners -> standings, champions, 12-team CFP field ----------
// Deterministic core uses NO model. The optional odds layer (SHOW_PREDICTIONS) Monte-Carlos the
// unpicked games with the precomputed matchup_winprob (probabilities only — never a rating).
const REAL_CONF_MIN = 8;   // a "conference" that crowns a champion (excludes 2-team Independents)
let sim=null;
async function fetchAllWinprob(){   // PostgREST caps at 1000 rows/request
  // Batch 8 #3: first page sequential, remaining pages IN PARALLEL (was ~10 serial
  // round-trips on sim open); stops at the first short page; sane 40-page bound.
  const Q=off=>`matchup_winprob?select=team_a,team_b,win_prob_a,win_prob_a_home,win_prob_a_away&season=eq.${SEASON_SCHED}&order=team_a.asc,team_b.asc&limit=1000&offset=${off}`;
  let all=await api(Q(0));
  if(all.length<1000) return all;
  for(let base=1000; base<40000; base+=8000){
    const chunks=await Promise.all(Array.from({length:8},(_,i)=>api(Q(base+i*1000)).catch(()=>[])));
    let short=false;
    chunks.forEach(c=>{ all=all.concat(c); if(c.length<1000) short=true; });
    if(short) break;
  }
  return all;
}
async function openSimulator(){
  window.scrollTo(0,0); app.innerHTML=skelView(10);
  try{
    await ensureTeamMeta();
    const [games, teams, wp, pf] = await Promise.all([
      api(`games?select=id,week,season_type,home_team_id,away_team_id,home_team,away_team,neutral_site,conference_game,home_points,away_points,completed&season=eq.${SEASON_SCHED}&season_type=eq.regular&order=week.asc`),
      api(`teams?select=id,school,conference,classification`),
      SHOW_PREDICTIONS?fetchAllWinprob():Promise.resolve([]),
      api(`playoff_odds?select=team_id,make_cfp,exp_wins&season=eq.${SEASON_SCHED}&order=make_cfp.desc&limit=12`).catch(()=>[]) ]);
    const conf={}, fbs=new Set();
    teams.forEach(t=>{ if((t.classification||"").toLowerCase()==="fbs"){ fbs.add(String(t.id)); conf[String(t.id)]=t.conference||"Independent"; } });
    const wpmap=new Map(); wp.forEach(r=>wpmap.set(r.team_a+"-"+r.team_b, r));
    // FBS-vs-FBS games drive picks/SOR; FBS-vs-FCS games (one side id null) COUNT in
    // records at the tiered base rate (batch 6 B1) with the real opponent name.
    const fgames=games.filter(g=>fbs.has(String(g.home_team_id))&&fbs.has(String(g.away_team_id)));
    const fcsBy={};
    games.forEach(g=>{ const hF=fbs.has(String(g.home_team_id)), aF=fbs.has(String(g.away_team_id));
      if(hF===aF) return;
      const t=String(hF?g.home_team_id:g.away_team_id);
      const oppName=hF?(g.away_team||"FCS opponent"):(g.home_team||"FCS opponent");
      let p=pFcsFor(t, conf), done=null;
      if(g.completed&&g.home_points!=null&&g.home_points!==g.away_points)
        done=hF?(g.home_points>g.away_points):(g.away_points>g.home_points);
      (fcsBy[t]=fcsBy[t]||[]).push({opp:oppName, p, done, week:g.week});
    });
    sim={games:fgames, conf, fbs, wp:wpmap, fcsBy, probField:pf||[], userPicks:{}, fav:{}, locked:{}, final:{}, ranked:[], lastRun:null,
      view:"cfp", runSig:null, fabFocus:null};   // U2 (B2): active toggle + picks-signature at the last accepted RUN
    // B1: completed games are LOCKED to their actual result — never re-picked, never
    // re-randomized. The bracket is "actual results + your picks + model favorites".
    fgames.forEach(g=>{ if(g.completed && g.home_points!=null && g.away_points!=null && g.home_points!==g.away_points){
      sim.locked[g.id]= g.home_points>g.away_points ? String(g.home_team_id):String(g.away_team_id);
      sim.final[g.id]= `${g.home_points>g.away_points?g.home_points:g.away_points}–${g.home_points>g.away_points?g.away_points:g.home_points}`; } });
    // model favorite per game (default pick); if predictions off, default home team
    fgames.forEach(g=>{ const ph=simPHome(g.home_team_id,g.away_team_id,g.neutral_site);
      sim.fav[g.id]= (SHOW_PREDICTIONS? (ph>=0.5):true) ? String(g.home_team_id):String(g.away_team_id); });
    // B6: count missing winprob pairs (0.5 fallback) — surface a data-gap flag if material
    sim.wpMissing = SHOW_PREDICTIONS ? fgames.filter(g=>{ const lo=Math.min(+g.home_team_id,+g.away_team_id),
      hi=Math.max(+g.home_team_id,+g.away_team_id); return !wpmap.get(lo+"-"+hi); }).length : 0;
    sim.hasSOR = SHOW_PREDICTIONS && sim.wp.size>0;
    if(sim.hasSOR) precomputeSOR();
    sim.runSig=simPicksSig(); simHideFab();   // U2: fresh page = nothing pending
    renderSim();
    if(SHOW_PREDICTIONS) simAutoOdds();   // B7 (kept per B2): the initial chalk-default MC on open — after this, recomputes come only via RUN
  }catch(e){ app.innerHTML=backHeader("Simulator")+`<div class="list"><div class="err">Couldn't load simulator: ${e.message}</div></div>`;
    document.querySelector(".back").onclick=navBack; }
}
function simPHome(h,a,neutral){
  const lo=Math.min(+h,+a), hi=Math.max(+h,+a), row=sim&&sim.wp.get(lo+"-"+hi);
  if(!row) return 0.5;
  if(neutral){ const pLo=Number(row.win_prob_a); return (+h===lo)?pLo:1-pLo; }
  if(+h===lo) return Number(row.win_prob_a_home);
  return 1-Number(row.win_prob_a_away);
}
function simPTeam(teamId, g){   // P(teamId wins this game)

// P(winner beats loser) with the winner at the given venue ('home'/'away'/'neutral')
function simPair(w, l, venue){

  if(!row) return 0.5; const wIsLo=(W===lo);

  if(venue==="home")   return wIsLo?Number(row.win_prob_a_home):1-Number(row.win_prob_a_away);

// STRENGTH OF RECORD precompute: per team, the distribution of how many games an "average
// top-tier team" (mean of the top-25 by model strength) would win against THAT team's exact
// schedule (honoring venue). SOR(team) = 1 - P(reference wins >= team's actual wins): a hard
// schedule lowers the reference's chances, so matching a good record there grades high; an
// undefeated team vs a soft schedule grades low. Schedule is fixed, so this is computed once.
function precomputeSOR(){
  const ids=[...sim.fbs];
  const proxy={}; ids.forEach(t=>{ let s=0,n=0; ids.forEach(u=>{ if(u===t) return; s+=simPair(t,u,"neutral"); n++; }); proxy[t]=n?s/n:0; });
  const topRef=ids.slice().sort((a,b)=>proxy[b]-proxy[a]).slice(0,25);   // "average top-25 team"
  const refH={},refA={},refN={};
  ids.forEach(o=>{ let sh=0,sa=0,sn=0,c=0; topRef.forEach(R=>{ if(R===o) return;
      sh+=simPair(R,o,"home"); sa+=simPair(R,o,"away"); sn+=simPair(R,o,"neutral"); c++; });
    refH[o]=c?sh/c:0.5; refA[o]=c?sa/c:0.5; refN[o]=c?sn/c:0.5; });
  const sched={}; ids.forEach(t=>sched[t]=[]);
  sim.games.forEach(g=>{ const h=String(g.home_team_id), a=String(g.away_team_id);
    if(sched[h]) sched[h].push(g.neutral_site?refN[a]:refH[a]);   // reference hosts (or neutral)
    if(sched[a]) sched[a].push(g.neutral_site?refN[h]:refA[h]); });
  sim.refGeq={};
  ids.forEach(t=>{ const ps=sched[t], N=ps.length; let dist=[1];
    ps.forEach(p=>{ const nd=new Array(dist.length+1).fill(0);
      for(let k=0;k<dist.length;k++){ nd[k]+=dist[k]*(1-p); nd[k+1]+=dist[k]*p; } dist=nd; });
    const geq=new Array(N+1).fill(0); let acc=0; for(let k=N;k>=0;k--){ acc+=dist[k]; geq[k]=acc; }
    sim.refGeq[t]={geq,N}; });
}
function simSOR(teamId, wins){
  if(!sim.hasSOR || !sim.refGeq) return null;

// Ported from conference-rules-2026.md (verified Jul 19 2026). Champion = CCG WINNER.
// Analytic/CFP-ranking steps use the Hashmark rating as the documented proxy. UNVERIFIED
// items are provisional behind CONF_FLAGS (Pac-12 tiebreaks, CUSA post-H2H, MAC 3+ tail,

const SB_EAST=new Set(["Appalachian State","Coastal Carolina","Georgia Southern","Georgia State","James Madison","Marshall","Old Dominion"]);
const CCG_NEUTRAL=new Set(["SEC","Big Ten","Big 12","ACC","Mid-American"]);
const CONF_FLAGS={"Pac-12":"tiebreakers not yet published — provisional H2H, multi-team via rating proxy",

  "Mid-American":"3-plus-team tail order unverified — provisional",

const MW_INELIGIBLE=new Set();   // EMPTY for 2026 — the Jun 24 2026 NCAA vote made FCS-transition teams (NDSU, Sac State) immediately CCG/bowl/CFP-eligible; keep in sync with conference_rules.INELIGIBLE_SCHOOLS_2026
function confEngineCtx(picks){
  // conference records + results from CONFERENCE games only (conference_game flag —
  // Pac-12 Week-13 flex rematches are officially non-conference and never count)
  const rec={}, beat={}, sched={}, division={};
  sim.fbs.forEach(id=>{ rec[id]={w:0,l:0}; beat[id]=new Set(); sched[id]=new Set(); });
  sim.games.forEach(g=>{ if(g.conference_game===false) return;
    const h=String(g.home_team_id), a=String(g.away_team_id);
    if(!sim.conf[h] || sim.conf[h]!==sim.conf[a]) return;
    const w=String(picks[g.id]); if(!w) return;
    const l=w===h?a:h;
    rec[w].w++; rec[l].l++; beat[w].add(l); sched[h].add(a); sched[a].add(h);
  });

    if(sim.conf[id]==="Sun Belt") division[id]=SB_EAST.has(t.school)?"E":"W"; });
  const rating={}; (board2026||[]).forEach(b=>rating[String(b.team_id)]=Number(b.overall));
  return {rec, beat, sched, division, rating,
    wpct:id=>{ const r=rec[id]; return (r.w+r.l)?r.w/(r.w+r.l):0; }};

// shared tiebreak helpers — every step returns a sorted copy or null (unresolved)
function tbH2H(ids, ctx){
  // two-team: the head-to-head decides if played. 3+ (MAC 2025 Miami precedent, mirrored
  // from the model port): a SWEEP only ADVANCES the sweeper — nobody is eliminated by
  // H2H record alone; without a sweeper the step is unresolved and the chain continues.
  if(ids.length===2){
    if(ctx.beat[ids[0]].has(ids[1])) return [ids[0], ids[1]];
    if(ctx.beat[ids[1]].has(ids[0])) return [ids[1], ids[0]];
    return null;
  }
  const sweeper=ids.find(a=>ids.every(b=>a===b||ctx.beat[a].has(b)));
  if(sweeper) return [sweeper, ...ids.filter(x=>x!==sweeper)];
  return null;
}
function tbOppWpct(ids, ctx){    // opponents' cumulative conference win%
  const v={}; ids.forEach(t=>{ let s2=0,n=0; ctx.sched[t].forEach(o=>{ s2+=ctx.wpct(o); n++; }); v[t]=n?s2/n:0; });
  const s=[...ids].sort((a,b)=>v[b]-v[a]);
  return Math.abs(v[s[0]]-v[s[s.length-1]])>1e-9 ? s : null;
}
function tbCommonOpps(ids, ctx){ // record vs opponents common to ALL tied teams
  let common=null;
  ids.forEach(t=>{ const o=new Set([...ctx.sched[t]].filter(x=>!ids.includes(x)));
    common=common?new Set([...common].filter(x=>o.has(x))):o; });
  if(!common||!common.size) return null;
  const v={}; ids.forEach(t=>{ let w=0,n=0; common.forEach(o=>{ n++; if(ctx.beat[t].has(o)) w++; }); v[t]=n?w/n:0; });
  const s=[...ids].sort((a,b)=>v[b]-v[a]);
  return Math.abs(v[s[0]]-v[s[s.length-1]])>1e-9 ? s : null;
}
function tbRating(ids, ctx){     // the documented analytic/CFP proxy — always resolves
  return [...ids].sort((a,b)=>(ctx.rating[b]||-9)-(ctx.rating[a]||-9));
}
// per-league chains (two-team and multi-team collapse to the same helper sequence; the
// league-specific margin/total-wins steps that need scores fall through to the proxy in
// simulated seasons — disclosed in methodology)
const CONF_CHAINS={
  "SEC":[["head-to-head",tbH2H],["common opponents",tbCommonOpps],["opponents' conference win%",tbOppWpct],["rating proxy (capped-margin step)",tbRating]],
  "Big Ten":[["head-to-head",tbH2H],["common opponents",tbCommonOpps],["opponents' conference win% (step 4)",tbOppWpct],["rating proxy (TRS step)",tbRating]],
  "Big 12":[["head-to-head",tbH2H],["common opponents",tbCommonOpps],["opponents' conference win%",tbOppWpct],["rating proxy (total-wins/TRS steps)",tbRating]],
  "ACC":[["head-to-head",tbH2H],["rating proxy (Team Success Ranking)",tbRating]],
  "American Athletic":[["head-to-head",tbH2H],["rating proxy (composite step)",tbRating],["common opponents",tbCommonOpps]],
  "Conference USA":[["head-to-head",tbH2H],["rating proxy (provisional post-H2H)",tbRating]],
  "Mid-American":[["head-to-head",tbH2H],["common opponents",tbCommonOpps],["opponents' conference win%",tbOppWpct],["rating proxy (TRS)",tbRating]],
  "Mountain West":[["head-to-head",tbH2H],["rating proxy (composite)",tbRating]],
  "Pac-12":[["head-to-head (provisional)",tbH2H],["rating proxy (provisional)",tbRating]],
  "Sun Belt":[["head-to-head",tbH2H],["divisional win%",tbOppWpct],["rating proxy (composite steps)",tbRating]],
};
function breakTie(conf, ids, ctx, decided){
  if(ids.length===1) return ids;
  for(const [name,fn] of (CONF_CHAINS[conf]||CONF_CHAINS["Big Ten"])){
    const r=fn(ids, ctx);
    if(r){ r.forEach(t=>decided[t]=`${shortConf(conf)}: ${name}`);
      // partially separated groups recurse on remaining internal ties
      return r; }
  }
  return tbRating(ids, ctx);
}
function confQualify(conf, ids, ctx){
  // ACC column-tie definition (Jul 15 2026): teams tied on the WIN column or the LOSS
  // column group together even with different win% (7-1 ties 8-1); elsewhere pure win%.
  const decided={};
  let pool=ids.filter(id=>!(conf==="Mountain West"&&MW_INELIGIBLE.has((teamMeta[id]||{}).school)));
  if(conf==="Sun Belt"){
    const div=d=>pool.filter(id=>ctx.division[id]===d);
    const champ=d=>{ const g=div(d).sort((a,b)=>ctx.wpct(b)-ctx.wpct(a));
      const top=g.filter(t=>Math.abs(ctx.wpct(t)-ctx.wpct(g[0]))<1e-9);
      return breakTie(conf, top, ctx, decided)[0]; };
    const e=champ("E"), w=champ("W");
    // host = division champ with higher conference win%
    const pair=ctx.wpct(e)>=ctx.wpct(w)?[e,w]:[w,e];
    return {pair, decided};
  }
  const groupKey = conf==="ACC"
    ? id=>null   // handled below
    : id=>ctx.wpct(id).toFixed(6);
  let ordered;
  if(conf==="ACC"){
    ordered=[...pool].sort((a,b)=>ctx.wpct(b)-ctx.wpct(a));
    // group by column ties around the top-2 boundary
    const tiedWith=(x,y)=>{ const rx=ctx.rec[x], ry=ctx.rec[y];
      return (rx.w===ry.w&&rx.l===ry.l)||rx.w===ry.w||rx.l===ry.l; };
    const out=[];
    let rest=[...ordered];
    while(rest.length){
      const head=rest[0];
      const grp=rest.filter(t=>tiedWith(head,t));
      const brk=grp.length>1?breakTie(conf, grp, ctx, decided):grp;
      out.push(...brk);
      rest=rest.filter(t=>!grp.includes(t));
    }
    return {pair:[out[0], out[1]], decided};
  }
  // generic: order by win%, break tied groups
  const byPct={};
  pool.forEach(id=>{ const k=groupKey(id); (byPct[k]=byPct[k]||[]).push(id); });
  ordered=[];
  Object.keys(byPct).sort((a,b)=>Number(b)-Number(a)).forEach(k=>{
    ordered.push(...(byPct[k].length>1?breakTie(conf, byPct[k], ctx, decided):byPct[k]));
  });
  return {pair:[ordered[0], ordered[1]], decided};
}

function simCompute(picks, fcsDraw, ccgDraw){
  const rec={}; sim.fbs.forEach(id=>rec[id]={w:0,l:0,cw:0,cl:0});
  const h2h={};        // winner -> Set(losers beaten)
  const tg={};         // team -> {opp: wonBool}  (for common-opponents tiebreak)
  sim.games.forEach(g=>{ const w=picks[g.id]; if(!w) return;
    const h=String(g.home_team_id), a=String(g.away_team_id);
    const loser = (String(w)===h)?a:h;
    const cg = g.conference_game!==false && sim.conf[h] && sim.conf[h]===sim.conf[a];   // 3a: flex/dual games excluded
    if(rec[w]){ rec[w].w++; if(cg) rec[w].cw++; (h2h[w]=h2h[w]||new Set()).add(loser); }
    if(rec[loser]){ rec[loser].l++; if(cg) rec[loser].cl++; }
    (tg[w]=tg[w]||{})[loser]=true; (tg[loser]=tg[loser]||{})[w]=false;
  });
  // B1: FBS-vs-FCS games count in records — finals as played; chalk = FBS win (never a
  // chalk loss); the Monte Carlo passes a draw function (tiered base rate). Not part of
  // conference records, tiebreaks or SOR (FBS resume only).
  Object.entries(sim.fcsBy||{}).forEach(([t,list])=>{ if(!rec[t]) return;
    list.forEach((g,gi)=>{ const won = g.done!=null ? g.done : (fcsDraw ? fcsDraw(g) : true);
      rec[t][won?"w":"l"]++; }); });
  const wpct=id=>{ const r=rec[id], g=r.w+r.l; return g?r.w/g:0; };
  const cpct=id=>{ const r=rec[id], g=r.cw+r.cl; return g?r.cw/g:0; };
  // common-opponents edge: +1 if x better, -1 if y better, 0 otherwise
  const commonEdge=(x,y)=>{ const gx=tg[x],gy=tg[y]; if(!gx||!gy) return 0;
    let xw=0,xn=0,yw=0; for(const o in gx){ if(o in gy){ xn++; if(gx[o])xw++; if(gy[o])yw++; } }
    if(!xn) return 0; return xw>yw?-1:xw<yw?1:0; };
  // conference standings + champions (real conferences only). SIM2 needs the FULL order per
  // conference (the top two meet in the title game), so keep each sorted list. Tiebreak:
  // conference record, overall record, head-to-head, then common opponents.
  // Batch 9 3a: REAL qualification (per-league official tiebreaks) + the CCG as a GAME.
  // Champion = CCG winner. User-pickable via the virtual pick id "ccg|<conference>".
  const byConf={}; sim.fbs.forEach(id=>{ const c=sim.conf[id]; (byConf[c]=byConf[c]||[]).push(id); });
  const ctx=confEngineCtx(picks);
  const confSorted={}, champions=[], ccg={};
  Object.entries(byConf).forEach(([c,ids])=>{ if(ids.length<REAL_CONF_MIN) return;
    ids.sort((x,y)=>ctx.wpct(y)-ctx.wpct(x)||wpct(y)-wpct(x));
    confSorted[c]=ids;
    const q=confQualify(c, ids, ctx);
    const [t1,t2]=q.pair;
    if(!t1||!t2){ champions.push(ids[0]); return; }
    const ccgId="ccg|"+c;
    const venue=CCG_NEUTRAL.has(c)?"neutral":"home";   // campus leagues: No. 1 seed hosts
    let w;
    if(picks[ccgId]===String(t1)||picks[ccgId]===String(t2)) w=String(picks[ccgId]);
    else if(ccgDraw) w=ccgDraw(t1,t2,venue);
    else w = simPair(t1,t2,venue)>=0.5?String(t1):String(t2);
    const lsr = w===String(t1)?String(t2):String(t1);
    if(rec[w]) rec[w].w++;
    if(rec[lsr]) rec[lsr].l++;
    ccg[c]={pair:[String(t1),String(t2)], decided:q.decided, winner:w,
      flag:CONF_FLAGS[c]||null};
    champions.push(w);
  });
  const champSet=new Set(champions);
  // resume metric: Strength of Record (falls back to win% if predictions/winprob are off)
  const sor={}; sim.fbs.forEach(id=>{ const s=simSOR(id, rec[id].w); sor[id]=(s==null?wpct(id):s); });
  // CFP-style comparator: SOR, then head-to-head, then conference champ, then common opponents
  const cmp=(x,y)=>{ const d=sor[y]-sor[x]; if(Math.abs(d)>1e-9) return d;
    if(h2h[x]&&h2h[x].has(y)) return -1; if(h2h[y]&&h2h[y].has(x)) return 1;
    const cx=champSet.has(x), cy=champSet.has(y); if(cx!==cy) return cx?-1:1;
    return commonEdge(x,y); };
  // 2026 CFP format (rules changed Jan 2026): 12 teams, straight seeding by ranking (SOR).
  // Guaranteed spots: all FOUR Power Four champions regardless of final ranking (the "8-5
  // Duke" rule); Notre Dame if ranked in the top 12; and the highest-ranked Group of Six
  // TEAM — a conference title is NO LONGER required. Remaining spots at-large by ranking.
  const P4_CONFS=new Set(["SEC","Big Ten","Big 12","ACC"]);
  // FBS transition teams were provisionally bowl/CFP-INELIGIBLE in 2026 (NDSU to MW, Sac State to MAC)
  const INELIGIBLE_2026=new Set(); // NCAA vote Jun 24 2026: transition teams bowl/CFP-eligible
  const elig=id=>!INELIGIBLE_2026.has((teamMeta[id]||{}).school);
  const allRanked=[...sim.fbs].sort(cmp), rankedElig=allRanked.filter(elig);
  const guaranteed=champions.filter(id=>P4_CONFS.has(sim.conf[id])&&elig(id)); // P4 champs, any ranking
  const bestG6=rankedElig.find(id=>{ const cf=sim.conf[id];
    return cf && !P4_CONFS.has(cf) && (byConf[cf]||[]).length>=REAL_CONF_MIN; });
  if(bestG6 && !guaranteed.includes(bestG6)) guaranteed.push(bestG6);  // best G6 TEAM, champ or not
  const ndId=allRanked.find(id=>(teamMeta[id]||{}).school==="Notre Dame");   // sim.fbs is a Set — no .find
  if(ndId && allRanked.indexOf(ndId)<12 && !guaranteed.includes(ndId)) guaranteed.push(ndId); // ND top-12 guarantee
  const guarSet=new Set(guaranteed);
  const top12=rankedElig.slice(0,12), inTop=new Set(top12);
  const missing=guaranteed.filter(id=>!inTop.has(id));
  let field;

// ---- Monte Carlo engine (B4): chunked so the main thread never freezes — batches of
// sims per frame with a live progress readout. Locked finals are never re-randomized
// (B1); user picks stay fixed. Tallies per team: CFP / conf title / win-out counts plus
// full seed and win-count distributions (the per-team sheet needs them, B2).
const SIM_MC_N = 1000;                  // engine and copy must agree — benchmarked Jul 2026
function simMonteCarlo(N, onDone, onProgress, focusTeam){
  const fbs=[...sim.fbs], tally={};
  fbs.forEach(id=>tally[id]={po:0,ct:0,wo:0,seeds:{},wins:{},fr:{}});
  const open=sim.games.filter(g=>!sim.userPicks[g.id] && !sim.locked[g.id]);
  const fixed=Object.assign({}, sim.userPicks, sim.locked);
  const lev = focusTeam ? {} : null;   // batch 9 3f: per-game P(focus makes CFP | side wins)
  if(lev) open.forEach(g=>lev[g.id]={h:[0,0], a:[0,0]});
  let s=0;
  const BATCH=40;
  function batch(){
    const end=Math.min(s+BATCH, N);
    for(; s<end; s++){
      const picks=Object.assign({}, fixed);
      open.forEach(g=>{ picks[g.id]= Math.random()<simPHome(g.home_team_id,g.away_team_id,g.neutral_site)?String(g.home_team_id):String(g.away_team_id); });
      const r=simCompute(picks, g=>Math.random()<g.p, (a,b,v)=>Math.random()<simPair(a,b,v)?String(a):String(b));   // FCS + CCGs drawn
      r.field.forEach((id,i)=>{ tally[id].po++; tally[id].seeds[i+1]=(tally[id].seeds[i+1]||0)+1; });
      if(r.field.length>=12){   // P4: first-round pairings (5v12, 6v11, 7v10, 8v9)
        [[4,11],[5,10],[6,9],[7,8]].forEach(([x,y])=>{ const A=r.field[x],B=r.field[y];
          tally[A].fr[B]=(tally[A].fr[B]||0)+1; tally[B].fr[A]=(tally[B].fr[A]||0)+1; }); }
      r.champions.forEach(id=>{ if(tally[id]) tally[id].ct++; });
      fbs.forEach(id=>{ const w=r.rec[id].w; tally[id].wins[w]=(tally[id].wins[w]||0)+1;
        if(r.rec[id].l===0 && w>0) tally[id].wo++; });
      if(lev){ const inF=r.field.includes(String(focusTeam));
        open.forEach(g=>{ const side=String(picks[g.id])===String(g.home_team_id)?"h":"a";
          lev[g.id][side][0]++; if(inF) lev[g.id][side][1]++; }); }
    }
    if(onProgress) onProgress(s, N);
    if(s<N) setTimeout(batch, 0);
    else { sim.lastRun={tally, N, sig:simPicksSig(), at:Date.now(), lev, levTeam:focusTeam||null}; onDone(sim.lastRun); }
  }
  batch();
}

function simSeedMC(run){

// ══════════════ U53 — per-team FAQ + "Did you know" facts ══════════════
// Every answer is COMPUTED from stored rows at render time — never an LLM, never

    api(`championships?select=season,selector,split,vacated&team_id=eq.${teamId}&order=season.asc`).catch(()=>[]),
    api(`nil_figures?select=figure_low_musd,figure_high_musd,figure_type,source&season=eq.${SEASON_RESULTS}&team_id=eq.${teamId}&figure_low_musd=not.is.null`).catch(()=>[]),
    api(`rivalries?select=school_a,school_b,trophy,official_w,official_l,official_t,official_games,source_url&tier=eq.A&or=(team_a_id.eq.${teamId},team_b_id.eq.${teamId})`).catch(()=>[]),
    api(`qb_value_rating?select=player,rating,percentile&season=eq.${SEASON_RESULTS}&qualified=eq.true&team=eq.${encodeURIComponent(school)}&order=rating.desc`).catch(()=>[]),
    api(`player_value_rating?select=player,role,rating,percentile&season=eq.${SEASON_RESULTS}&qualified=eq.true&team=eq.${encodeURIComponent(school)}&order=rating.desc`).catch(()=>[]),
    // U59: records-book ledgers for the FAQ (conference titles + award winners)
    api(`conference_titles?select=conference,season,shared&school=eq.${encodeURIComponent(school)}&order=season.asc`).catch(()=>[]),
    api(`award_winners?select=award,season,player&school=eq.${encodeURIComponent(school)}&player=not.is.null&order=season.desc`).catch(()=>[])

function u53FAQ(t, d, games, teamId){
  const s=t.school, qs=[];

  if(d.gd && d.gd.games && d.gd.games.length){
    let exp=0, n=0;
    d.gd.games.forEach(g=>{ const home=+g.home_team_id===+teamId;
      const opp=home?g.away_team_id:g.home_team_id;
      const p=opp==null?(P4_FCS.has(t.conference)?P_FCS.p4:P_FCS.g5):gauntletP(teamId,g,d.gd.wpm);
      if(p!=null){ exp+=p; n++; } });
    if(n>=8) qs.push({q:`What is ${s}'s projected record for ${SEASON_SCHED}?`,
      a:`The Hashmark model projects about ${exp.toFixed(1)} wins across the ${n}-game schedule (the sum of its per-game win probabilities), so a season in the ${Math.floor(exp)}-${Math.ceil(exp)}-win range. ${SEASON_SCHED} preseason model, updated weekly; single games vary.`});
    else qs.push({q:`What is ${s}'s projected record for ${SEASON_SCHED}?`,
      a:`No full projection yet — the model has per-game probabilities for only ${n} of ${s}'s scheduled games. Projections fill in as matchup lines publish (${SEASON_SCHED} preseason).`});
  }
  // 2 — who do they play
  { const up=(games||[]).filter(g=>g.season===SEASON_SCHED&&g.season_type==="regular").sort((a,b)=>(a.week||99)-(b.week||99));
    if(up.length){ const first=up[0];
      const vs=String(first.home_team_id)===String(teamId)?`vs ${first.away_team}`:`at ${first.home_team}`;
      const marquee=up.filter(g=>{ const opp=String(g.home_team_id)===String(teamId)?g.away_team_id:g.home_team_id;
        return opp&&(typeof board2026!=="undefined"&&board2026||[]).slice(0,25).some(u=>String(u.team_id)===String(opp)); })
        .map(g=>String(g.home_team_id)===String(teamId)?g.away_team:g.home_team).slice(0,3);
      qs.push({q:`Who does ${s} play in ${SEASON_SCHED}?`,
        a:`${s} opens ${vs}${gameTimeLine(first)?` (${gameTimeLine(first)})`:""} and plays ${up.length} regular-season games.${marquee.length?` Marquee opponents by the model's top 25: ${marquee.join(", ")}.`:""} Official ${SEASON_SCHED} schedule; kickoff times and TV fill in as announced.`});
    } else qs.push({q:`Who does ${s} play in ${SEASON_SCHED}?`,
      a:`No ${SEASON_SCHED} schedule rows on file yet — the official slate loads as CFBD publishes it.`}); }
  // 3 — rating + rank
  if(d.hm && d.hm.rank) qs.push({q:`What is ${s}'s Hashmark rating and rank?`,
    a:`${s} ranks #${d.hm.rank} of 138 in the Hashmark power ratings (overall ${Number(d.hm.overall).toFixed(3)} — opponent-adjusted results, roster talent and coaching). ${SEASON_SCHED} preseason rating, updated nightly in season.`});
  else qs.push({q:`What is ${s}'s Hashmark rating and rank?`,
    a:`${s}'s ${SEASON_SCHED} Hashmark rating publishes with the preseason board — it will appear here (and on the Stats tab) when live.`});
  // 4 — conference position
  { const conf=t.conference||"Independent";
    const sos=d&&d.preSosRank;
    qs.push({q:`Where does ${s} sit in the ${conf}?`,
      a:`${s} plays in the ${conf}.${d.hm&&d.hm.rank?` The model has them #${d.hm.rank} nationally entering ${SEASON_SCHED}.`:""} Standings build weekly once games start (${SEASON_SCHED} season).`}); }
  // 5 — NIL, with the U45 sourced-vs-modeled distinction carried VERBATIM
  { const sourced=d.nilFig.filter(f=>f.figure_type!=="modeled_estimate");
    const modeled=d.nilFig.find(f=>f.figure_type==="modeled_estimate");
    if(sourced.length){ const f=sourced[0];
      qs.push({q:`What does ${s} spend on NIL?`,
        a:`Attributed public reporting puts ${s} at est. $${Number(f.figure_low_musd).toFixed(1)}${f.figure_high_musd&&f.figure_high_musd!==f.figure_low_musd?`-$${Number(f.figure_high_musd).toFixed(1)}`:""}M (${(f.figure_type||"").replace(/_/g," ")}, ${f.source}). ${SEASON_RESULTS} season figures — an estimate, never an audited number; every figure and source is on the NIL board.`, badge:"sourced"});
    } else if(modeled){
      qs.push({q:`What does ${s} spend on NIL?`,
        a:`No sourced figure exists for ${s} — schools don't publish this. Hashmark's model puts the range at est. $${Number(modeled.figure_low_musd).toFixed(1)}-$${Number(modeled.figure_high_musd).toFixed(1)}M (Modeled — not a reported figure; rev-share status + athletics revenue + conference context, ${SEASON_RESULTS}-${SEASON_RESULTS+1} cap year). A sourced figure always replaces the model.`, badge:"modeled"});
    } else qs.push({q:`What does ${s} spend on NIL?`,
        a:`Limited public disclosure — nothing attributable to a credible source, and Hashmark doesn't guess. ${SEASON_RESULTS} season search.`}); }
  // 6 — all-time record + titles (U13 ledgers)
  if(d.hist){ const h=d.hist;
    const titles=d.champs.filter(c=>!c.vacated&&!c.split);
    const tl=titles.length?`${titles.length} poll-era national title${titles.length>1?"s":""} on Hashmark's ledger (${titles.map(c=>c.season).join(", ")})`:"no poll-era national titles on Hashmark's ledger (claimed-title tiers are cataloged separately)";
    qs.push({q:`What is ${s}'s all-time record?`,

    if(all.length){ const best=all.slice().sort((a,b)=>b.rating-a.rating)[0];
      const worst=all.slice().sort((a,b)=>a.rating-b.rating)[0];
      qs.push({q:`Who were ${s}'s best-graded players?`,
        a:`${best.player} (${best.role||"QB"}) led qualified ${s} players at ${Math.round(best.rating)} of 100 on the ${SEASON_RESULTS} Hashmark Grade scale${all.length>1&&worst.player!==best.player?`; ${worst.player} (${worst.role||"QB"}) graded lowest among qualifiers at ${Math.round(worst.rating)}`:""}. Value-in-role grades from play-by-play, ${SEASON_RESULTS} season, qualified snap floors only.`});
    } else qs.push({q:`Who were ${s}'s best-graded players?`,
        a:`No qualified ${SEASON_RESULTS} grades on file for ${s} — players below the snap/attempt floors aren't graded (small samples grade dishonestly). ${SEASON_SCHED} grades start with the games.`}); }
  // 8 (U59) — conference championships (records-book ledger; era-honest)
  if(d.confT&&d.confT.length){
    const last=d.confT[d.confT.length-1];
    const confs=[...new Set(d.confT.map(x=>x.conference))];
    qs.push({q:`How many conference championships has ${s} won?`,
      a:`${d.confT.length} on the NCAA records-book ledger${confs.length>1?` across ${confs.length} conferences (${confs.join(", ")})`:` (all in the ${confs[0]})`}, most recently ${last.season}${last.shared?" (shared)":""}. Titles are credited in the conference as named at the time — never retro-assigned to current affiliations.`});
  }
  // 9 (U59) — national award winners (records-book ledger; Heisman via heisman.com)
  if(d.awards&&d.awards.length){
    const recent=d.awards.slice(0,3).map(a=>`${a.player} (${a.season} ${a.award})`).join("; ");

      a:`Yes — ${d.awards.length} national award win${d.awards.length===1?"":"s"} on the NCAA records-book ledger, most recently ${recent}. Full list on the History tab; every row carries its source.`});
  }
  return qs;
}
function u53FactCandidates(t, d){
  const s=t.school, out=[];
  if(d.hist && d.hist.longest_win_streak>=10)
    out.push({f:`${s}'s longest win streak is ${d.hist.longest_win_streak} straight, ${d.hist.streak_start}-${d.hist.streak_end}.`, src:`team_history ledger · ${d.hist.era_label}`});
  if(d.hist)
    out.push({f:`${s} has played ${d.hist.games.toLocaleString()} games since ${d.hist.first_season} — ${d.hist.wins} wins, ${d.hist.losses} losses${d.hist.ties?`, ${d.hist.ties} ties`:""}.`, src:`team_history ledger · ${d.hist.era_label}`});
  d.rivs.forEach(r=>{ const lead=r.official_w>r.official_l?r.school_a:r.school_b;
    out.push({f:`${r.trophy?`"${r.trophy}": `:""}${r.school_a}-${r.school_b} stands ${r.official_w}-${r.official_l}-${r.official_t} all-time (official record) — ${lead} leads after ${r.official_games} meetings.`,
      src:`rivalries registry (Tier A, vacatur-adjusted official record)`}); });
  const titles=d.champs.filter(c=>!c.vacated&&!c.split);
  if(titles.length)
    out.push({f:`${s}'s poll-era title years: ${titles.map(c=>c.season).join(", ")}.`, src:`championships ledger (poll/playoff-era definition, splits + vacaturs labeled)`});
  // U59: records-book facts (award winners + conference-title counts)
  if(d.awards&&d.awards.length){ const a=d.awards[0];
    out.push({f:`${a.player} won the ${a.season} ${a.award} for ${s}.`, src:`award_winners ledger · NCAA records book (Awards.pdf)`}); }
  if(d.confT&&d.confT.length>=5)
    out.push({f:`${s} owns ${d.confT.length} conference titles on the NCAA records-book ledger, most recently ${d.confT[d.confT.length-1].season}.`, src:`conference_titles ledger · credited in the conference as named at the time`});
  return out;
}
function u53SectionHTML(t, e, games, teamId){
  if(!e.u53) return "";
  const d={...e.u53, preSosRank:e.preSos&&e.preSos.sos_rank};
  const qs=u53FAQ(t, d, games, teamId);
  if(!qs.length) return "";
  // JSON-LD mirror of the exact rendered strings (schema.org FAQPage)
  const ld={ "@context":"https://schema.org", "@type":"FAQPage",
    mainEntity: qs.map(x=>({ "@type":"Question", name:x.q,
      acceptedAnswer:{ "@type":"Answer", text:x.a } })) };
  try{
    let sc=document.getElementById("u53jsonld");
    if(!sc){ sc=document.createElement("script"); sc.id="u53jsonld";
      sc.type="application/ld+json"; document.head.appendChild(sc); }
    sc.textContent=JSON.stringify(ld);
  }catch(_e){}
  let h=`<div class="sec" id="u53faq" style="margin:10px 2px"><div class="sectitle">${esc(t.school)} — quick answers <small>· computed from stored data at render, never written by an AI</small></div>`;
  qs.forEach((x,i)=>{
    h+=`<div class="acc"><button class="acchdr" data-acc="u53q${i}" aria-expanded="false">${esc(x.q)}
        ${x.badge==="modeled"?`<span class="nilmodeled" style="margin-left:6px">modeled</span>`:""}
        <svg class="ic accchev" aria-hidden="true"><use href="#i-chev-d"/></svg></button>
      <div id="accb-u53q${i}" hidden><div class="secsub" style="padding:2px 14px 12px">${esc(x.a)}</div></div></div>`;
  });
  h+=`</div>`;
  // "Did you know" — rotates daily per team, U13 rows only, era + source labeled
  const cands=u53FactCandidates(t, d);
  if(cands.length){
    const rng=u52Rng(`hashmark-fact-${u52Day()}-${teamId}`);
    const pick=cands[Math.floor(rng()*cands.length)];
    h+=`<div class="sec" id="u53fact" style="margin:0 2px 10px;padding:12px 14px">
      <div class="eyebrow" style="margin-bottom:5px">Did you know · rotates daily</div>
      <div style="font-size:13px;font-weight:600;line-height:1.5">${esc(pick.f)}</div>
      <div class="ha" style="padding:5px 0 0">Source: ${esc(pick.src)} — a stored row, never an invented fact.</div></div>`;
  }
  return h;
}

function hmSection(hm, t){
  if(!hm) return "";
  const comps=(hm.comps||[]).filter(c=>CMETA[c.component]);
  const cmax=Math.max(0.0001, ...comps.map(c=>Math.abs(Number(c.value))));
  let rowsH="";
  CORDER.forEach(k=>{ const c=comps.find(x=>x.component===k); if(!c) return;
    const v=Number(c.value), w=Math.abs(v)/cmax*100;
    rowsH+=`<div class="driver" data-tip="${esc(CMETA[k].name+" — "+CMETA[k].tip)}">
      <div class="dvk">${CMETA[k].name}</div>
      <div class="dvbar"><div class="mid"></div><i class="${v>=0?"pos":"neg"}" style="${v>=0?"left:50%":"right:50%"};width:${Math.max(2,w/2)}%"></i></div>
      <div class="dvv">${(v>=0?"+":"")+Number(v).toFixed(3)}</div></div>`; });
  return `<div class="sec"><div class="sectitle">Hashmark rating <small>${phaseLabel()} · free</small></div>
    <div class="drating"><div class="dbig" data-tip="Hashmark overall power rating — opponent-adjusted efficiency blended with results, roster and coaching factors. 0 = FBS average; the breakdown below sums exactly to this number.">${Number(hm.overall).toFixed(3)}</div>

        <span data-tip="${esc('Defense unit rating — '+CMETA.def_eff.tip)}">DEF ${hm.def!=null?Number(hm.def).toFixed(2):"—"}</span></div></div>
    ${waterfallSVG(hm.comps||[], Number(hm.overall), t)}
    ${rowsH?`<div class="secsub" style="padding:6px 2px 2px">What's driving it (tap a factor):</div>${rowsH}`:""}
    </div>`;
}

// batch 12 #3: the bubble-panel engine. Each panel's data loads on FIRST open and caches
// (all closures live per page-visit, so a new openDetail starts clean); bubble taps swap
// the single #tp-panel in place and NEVER push history — Back always leaves the team page.
// Deep links (#team/:id/:tab) were considered and skipped: the app routes by history
// state, not URL fragments, so a hash router would be a new subsystem, not a cheap add.
// U28: the team's conference table inside a bubble panel — standings-renderer
// markup reused (.stconf/.sthead/.strow), the team's own row highlighted,
// DIVISIONAL conferences (Sun Belt East/West) grouped by teams.division.
async function teamStandingsPanel(teamId, t){
  const conf=(t&&t.conference)||"";
  if(!conf) return `<div class="secsub" style="padding:10px 2px">No conference on file.</div>`;
  const [rows, divs] = await Promise.all([
    api(`standings?select=team_id,school,conference,wins,losses,conf_wins,conf_losses,streak,sos_rank,conf_rank&season=eq.${SEASON_RESULTS}&conference=eq.${encodeURIComponent(conf)}&order=conf_rank.asc.nullslast`).catch(()=>[]),
    api(`teams?select=id,division&conference=eq.${encodeURIComponent(conf)}`).catch(()=>[]) ]);
  if(!rows.length) return `<div class="secsub" style="padding:10px 2px">No ${esc(conf)} standings on file yet.</div>`;
  const divOf={}; divs.forEach(d=>{ if(d.division) divOf[d.id]=d.division; });
  const groups={};
  rows.forEach(r=>{ (groups[divOf[r.team_id]||""]=groups[divOf[r.team_id]||""]||[]).push(r); });
  const gkeys=Object.keys(groups).sort((a,b)=>(a===""?1:b===""?-1:a.localeCompare(b)));
  const hasDivs=gkeys.some(k=>k!=="");
  let h=`<div class="sec" style="padding-top:2px"><div class="sectitle">${esc(conf)} — ${SEASON_RESULTS} standings</div>`;
  gkeys.forEach(gk=>{
    if(gk) h+=`<div class="stconf">${esc(gk)}</div>`;
    else if(hasDivs) h+=`<div class="stconf">Division TBD — new member, alignment not yet published</div>`;
    h+=`<div class="sthead"><div></div><div></div><div></div><div>Overall</div><div>Conf</div><div>Strk</div></div>`;
    groups[gk].forEach((r,i)=>{ const tm=teamMeta[r.team_id]||{school:r.school};
      h+=`<div class="strow${String(r.team_id)===String(teamId)?" me":""}" data-team="${r.team_id}">
        <div class="srk">${r.conf_rank||i+1}</div>
        ${crestEl("glcr",tm.school,oppColor(r.team_id))}
        <div class="snm">${esc(r.school)}<small>SoS #${r.sos_rank||"—"}</small></div>
        <div class="srec">${r.wins}–${r.losses}</div>
        <div class="srec">${r.conf_wins}–${r.conf_losses}</div>
        <div class="sstrk ${_strkCls(r.streak)}">${esc(r.streak||"—")}</div></div>`; });
  });
  h+=`<div class="navrow" style="padding-top:8px"><button class="navbtn" data-go="standings">Full FBS standings</button></div></div>`;
  return h;
}

// U29: the ONE season sub-toggle rendered at the top of the Stats / Schedule /

function wireTeamPanels(teamId, t, games, e, swap26){

      const cat=await ensureCatalog(); await ensureBaselines();

  // U1 (B1 #2): the Stats panel body for one season — behind the 2026/2025 sub-toggle.

  const hmBlock=()=> hmSection(e.hm, t) || `<div class="sec" style="padding-top:6px">

  // U36b: the season's opponents' stat rows + games, for the OPP column. Opponents

        const gmap={}; (tseas||[]).forEach(r=>gmap[r.team_id]=Number(r.games_played)||0);

  const tpStatsBody=async yr=>{

  // U29: the Schedule panel's sub-toggle bodies — 2026 = the upcoming schedule,

  const tpSchedBody=async yr=>{

    if(!C.data.gamelog)

  // U35: the Players panel — every player's official season stats (player_season),

  // and the same LOW SAMPLE badge + SHRINK_TIP, so the chip always matches the page

  const PL_LINE={passing:[["YDS","yds"],["TD","TD"],["INT","INT"]],
    rushing:[["CAR","car"],["YDS","yds"],["TD","TD"]],
    receiving:[["REC","rec"],["YDS","yds"],["TD","TD"]],
    defensive:[["TOT","tkl"],["TFL","TFL"],["SACKS","sacks"],["INT","INT"]],
    kicking:[["FGM","FG"],["FGA","att"],["PTS","pts"]]};
  const PL_GROUPS=[["QB",["QB"]],["Running backs",["RB","FB","HB","TB"]],["Receivers",["WR"]],
    ["Tight ends",["TE"]],["Offensive line",["OL","OT","OG","C","G","T"]],
    ["Defensive line",["DL","DE","DT","NT","EDGE"]],["Linebackers",["LB","ILB","OLB","MLB"]],
    ["Secondary",["DB","CB","S","FS","SS","NB"]],["Special teams",["K","P","LS","PK"]]];
  const plFmt=v=>{ const n=Number(v); return n%1?n.toFixed(1):n.toLocaleString(); };
  const loadPlayers=async yr=>{
    C.data.pl35=C.data.pl35||{};
    if(!C.data.pl35[yr]){
      await ensureCoverage();   // U69: measured era line for LIMITED DATA tips
      const rows=await J(`player_season?select=athlete_id,player,position,category,stats,headline&team_id=eq.${teamId}&season=eq.${yr}`);
      let grades=[];
      if(SHOW_HASHMARK_RATINGS && rows.length){

        const [qb,pv]=await Promise.all([

        grades=[...qb.map(r=>({...r,role:"qb",season:yr})),...pv.map(r=>({...r,season:yr}))];   // U69: the badge tip cites the season's measured coverage
      }

  const tpPlayersBody=async yr=>{

    const P={};

    const sort=C.data.plSort||"prod";

    news: async()=> (await teamNewsHTML(teamId))

        C.data.players=await J(`team_returning_leaders?select=player,position,category,stat_key,value&season=eq.${STAT_SEASON}&team_id=eq.${teamId}`);
      return teamLeaders(C.data.players||[]) || emptyNote("No returning-leader data on file yet."); },
    splits25: async()=>{ const sp=await loadSplits();
      return teamSplitsSection((sp||[]).filter(x=>Number(x.season||STAT_SEASON)===SEASON_RESULTS), t.school, SEASON_RESULTS)
        || emptyNote(`No ${SEASON_RESULTS} situational splits on file.`); },
    // U13: the team History bubble — all-time ledger, poll-era + claimed titles,
    // conference titles (honest empty until the records-book ingest), rivalry cards
    hist: async()=>{ if(!C.data.hist){
        const [th, ch, cl, rv, ct, aw]=await Promise.all([
          J(`team_history?select=*&team_id=eq.${teamId}`),
          J(`championships?select=*&school=eq.${encodeURIComponent(t.school)}&order=season.asc`),

const seasonTag = s => `${s} ${s===SEASON_RESULTS?"":"· prior"}`.trim();
function _glStat(stats, key){ const v=stats&&stats[key]; return v==null||v===""?null:v; }
// the compact stat shown on a game-log row (total yards, then turnovers)
function glLine(stats){
  const ty=_glStat(stats,"totalYards"), to=_glStat(stats,"turnovers");
  let bits=[]; if(ty!=null) bits.push(`${Number(ty).toLocaleString()} yds`);
  if(to!=null) bits.push(`${to} TO`);
  return bits.join(" · ")||"—";
}
function gameLogSection(rows, teamId){

// team-page situational splits (off vs def EPA/play + success rate), grouped
const SPLIT_GROUPS = [
  ["Down", "down", ["1st down","2nd down","3rd down"]],
  ["Situation", "situation", ["3rd & short","3rd & long"]],
  ["Field", "field", ["Red zone"]],
  ["By quarter", "quarter", ["Q1","Q2","Q3","Q4"]],
  ["Location", "location", ["Home","Away","Neutral"]],
  ["By outcome", "result", ["In wins","In losses"]],
  ["Competition", "vs", ["vs Ranked (AP)"]],
];
function teamSplitsSection(splits, school, season){
  season = season || STAT_SEASON;
  if(!splits.length) return "";
  school=school||"This team";
  const by={}; splits.forEach(s=>{ by[`${s.side}|${s.split_type}|${s.split_key}`]=s; });
  const cell=(s)=> s ? `<b>${(s.epa_per_play>0?"+":"")+Number(s.epa_per_play).toFixed(2)}</b><small>${(Number(s.success_rate)*100).toFixed(0)}% SR</small>` : "—";
  let h=`<div class="sec"><div class="sectitle">${season} situational splits</div>
    <div class="secsub">EPA/play &amp; success rate by situation, from official play-by-play (garbage time removed). <b>Off</b> = this team's offense; <b>Def</b> = what its defense allowed (lower is better). ${season}. Source: CFBD.${season<SEASON_SCHED?` <b>Updates to ${SEASON_SCHED} once the first 3 games of the season are complete.</b>`:""}</div>
    <div class="splithead"><div></div><div>Offense</div><div>Defense (allowed)</div></div>`;
  SPLIT_GROUPS.forEach(([label,stype,keys])=>{
    const present=keys.filter(k=>by[`off|${stype}|${k}`]||by[`def|${stype}|${k}`]);
    if(!present.length) return;
    h+=`<div class="splitgrp">${label}</div>`;
    present.forEach(k=>{
      const so=by[`off|${stype}|${k}`], sd=by[`def|${stype}|${k}`];
      const bs=_baselines&&_baselines.split_sr[`off|${stype}|${k}`];
      let tip=`${label} — ${k}. `;
      if(so) tip+=`On a typical ${k} play, ${school}'s offense ${Number(so.epa_per_play)>=0?"gains":"loses"} about `+
        `${Math.abs(Number(so.epa_per_play)).toFixed(2)} expected points and stays on schedule `+
        `${Math.round(Number(so.success_rate)*100)}% of the time`+
        (bs!=null?` — the national average is about ${Math.round(bs*100)}%`:"")+`. `;
      if(sd) tip+=`Its defense allows ${Number(sd.epa_per_play).toFixed(2)} EPA/play there `+
        `(${Math.round(Number(sd.success_rate)*100)}% success allowed — lower is better).`;
      h+=`<div class="splitrow"><div class="slk" data-tip="${esc(tip)}">${esc(k)}</div>
        <div class="slv off">${cell(so)}</div>
        <div class="slv def">${cell(sd)}</div></div>`;
    });
  });
  return h+`</div>`;
}

function boxCrest(id){ const t=teamMeta[id]||{school:"?"}; return crestEl("boxcr", t.school, oppColor(id)); }
function renderBox(gameId, tg, pg, fromTeam, um){

    document.querySelector(".back").onclick=navBack; return; }
  // home on the left (fall back to the row order)

  let B=tg.find(r=>r!==A)||tg[1];
  const tA=teamMeta[A.team_id]||{school:B.opponent_name||"?"}, tB=teamMeta[B.team_id]||{school:A.opponent_name||"?"};
  const neutral=A.home_away!=="home"&&B.home_away!=="home";
  const sLabel=`${A.season} ${A.season_type==="postseason"?"Bowl / CFP":"Week "+A.week}`;

        <div class="bpts ${B.result==='W'?'win':''}">${B.points!=null?B.points:"—"}</div></div>
    </div>`;
  // team stats comparison
  h+=`<div class="sec"><div class="sectitle">Team stats</div>
    <div class="boxhead"><div>${esc(tA.school)}</div><div></div><div>${esc(tB.school)}</div></div>`;
  BOX_TEAM.forEach(([k,label,dir])=>{
    const va=_glStat(A.stats,k), vb=_glStat(B.stats,k);

    if(dir&&va!=null&&vb!=null){ const na=_numv(va),nb=_numv(vb);

      <div class="bk">${label}</div><div class="bvb ${wb}">${vb==null?"—":esc(String(vb))}</div></div>`;
  });
  // ADVANCED box score (U4.1) — per-unit efficiency / explosiveness / finishing / havoc from
  // garbage-time-filtered play-by-play (game_unit_metrics; descriptive stats, no ratings)
  const uA=(um||[]).find(r=>String(r.offense_id)===String(A.team_id));
  const uB=(um||[]).find(r=>String(r.offense_id)===String(B.team_id));
  if(uA||uB){
    const f3=v=>v==null?"—":Number(v).toFixed(3), f2=v=>v==null?"—":Number(v).toFixed(2),
          pc=v=>v==null?"—":(100*Number(v)).toFixed(1)+"%";
    // S1: every column label explains itself in plain English (tap/hover the label)
    const ADV=[["epa_play","EPA / play (offense)",f3,1,"Expected points added per play — the scoring value the offense creates on an average snap. Higher is better."],
               ["success_rate","Success rate",pc,1,"Share of plays that keep the offense on schedule (half the needed yards on 1st down, 70% on 2nd, all of it on 3rd/4th). Higher is better."],
               ["explosive_rate","Explosive-play rate",pc,1,"Share of plays that gain a big chunk of value at once — breakaway runs and deep completions. Higher is better."],
               ["iso_ppp","IsoPPP (EPA on successes)",f3,1,"Value per SUCCESSFUL play only — when it works, how big is it? Separates efficiency from explosiveness. Higher is better."],
               ["pts_per_drive","Points / drive",f2,1,"Points scored per offensive possession. Higher is better."],
               ["pts_per_opp","Points / scoring opp",f2,1,"Points per trip inside the opponent's 40-yard line — how well drives get finished. Higher is better."],
               ["field_pos","Avg start (yds to goal)",f2,-1,"Average starting field position, measured as yards to the end zone. Lower is better."],
               ["havoc_rate","Havoc allowed",pc,-1,"Share of this offense's plays where the defense created a tackle for loss, forced fumble, pass break-up, or interception. Lower is better."],
               ["plays","Plays (non-garbage)",v=>v==null?"—":v,0,"Offensive snaps with garbage time removed — the sample behind these rates."]];
    h+=`<div class="boxhead adv" data-tip="Per-unit advanced stats from play-by-play, garbage-time filtered. Offense perspective: each column is that team's OFFENSE (havoc = disruptions allowed). Descriptive game stats — not Hashmark ratings.">
      <div>${esc(tA.school)} off.</div><div>advanced <svg class="ic" aria-hidden="true"><use href="#i-info"/></svg></div><div>${esc(tB.school)} off.</div></div>`;
    ADV.forEach(([k,label,fmt,dir,tip])=>{
      const va=uA?uA[k]:null, vb=uB?uB[k]:null;
      if(va==null&&vb==null) return;
      let wa="",wb="";
      if(dir&&va!=null&&vb!=null&&Number(va)!==Number(vb)){
        const aWin=dir>0?Number(va)>Number(vb):Number(va)<Number(vb);
        if(aWin)wa="win"; else wb="win"; }
      h+=`<div class="boxrow"><div class="bva ${wa}">${fmt(va)}</div><div class="bk" data-tip="${esc(tip)}">${label}</div><div class="bvb ${wb}">${fmt(vb)}</div></div>`;
    });
  } else if(A.off_epa!=null||B.off_epa!=null){
    const ep=v=>v==null?"—":Number(v).toFixed(3);
    h+=`<div class="boxhead adv"><div>${esc(tA.school)}</div><div></div><div>${esc(tB.school)}</div></div>
      <div class="boxrow"><div class="bva">${ep(A.off_epa)}</div><div class="bk">EPA/play (off)</div><div class="bvb">${ep(B.off_epa)}</div></div>
      <div class="boxrow"><div class="bva">${A.off_plays??"—"}</div><div class="bk">Plays (off)</div><div class="bvb">${B.off_plays??"—"}</div></div>`;
  }
  h+=`</div>`;
  // player stats — grouped by team then category
  [A,B].forEach(side=>{
    const t=teamMeta[side.team_id]||{school:"?"};
    const mine=pg.filter(p=>String(p.team_id)===String(side.team_id));
    if(!mine.length) return;
    h+=`<div class="sec"><div class="sectitle">${esc(t.school)} — players</div>`;
    BOX_PLAYERS.forEach(([cat,label,types,sortKey])=>{
      const ps=mine.filter(p=>p.category===cat&&p.stats&&Object.keys(p.stats).length)
        .sort((a,b)=>_numv(b.stats[sortKey])-_numv(a.stats[sortKey])).slice(0,6);
      if(!ps.length) return;
      h+=`<div class="boxpcat">${label}</div>
        <div class="boxptbl"><div class="boxprow head"><div class="bpn"></div>${types.map(t=>`<div>${t}</div>`).join("")}</div>`;
      ps.forEach(p=>{ h+=`<div class="boxprow"><div class="bpn"${p.athlete_id?` data-player="${p.athlete_id}"`:""}>${esc(p.player||"")}</div>
        ${types.map(t=>`<div>${p.stats[t]!=null?esc(String(p.stats[t])):"—"}</div>`).join("")}</div>`; });
      h+=`</div>`;
    });
    h+=`</div>`;
  });
  h+=`<div class="note"><b>Official box score — ${sLabel}.</b> Team &amp; player game stats and per-game EPA/play, from CFBD play-by-play. No Hashmark ratings or projections shown. ${BRAND_LINE}</div></div>`;
  app.innerHTML=h;
  document.querySelector(".back").onclick=navBack;
}

// ---------- compare tool (free-tier flagship: single-game projection) ----------
// Engine constants from the Hashmark model (wf-ridge-v1). The margin model is
//   margin = beta * zdiff + hfa * home_field   (build_winprob.py serving engine)
// where zdiff is the difference of the teams' z-scored power ratings; sigma is the
// CALIBRATED win-prob sigma (calibration_report.md: fitted 16.75, not the raw residual
// SD ~18.1). P(win)=Phi(margin/sigma), exactly as ratings.win_probability() does.
// PINNED (HFA-fix brief, 2026-07-03) — must equal build_winprob.py's serving params:
//   beta 9.429 pts/board-z (refit pooled 2016-23 on the board scale; the old 8.342 was
//   stale) · hfa 2.017 (inseason_params.json, pooled through 2024 — the old 2.975 was a
//   noisy single 2025 fold). NEVER pull these from prediction_log: in-season rows carry a
//   beta calibrated to a DIFFERENT zdiff scale (11.096) and would inflate every margin.
//   sync_web.py --check verifies these against the model repo on every deploy.
const ENGINE = { beta: 9.429, hfa: 2.005, sigma: 16.75 };
async function ensureEngine(){ return ENGINE; }
function erf(x){ // Abramowitz & Stegun 7.1.26, |err| < 1.5e-7
  const s=x<0?-1:1; x=Math.abs(x); const t=1/(1+0.3275911*x);
  const y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x);
  return s*y;
}
const winProb = m => 0.5*(1+erf((m/ENGINE.sigma)/Math.sqrt(2)));

let cmp = {a:null,b:null,venue:"neutral"};
let boardSD = 0;            // cross-team SD of `overall` -> converts ratings to unit-z
const compCache = {};       // team_id -> {component: value}

async function fetchComps(teamId){
  if(compCache[teamId]) return compCache[teamId];
  const rows = await api(`rating_components?select=component,value&season=eq.${SEASON_SCHED}&week=eq.0&team_id=eq.${teamId}`);
  const cv={}; rows.forEach(c=>cv[c.component]=Number(c.value));
  compCache[teamId]=cv; return cv;
}

function fmtStat(v, fmt){
  if(v==null||v==="") return "—"; v=Number(v);
  switch(fmt){
    case "int": return Math.round(v).toLocaleString();
    case "1dp": return v.toFixed(1);
    case "2dp": return v.toFixed(2);
    case "3dp": return v.toFixed(3);
    case "pct": return (v*100).toFixed(1)+"%";
    case "signed": return (v>0?"+":"")+Math.round(v);
    case "signed1": return (v>0?"+":"")+v.toFixed(1);
    case "time": { const m=Math.floor(v/60), s=Math.round(v%60); return m+":"+String(s).padStart(2,"0"); }
    default: return v.toFixed(1);
  }
}

const PLAYER_SEASON_SHOW = {
  passing:["YDS","TD","INT","PCT","ATT","COMPLETIONS","YPA","QBR"],
  rushing:["YDS","TD","CAR","YPC","LONG"],

};
